%，在提高，但仍远低于GPIF的40%和GPFG的97%。中国资本市场容量有限，把大量资金配置在单一市场，风险集中度高，扩大境外配置是分散风险的必然选择。\n\n三是权益比例受限。SSF的股票类资产配置比例上限约40%，低于GPFG的70%和CPP的60%以上。权益比例低意味着长期收益潜力受限，短期波动虽小，长期复利效应的差距却很大。\n\n> **【中国SSF vs 国际同行：规模3.32万亿 vs GPIF 10万亿/GPFG】** 12万亿；境外配置13% vs GPIF 40%/GPFG 97%；股票上限40% vs GPFG 70%。差距来自制度约束（投资范围限制）和治理结构（谨慎偏好）。提升运营收益需要：扩大规模、提高境外配置、放宽权益比例。\n\n提升的方向：\n1. 扩大SSF管理规模：更多基本养老保险基金委托SSF运营（目前委托3.52万亿，但全国结余超9万亿，还有大量资金在各省内沉淀，存银行跑不赢CPI）。\n2. 提高境外配置：从13%逐步提高到30%以上，对标GPIF，需要放宽境外投资审批和额度限制。\n3. 放宽权益比例：从40%上限提高到50-60%，增加长期收益潜力。\n4. 完善治理结构：给SSF更多投资自主权，减少行政干预，建立专业的投资决策委员会。\n\n基本养老保险基金的委托运营也在推进。2025年末委托SSF运营的基本养老保险基金规模达3.52万亿元，年均收益率5.00%。但全国基本养老保险累计结余超9万亿，意味着还有近6万亿在各省内沉淀，没有市场化运营。把这6万亿的哪怕一半委托出去，SSF管理的总规模就能翻番。\n\n## 四、做强第二支柱：企业年金的覆盖率困局\n\n企业年金是养老保障的第二支柱，即用人单位为职工建立的补充养老保险。2024年末，全国企业年金规模3.64万亿元，参加职工3242万人，仅占城镇就业人口的约**9%**。\n\n9%的覆盖率意味着第二支柱基本是“体制内福利”，参加的多是国企、央企和少数大企业，中小企业、民营企业几乎不建企业年金。\n\n覆盖率低的原因：\n1. 门槛高：建立企业年金需要用人单位和职工协商一致，企业有完全的自主权，也可以选择不建。\n2. 成本重：企业已经缴了20%的养老保险费，再建企业年金等于再加一笔5-8%的支出，多数企业无力承担。\n3. 税收优惠有限：企业年金缴费在工资总额5%以内税前扣除，个人缴费4%以内税前扣除，优惠力度不足以激励大规模建立。\n4. 流动性差：职工跳槽时企业年金可转移，但手续复杂，部分选择直接提取，影响连续性。\n\n> **【企业年金3.64万亿、3242万人参加，仅占城镇就业9%。覆盖面狭窄使第二支柱形】**同虚设。破局路径：降低门槛、自动加入机制（opt-out）、扩大税优、中小企业集合计划。职业年金（机关事业单位）3.11万亿，合计二三支柱约6.75万亿，但覆盖人群不到城镇就业15%。\n\n破局的路径：\n1. 降低建立门槛：允许中小企业以行业、区域为单位建立集合年金计划，降低单个企业的行政成本。\n2. 自动加入机制（opt-out）：借鉴英国2012年自动加入（auto-enrolment）职业养老金的经验，职工默认参加，不想参加可以主动退出，opt-out比opt-in的参与率高数倍。\n3. 扩大税收优惠：企业缴费税前扣除比例从5%提高到8%，个人缴费从4%提高到6%。\n4. 简化转移接续：建立全国统一的企业年金账户系统，跳槽时自动转移。\n\n## 五、第三支柱：个人养老金的“开户热缴存冷”\n\n2022年，个人养老金制度正式启动，这是养老保障的第三支柱。参加人通过个人养老金账户自主缴费、自主投资，享受税收优惠（EET模式，即缴费和投资收益环节免税，领取环节按3%低税率）。\n\n到2024年末，个人养老金开户数达**7279万**，开户很热；缴存却冷，实际缴存人数不到开户数的21%，人均年缴存额远低于12000元上限。\n\n开户热缴存冷的原因：\n1. 税优力度不够：12000元年度限额、3%领取税率，对高收入者有吸引力（边际税率高，递延效果好），对中低收入者吸引力弱（边际税率本就低或为零，递延意义不大）。\n2. 产品单一：可选产品主要是养老目标基金、养老理财、养老保险、养老储蓄，种类不够丰富，收益不够吸引人。\n3. 流动性顾虑：钱进去要等到退休才能取，年轻人觉得太遥远，中间急用钱也取不出来。\n4. 信任不足：资本市场波动大，2022-2024年A股持续低迷，个人养老金投资收益不佳，降低了缴存意愿。\n\n> **【个人养老金开户热缴存冷：开户7279万但缴存率不足21%。原因：税优对中低收入者】**吸引力弱、产品单一、流动性限制、资本市场低迷导致收益不佳。破局需要：TEE选项（缴费不免税但领取免税）、默认投资选项、提高限额、丰富产品线。来源：报告04。\n\n破局的路径：\n1. 增加TEE选项：当前只有EET模式（缴费免税、领取征税），可增加TEE选项（缴费不免税、投资收益免税、领取免税），对中低收入者更有吸引力。\n2. 默认投资选项：不懂投资的参加者默认配置到一个目标日期基金，随年龄自动调整股债比例，降低选择困难。\n3. 提高限额：从12000元/年提高到24000元或更高，给有意愿多存的人空间。\n4. 放宽领取条件：允许在购房、大病等特殊情况下提前领取，增加灵活性。\n5. 丰富产品：引入更多长期限、稳健收益的产品，如基础设施REITs、社保基金跟投产品等。\n\n## 六、费基做实：征管改革\n\n费率不能涨、补贴不能涨，文章只能做在费基上。名义费率24%，实际征缴率可能只有15-18%，中间6-9个百分点的差距就是费基不实造成的。\n\n2019年起，社保征管体制改革启动，社保费改由税务部门统一征收。改革的初衷是：税务部门掌握企业工资信息，能够核实缴费基数，减少企业少缴漏缴。\n\n但改革推进有阻力。企业担心按实际工资缴费意味着成本上升，对劳动密集型中小企业冲击尤其大；地方政府担心严格执行可能导致企业倒闭、失业增加。2019年的改革一度暂缓执行，改为逐步过渡。\n\n费基做实是正确方向，但需要平衡：\n1. 统一缴费基数口径：目前各地口径不一（有的含奖金、有的不含），应全国统一。\n2. 降低名义费率对冲做实：如果费基做实了（实际征缴率从15%提到20%），可以相应下调名义费率（从24%降到20%），企业实际负担不增加，制度却更公平。\n3. 灵活就业人员参保改革：两亿多灵活就业人员参保率低，需要设计适合灵活就业的缴费方式，如按收入而非固定基数缴费、允许断缴续缴。\n\n## 七、多元筹资组合\n\n把以上五条路径汇总，多元筹资的组合是：\n\n| 筹资渠道 | 当前规模/水平 | 改革方向 | 预期增量 |\n|:---:|:---:|------|:---:|\n| 划转国有资本 | 1.68万亿（分红几百亿/年）| 持续做大+提高上缴率+部分变现 | 分红翻倍至千亿+ |\n| 基金运营收益 | 3.32万亿SSF+3.52万亿委托，年均5-8% | 扩大规模+提高境外/权益配置 | 年均收益从5%→7-8% |\n| 第二支柱 | 3.64万亿，覆盖9% | 自动加入+降低门槛+扩税优 | 覆盖率9%→20%+ |\n| 第三支柱 | 开户7279万，缴存率<21% | TEE+默认投资+提高限额 | 缴存率→40%+ |\n| 费基做实 | 名义24%实际15-18% | 税务征收+统一口径+降名义费率对冲 | 实际征缴率→20% |\n\n多元筹资不是中国的独创，发达国家早已走在这条路上。\n\n日本社保的财源结构是“保险费5成+公费4成+患者1成”，公费即税收占比四成，意味着日本的社保筹资本身就是费税双轨。2012年社保·税一体改革将消费税从5%提到10%，就是为了扩大税收这一轨。但消费税上调的政治代价极为惨重，执政党多次更替，安倍2012年重返政权的重要议题之一就是推迟第二次上调。日本的经验是：筹资多元化方向正确，但增税路径的政治阻力巨大，不如先走划转国有资本和提升运营收益这两条阻力更小的路。\n\n挪威的政府养老基金全球（GPFG）是一个极端案例，基金规模约18万亿挪威克朗（约12万亿人民币），几乎全部配置海外（97%以上），股票约70%。GPFG的资金来源是石油收入，挪威把石油收入存起来，作为未来养老金的战略储备。中国没有挪威的石油禀赋，但有更大规模的国有资产，国企净资产超过80万亿。划转10%只是第一步，持续做大划转规模、提高运营收益，就是中国的“石油基金”。\n\n加拿大的养老金计划投资委员会（CPP）管理约5000亿加元，这是一个部分积累制的公共养老金基金。CPP的特殊之处在于既是现收现付（当期缴费用于当期给付），又有部分积累（超过当期给付的缴费进入基金投资），近十年年均名义收益率约10%，在全球公共养老金基金中名列前茅。CPP的经验是：即使不搞完全积累，部分积累加专业化运营也能产生显著收益。\n\n三个国家的经验指向同一个结论：**单一筹资渠道不可持续，多元筹资是必由之路。** 日本靠增税（消费税），挪威靠资源（石油），加拿大靠运营（投资收益），中国可以三者并举：划转国有资本，类似挪威的资源路径；提升SSF运营，对标加拿大CPP；发展二三支柱，分担第一支柱压力；做实费基，释放降费空间。\n\n五路并行，不是五条互不相干的路，而是相互支撑。划转国有资本做大了SSF底盘；SSF运营收益提升，使委托规模扩大更有吸引力；二三支柱发展分担了第一支柱的压力；费基做实使名义费率有下调空间。\n\n增税之外的路径，并非不增钱，而是用更多方式、更高效地增钱。不是逼企业和职工掏更多，而是盘活国有资产存量、提升资金运营效率、拓宽筹资渠道、做实缴费基础。这才是大保障的筹资观：超越“费率+补贴”二元结构，构建多元筹资的可持续组合。\n\n下一章讲统筹层级的跃升和NDC化重构，那是制度结构层面的出路。"}, {"part": "下编", "partName": "出路与方案", "num": "第九章", "title": "从碎片到统一", "md": "\n![](figs/09.png)\n*插图 · 09*\n\n\n## 一、全国统筹的半步\n\n中国养老保险的全国统筹，走的是一条“半步半步”的路。\n\n2018年，中央调剂金制度启动，各省按缴费基数的一定比例上缴资金（最初3%），由中央分配给收支缺口省份。这是全国统筹的“零点五步”，不是统一基金池，而是抽肥补瘦的调剂。\n\n2022年，全国统筹正式启动，上缴比例提高，调剂力度加大。但启动的不是全国统一征缴、统一发放的真正统筹，而是各省征缴、上缴一部分、接受分配的调剂模式。\n\n> **【全国统筹的半步特征：2018年中央调剂金（上缴3%）→ 2022年全国统筹（上缴】**比例提高）→ 目标：全国统一基金池。目前仍在调剂阶段，各省仍各自征缴，省级基金池仍然独立。真正的全国统筹意味着：一个缴费基数口径、一个费率、一个基金池、一个给付标准。\n\n为什么走半步？不是不想走全步，是制度转型的成本太高。一步到位的全国统筹意味着：广东的结余立刻变成全国基金池的一部分，广东人缴纳的社保费立刻发给黑龙江的退休人员。这在政治上的阻力极大，广东会问：凭什么我缴的钱养别人的老人？\n\n但调剂模式有一个根本缺陷：**调剂只是补窟窿，不改变碎片化的结构。** 各省仍各自征缴、各自管理，基金配置效率依然低下。调剂规模取决于上缴比例，比例低则调剂力度弱，比例高则各省抵触大。\n\n调剂模式的历史数据能说明问题。2018年中央调剂制度启动，当年七省做贡献、二十二省受益。2018到2021年，中央调剂累计跨省调剂资金六千多亿元。2021年调剂比例提高到4.5%，调剂规模9327亿元。2022年全国统筹启动后，上缴比例进一步提高，调剂力度加大。但这串数字背后有个结构性事实：调剂资金的流向高度集中，东北三省每年拿走超两千亿，中西部人口流出省份是大头。贡献省主要是广东、北京、浙江这些人口流入、结余充裕的沿海省份。\n\n调剂模式的根本缺陷在于：它只调余缺，不动结构。各省仍各自征缴、各自管理、各自确定缴费基数和待遇计发办法。广东的结余上缴一部分后，剩下的还是广东管；黑龙江的缺口靠调剂补上，但黑龙江的征缴效率、费基真实性、统筹层级，这些结构性问题一个没解决。调剂是输血，不是造血。而且调剂比例是个博弈点：比例低则调剂力度弱，缺口省不够用；比例高则贡献省抵触大，凭什么我缴的钱养别人的老人。这个博弈每到年底预算编制时就上演一次。真正的全国统筹，不是每年算账调剂，而是从征缴端就统一，做到一个缴费基数口径、一个费率、一个基金池、一个给付标准。到那一步，全国统筹才不是文件上的措辞，而是每一个参保人感知到的权益统一。\n\n真正的出路是**统一基金池**，但这不是一步到位能实现的，需要分阶段：\n\n第一阶段（已完成）：中央调剂金→全国统筹调剂，建立跨省资金流动机制。\n\n第二阶段（正在做）：统一缴费基数口径、统一费率、统一征缴流程，消除各省在征缴标准上的差异。\n\n第三阶段（待推进）：真正统一基金池。各省征缴的资金直接进入全国基金，由中央统一管理、统一投资、统一发放。到这一步，全国统筹才名副其实。\n\n## 二、城乡衔接与三轨并轨\n\n三轨并行是碎片化最尖锐的表现。统一的方向是三轨合一，但不是简单合并，而是分层整合。\n\n城乡衔接是第一步。城镇职工养老保险和城乡居民养老保险目前分设，但已经建立了制度衔接通道，参保人从城乡居民养老保险转入城镇职工养老保险时，个人账户余额可转移、缴费年限可折算。但衔接仍不顺畅，转移时折算比例低，参保人觉得吃亏，很多人选择不转。\n\n折算比例低是个技术问题，也是个制度问题。城乡居民养老保险的缴费水平低，多数地方每年缴几百块，对应的待遇也低。转入城镇职工养老保险时，居民养老保险的缴费年限要折算成职工养老保险的缴费年限，折算比例通常很低，因为两边缴费水平差几倍甚至十几倍，简单按1:1折算对职工养老保险的参保人不公平。但折算比例一低，居民养老保险参保人就觉得亏了：缴了好几年，转过去不算数，谁愿意转？\n\n结果就是不转。大量进城务工的农村居民，在农村参加了居民养老保险，进城后又该参加城镇职工养老保险，但两套制度衔接不畅，很多人两头都不靠：农村那份缴着但待遇低，城镇那份没参保或断保。到退休时，要么按居民养老保险领两三百块，要么按职工养老保险领，但缴费年限不够。这个群体估计上亿人，卡在两套制度之间，是碎片化最直接的受害者。\n\n改进方向：简化转移接续流程，提高折算比例，甚至考虑将城乡居民养老保险的基础养老金部分纳入城镇职工统筹，逐步消除城乡制度鸿沟。\n\n机关事业并轨是第二步。2014年改革名义上统一了机关事业单位和企业职工的养老保险制度，都实行统账结合，但过渡期设置（2014-2024年十年过渡）和职业年金补充使实际待遇差距延续。2024年过渡期结束，待遇差距不会自动消失。\n\n> **【三轨并轨的路径：城乡衔接（已有通道但折算低）→ 机关事业并轨（2014年名义统一】**，2024年过渡期结束，但职业年金使差距延续）→ 最终目标：统一的基础养老金（普惠）+ 统一的个人账户（NDC）+ 自愿补充（职业年金/企业年金/个人养老金）。三轨不是合并为“一轨”，而是分解为“三层”：基础层统一、个人层统一、补充层自愿。\n\n真正的三轨合一不是合并为一轨，而是分解为三层：\n\n- 基础层：统一的基础养老金（普惠性，由财政和统筹基金共同保障），不分城乡、不分身份，所有国民退休后都能领到一笔基础养老金。\n- 个人层：统一的个人账户（NDC），所有缴费者都有一个名义账户，多缴多得，账户可跨地区、跨制度无损转移。\n- 补充层：自愿参加的职业年金、企业年金、个人养老金，多缴多得、市场运营。\n\n三层结构对应世界银行的多支柱模型，但中国的版本应该更强调基础层统一和个人层可携带，因为碎片化的根源就是身份壁垒和地理切割。\n\n## 三、个人账户可携带性\n\n劳动力跨地区流动时，养老保险关系的转移接续是一个长期痛点。\n\n目前的转移接续规则：个人账户余额可以全额转移，但社会统筹部分只能转移缴费基数的12%（2010年之前不能转移）。这意味着跨省跳槽时，统筹账户里的大部分钱留在原省，这就是“便携性损失”。\n\n> **【养老保险跨省转移接续的“便携性损失”：个人账户可全额转移，但统筹部分仅转12%。】**一个在广东工作十年、月均工资8000元的人跳槽到北京，个人账户约8万元可转走，但统筹部分（雇主缴的16%×10年×8000元×12月=15.4万）只能转12%即1.85万，其余13.5万留在广东。这就是便携性损失：跳槽一次损失大半统筹权益。\n\n便携性损失的根源是统筹碎片化，各省的统筹基金是独立的，转出去意味着原省的基金流失。如果全国统一基金池，这个问题自然消失，因为全国就是一个基金池，不需要转。\n\n在统一基金池实现之前，改进便携性的过渡方案：\n1. 提高统筹部分转移比例：从12%提高到50%甚至100%。\n2. 建设全国养老保险权益记录系统：建立全国统一的个人权益记录，缴费记录跨省无缝累计，资金清算在后台完成。\n3. 名义账户化：如果个人账户是NDC，权益记录就是核心，资金不需要实物转移，只需要权益记录转移。\n\n全国权益记录系统的建设已经在推。2019年人社部启动全国统一的社会保险公共服务平台建设，2020年底上线，参保人可以通过电子社保卡、掌上12333查询跨省缴费记录。但查询和清算是两回事。目前系统能做到的是让参保人看到自己各省的缴费累计，资金的跨省清算仍走传统流程：转移接续要申请、要审核、要划转，周期长、手续繁。\n\n如果个人账户NDC化，权益记录就是核心，资金不需要实物转移，只需要权益记录转移。各省之间的资金清算在后台完成，参保人只管缴费、不管转到哪。NDC的可携带性天然优于实物积累制，这是NDC化对统筹改革的重要支撑：没有NDC化，全国统一基金池和可携带性都缺一块技术底盘。\n\n## 四、NDC化：把空账从问题转为制度特征\n\n第四章已经分析过：中国的个人账户空账与瑞典NDC在形式上高度相似，都是名义记账、PAYG运行、缴费确定。区别在于瑞典正式承认并设计了精算体系，中国没有承认也缺乏精算设计。空账不是制度失误，而是统账结合在转轨成本压力下的必然演化路径。与其假装空账不存在，不如承认它、设计它，让已经做的事变成正式要做的事。\n\nNDC化的核心思路是：**与其维持名实不符的统账结合（名义上有个人账户但实际是空的），不如正式承认名义账户化，并补上精算设计。**\n\nNDC的精算设计有三个要件：\n\n### （一）名义账户累积\n\n$$NAB = \\sum_{t=1}^{T} c_t \\cdot w_t \\cdot \\prod_{s=t+1}^{T} (1 + \\bar{g}_s)$$\n\n其中 $NAB$ 是名义账户余额，$c_t$ 是第 $t$ 年缴费率，$w_t$ 是工资，$\\bar{g}_s$ 是名义收益率（通常跟随工资增长率或人均GDP增长率）。\n\n每年缴费记入名义账户，按名义收益率（不是真实投资收益，而是跟随经济增长的虚拟收益率）累积。退休时账户余额决定待遇水平，多缴多得。\n\n### （二）寿命指数化\n\n$$P = \\frac{NAB}{D(a, e)}$$\n\n退休时，名义账户余额 $NAB$ 除以年金因子 $D(a, e)$ 得到年金额。年金因子取决于退休年龄 $a$ 和退休时点预期寿命 $e$。\n\n> **【寿命指数化的原理：退休时预期寿命越长，年金因子越大，每年领取的金额越少。这不是少】**发钱，而是把钱分摊到更长的领取期。一个60岁退休、预期再活25年的人，和60岁退休、预期再活20年的人，如果账户余额相同，前者的年金额应该低于后者，因为要分摊到25年而非20年。长寿风险由个人承担，而非制度兜底，这就是精算公平。\n\n寿命指数化的意义在于长寿风险的自动分担。当人口预期寿命延长时，年金因子自动增大，年金额自动减小，不需要每次都开会决定降多少。这就是把政治决策外包给公式的精髓。\n\n### （三）自动调整\n\n瑞典的刹车机制：当系统资产/负债比低于1时，自动触发指数化削减。\n\n$$\\text{调整率} = \\begin{cases} 1 + g_w & \\text{if } \\frac{A}{L} \\geq 1 \\\\ 1 + g_w \\times \\frac{A}{L} & \\text{if } \\frac{A}{L} < 1 \\end{cases}$$\n\n其中 $A$ 是系统资产（缴费流现值+缓冲基金），$L$ 是系统负债（已计养老金权利现值）。当 $A/L < 1$（系统不平衡）时，调整率自动降低，待遇增长被压减。\n\n三个要件合在一起，构成NDC的精算体系：**名义账户记录缴费+寿命指数化分担长寿风险+自动调整应对人口结构变化。** 这不是放弃积累制，积累制在中国从来就没真正运行过，而是把已经在做的事情（名义记账）做规范、做精算。\n\n**表：NDC与传统DB-PAYG制度对比**\n\n| 维度 | 传统DB-PAYG（中国当前） | NDC（改革方向） |\n|:---:|---|---|\n| 账户性质 | 名义账户（空账，未承认） | 名义账户（正式承认） |\n| 待遇确定 | 待遇确定型（DB） | 缴费确定型（DC形式） |\n| 长寿风险 | 制度兜底（不可持续） | 寿命指数化自动分担 |\n| 待遇调整 | 行政决策（政治化） | 公式自动调整（去政治化） |\n| 激励相容 | 弱（空账降低信任） | 强（多缴多得，账户可携带） |\n| 代际公平 | 隐性失衡（无调整机制） | 自动平衡（依赖比内生化） |\n| 政治成本 | 每次改革高（街头抗议） | 低（公式自动调整） |\n\n## 五、三位一体的制度重构\n\n全国统一基金池、NDC化、自动调整机制，三者构成一个完整的制度重构方案。\n\n全国统一基金池解决地理碎片化：各省基金合并为一个全国池，资金配置效率最大化。\n\nNDC化解决身份碎片化：名义账户记录个人权益，不分城乡、不分编制、不分机关企业，跨地区流动时权益无损转移。\n\n自动调整机制解决时间碎片化：每年待遇调整不再是政治决策，而是公式自动计算，人口结构变化时制度自动适应。\n\n三位一体不是乌托邦，它有现实的参照系。瑞典的NDC+刹车机制+AP缓冲基金，就是这套体系的运行版本。中国不需要发明，需要的是借鉴和本土化。\n\n当然，中国的制度环境与瑞典不同。瑞典的改革有五党共识、有强大的社会信任、有小国寡民的行政简便。中国是十四亿人口、三轨并行、省际失衡严重、社会信任基础不同。改革不能照搬，但原理可以借鉴，路径可以设计。路径要自己走出来。路虽远，脚下即是起点。\n\n本土化的关键有三条。一是利益协调。全国统筹意味着结余省的钱流向缺口省，需要中央的权威和省际间的利益协调机制。中国的政治体制，党的统一领导，恰好为这种跨省利益调整提供了制度条件，这是瑞典没有的优势。二是过渡设计。三轨并行不是一夜能合并的，需要分阶段：先做实省级统筹，再推全国统一基金池；先做城乡衔接，再推三轨三层；先承认NDC，再补精算设计。每一步都不能一步到位，但每一步都不能停。三是公众沟通。门诊共济改革的教训说明，技术正确的改革如果沟通不足、补偿机制设计欠精细，也会引发信任危机。NDC化、全国统筹、自动调整，这些改革比门诊共济复杂十倍，沟通的难度也大十倍。技术方案要有，沟通方案也要有。\n\n从碎片到统一，是这本书的终极命题。不是技术活，是制度重构。重构的勇气和智慧，来自对困境的清醒认知（上编）、对镜鉴的深度理解（中编）、对出路的系统设计（下编）。下一章讲最后一个技术工具，自动调整与照护，然后第十一章收束全书。"}, {"part": "下编", "partName": "出路与方案", "num": "第十章", "title": "自动调整与照护之维", "md": "\n## 一、把政治决策外包给公式\n\n社会保障改革最大的阻力是什么？不是技术，技术上该怎么做其实很清楚：调费率、降待遇、延退休。最大的阻力是政治，每项调整都得罪人，每次决策都要付出政治成本。\n\n涨费率，企业抗议；降待遇，退休人员抗议；延退休，全体劳动者抗议。每条路都有反对者，每项改革都要面对街头。法国2023年退休改革，总理动用宪法第49.3条强行通过，全国百万人上街，巴黎垃圾堆积如山。\n\n有没有办法绕过这个政治困境？有，**把政治决策外包给公式。**\n\n自动调整机制的核心思想是：提前设定一个公式，让制度参数（费率、待遇、退休年龄）根据人口和经济数据自动调整。不需要每次都开会、投票、面对抗议，公式算出来是多少就是多少。\n\n这不是偷懒，是智慧。政治决策的特点是责任可追溯，涨费率是哪个政客的决定，可以追到他头上；公式调整的特点是责任分散，待遇降了，不是因为某个政客，而是因为人口结构变了、公式自动算出来的。公众可能不满意，但愤怒的对象是数学和人口，不是某届政府。\n\n## 二、瑞典刹车：资产/负债比低于1就自动削减\n\n瑞典NDC系统的核心创新是“自动平衡机制”（auto-balance mechanism），俗称“刹车”（bromsen）。\n\n原理：系统有一个资产/负债比 $A/L$。资产 $A$ = 未来缴费流的现值 + AP缓冲基金市值。负债 $L$ = 已计养老金权利的现值。当 $A/L \\geq 1$ 时，系统平衡，养老金按正常指数化（跟随工资增长）调整；当 $A/L < 1$ 时系统失衡，自动触发刹车，指数化被削减，养老金增长放缓或停止。\n\n> **【瑞典刹车机制：系统资产/负债比$A/L$低于1时自动削减养老金指数化。2010年】**、2011年、2014年实际触发过削减。瑞典养老基金管理局（SPA）估计：AP缓冲基金市值需从2025年估值下跌约89%，系统才会触发刹车，可见系统韧性之强。2026年瑞典拟引入对称的gas rule分配盈余，即刹车处理赤字、gas处理盈余，使机制更对称。来源：报告03。\n\n刹车机制的意义不在于削了多少，实际触发次数并不多，而在于给市场信心。投资者、评级机构、公众看到制度内置了自动平衡机制，知道这个制度不会失控，不需要等到危机爆发才改革，公式会提前调整。2026年瑞典还在讨论引入对称的gas rule，刹车处理赤字、gas处理盈余，使机制两头都能动。这个对称设计的潜台词是：自动调整不能只削不补，只削会让公众觉得制度只会克扣；加一个盈余分配机制，让公众看到制度景气时也会多给，改革的政治可持续性才更稳。\n\n## 三、德国可持续性因子：把人口变量写进待遇公式\n\n德国没有像瑞典那样搞NDC，它保留了传统的DB-PAYG制度，但在2004年往待遇调整公式里塞了一个可持续性因子。\n\n$$s_{t+1} = s_t \\times \\left(1 + g_w \\times (1 - \\lambda) + \\lambda \\times \\Delta D_{ratio}\\right)$$\n\n简化理解：替代率 $s$ 的年度变化 = 工资增长 $g_w$ × (1-可持续因子权重) + 系统依赖比变化 $\\Delta D_{ratio}$ × 可持续因子权重 $\\lambda$。\n\n当老龄化加剧、系统依赖比（缴费者/领取者之比）恶化时，$\\Delta D_{ratio}$ 为负，养老金增长被压减。当系统依赖比改善时（假设），养老金增长可以加速。\n\n> **【德国2004年可持续性因子使未来净替代率降至53.3%，低于OECD平均63.2】**%。如果永久暂停该因子，替代率将高出约5个百分点。代价是财政不可持续。德国2024年Rentenpaket II改革锁定48%替代率至2040年，并设立Generationenkapital代际资本基金（股票基金）以资本市场收益补贴。来源：报告03。\n\n德国2024年Rentenpaket II这一步棋，是2004年可持续性因子的延续和补丁。2004年的因子让替代率持续下行，到2024年已经压到53.3%，再往下走政治上扛不住。Rentenpaket II做了一个微妙的平衡：一边把48%的替代率水平锁定到2040年，等于给可持续性因子设了一个地板，不能再压了；另一边设立代际资本基金（Generationenkapital），由德国联邦银行管理一个公开的股票基金，用资本市场收益补贴养老金缺口。这等于承认了一个现实：纯靠现收现付和可持续性因子已经不够，得引入存量资产的增值来补流量缺口。德国人的思路是可持续性因子压住支出端、代际资本基金撑起收入端，两条腿走路。中国目前这两条腿都还没有，年度调整是行政决策，战略储备的境外配置仅13%。德国的路径提示了一个完整的改革包：不是单一公式，而是自动调整加资本运作的组合拳。\n\n## 四、退休年龄与预期寿命挂钩\n\n退休年龄是另一个需要自动调整的参数。\n\n中国当前的延迟退休方案：2025年起渐进式落地，男职工60→63岁，女职工50→55岁、女干部55→58岁，十五年到位。到2040年到位。\n\n但2040年之后呢？预期寿命还在延长，2050年可能超80岁，63岁退休后还有17年领取期。如果退休年龄不继续调整，抚养比又会恶化。\n\n丹麦的做法：退休年龄与预期寿命自动挂钩，每五年评估一次，根据预期寿命变化自动调整退休年龄。预期寿命延长一岁，退休年龄相应延后。这个机制使退休年龄成为自动参数，而非政治决策。\n\n丹麦这套机制的细节值得拆开看。丹麦2006年改革立法规定，退休年龄自2019年起按“预期寿命+五年”的规则自动调整，具体算法是取退休时点往前推的预期寿命，加上固定的领取期年数（最初设为19年），倒推出退休年龄。2019年到2022年退休年龄从65岁延到67岁，已经按这套规则走过两轮。下一次评估在2025年，预测退休年龄将在2030年延至68岁、2034年延至69岁。关键在于，这些数字是公式算出来的，不是议会吵出来的。每次评估之后，丹麦就业部公布一份技术报告，退休年龄的调整就生效，不需要单独立法。民众提前五年就知道自己的退休年龄会怎么变，有充足的适应时间。意大利2011年蒙蒂改革也引入了类似机制，退休年龄随预期寿命指数化调整，每三年评估一次。意大利2019年已经按这套规则把男性退休年龄从66岁延到67岁，下一次调整在2026年。\n\n> **【退休年龄与预期寿命自动挂钩的原理：预期寿命延长一岁，退休年龄相应延后。丹麦每五年】**评估一次自动调整。意义：退休年龄不再是固定参数，而是随人口现实自动适应的变量，不需要每次延退都搞一场政治博弈。中国目前是渐进式（15年到位到63岁），但缺乏与预期寿命自动挂钩的后续机制。\n\n中国可以借鉴：在2040年渐进式延迟到位后，引入退休年龄与预期寿命挂钩的自动调整机制，每五年评估一次，自动微调。微调的幅度小（每次几个月），社会阻力小；长期累积效应却大，二十年后可能自动延到65-67岁，三十年后到68岁。一次到位做不到的事，三十年分期付款反而做得成。\n\n## 五、温水煮青蛙的政治智慧\n\n自动调整机制的本质，是一种温水煮青蛙式的政治智慧。\n\n一次性大幅调整，比如退休年龄从60直接跳到65，社会震荡大，政治阻力大，可能触发大规模抗议。渐进式微调，每年延几个月，社会几乎无感，政治阻力小。长期累积下来，效果相同甚至更好。\n\n法国的反面教训：2023年马克龙试图将退休年龄从62提高到64，仅仅两年，就引发了全国百万人大罢工，最后动用宪法第49.3条强行通过，代价巨大。\n\n瑞典的正面经验：1998年NDC改革由五个政党共同设计，跨党派共识。2003年全面运行。自动调整机制使后续调整不需要每次都立法，刹车自动触发，退休年龄自动微调。公众虽然不满意削减，但理解这是公式算出来的，不是某个政党的决定。\n\n> **【政治可行性对比：法国2023年用宪法第49.3条强行通过退休改革（62→64岁）】**，全国百万人抗议。瑞典1998年NDC改革由五党共识推动，自动调整机制使后续调整去政治化。中国的体制不同于西方，没有选举政治的街头压力，但改革的社会成本依然存在。自动调整机制+跨部门共识+长过渡期=降低改革社会成本的三要素。\n\n中国的体制不同于西方，没有选举政治的街头压力，但改革的社会成本依然存在。2021年医保个人账户改革引发的退休人员不满，2025年延迟退休引发的社交媒体焦虑，都说明改革的社会成本不可忽视。自动调整机制、长过渡期、充分的公众沟通，三者组合起来，是降低改革社会成本的可行路径。\n\n## 六、照护的维度：长护保险\n\n以上讲的都是养老保险的自动调整。但社会保障还有一个维度被严重忽视，就是**长期照护**。\n\n一个人老了，不仅需要养老金（钱），还需要照护（人）。失能失智老人需要日常照料：喂饭、洗澡、翻身、如厕。这些事，家庭做不了或做不好，子女在外工作，配偶年迈力衰。\n\n日本在2000年实施的介护保险制度，是应对这个问题的制度创新。\n\n### 介护保险的制度设计\n\n> **【日本介护保险1997年立法、2000年实施。核心设计：①被保险者分两类，第1号（】**65岁以上）和第2号（40-64岁）；②要介护认定，由介护支援专门员（ケアマネージャー）评估失能等级；③给付分三类，居家服务（上门护理/日间服务/短期入住）、设施服务（养老院）、地域密着型服务（社区小规模多功能）；④利用者自付1成（10%）。给付费从2001年4.4兆日元膨胀至2023年11.5兆（2.6倍），2040年预计25.8兆。来源：报告02。\n\n介护保险的意义在于**社会化家庭照护负担**。以前，照护老人是家庭的责任，子女辞职回家、配偶全职照料，或者请不起护工只能自己扛。介护保险把照护从家庭私事变成社会公共事务，有专业评估、有服务供给、有费用分担。\n\n日本介护保险的演化轨迹，对中国长护险的制度设计有直接的参照价值。2000年制度起步时自付比例是1成（10%），2015年改革改为所得对应：低收入者1成、中收入者2成、高收入者3成。这一改动的逻辑是，随着给付总额膨胀（从4.4兆涨到11.5兆），1成自付的财政缺口越来越大，需要通过差异化自付把成本分摊给有支付能力的利用者。2015年改革还有一个关键动作，把特别养护老人之家（相当于中国的公办养老院）的新入所条件限定为要介护3以上，意思是中轻度失能者原则上回家接受居家服务，机构床位留给真正重度失能者。这一刀切下去，直接重塑了日本照护服务的结构：居家服务供给扩大，机构床位聚焦于重度，社区小规模多功能设施填补中间地带。2015年改革还有一个被反复提及的背景：2025年“团块世代”（1947-1949年出生的约800万人）将全部满75岁，进入后期高龄者医疗制度和介护保险制度的重灾区，这就是所谓的“2025年问题”。日本从2015年就开始为2025年布局地域包括ケア系统，把医疗、介护、预防、居住、生活支援五类服务在社区层面整合，目标是让老人即便重度化也能在住惯的地域走完最后一程。这个未雨绸缪提前十年布局的思路，值得中国长护险制度借鉴。中国的团块世代（1962-1975年出生的约2.5亿人）将在2027-2040年间陆续进入重度失能高发期，留给制度搭建的时间窗口只有十年左右。\n\n### 中国49城长护险试点\n\n中国从2016年起在49个城市试点长期护理保险，试点覆盖约1.5亿人口，但制度仍不成熟：筹资来源不统一（有的从医保基金划拨、有的另征保费），服务供给不足（专业护工缺乏），评估标准不一。\n\n> **【中国长护险试点现状（2024）：49个城市、约1.5亿人覆盖。问题：①筹资不稳定】**（多从医保基金划拨，缺乏独立筹资）；②服务供给不足（专业护工仅约50万人，缺口巨大）；③评估标准不统一（各地要介护认定标准差异大）；④居家服务弱（以机构照护为主，居家上门服务供给不足）。来源：报告02引用中国长护险试点评估文献。\n\n49城的样本里，几个先行城市的路径差异很值得看。青岛是2012年就先行探索的老试点，比国家试点早四年，做法是从医保基金划拨0.2-0.5个百分点作为长护险筹资，重度失能老人按床日定额给付，覆盖了相当一部分机构照护。上海2017年启动，建立了独立的老年照护统一需求评估体系，把失能分为六级，评估流程借鉴了日本的要介护认定，社区初评、专家复评、市级抽检，制度设计最接近日本介护保险。南通和苏州则把居家照护摆在更突出的位置，开发了上门服务包，助浴、助餐、助洁、康复指导，按服务包给付而非按床位给付。长春走了另一条路，重度失能老人的照护费用按比例报销，强调机构兜底。这几条路径各有长短，但都还停在试点城市的孤岛状态，评估标准不互通、待遇口径不一致、筹资来源五花八门。一个在青岛参保的失能老人搬到苏州，权益能不能带过去？目前没有答案。这正是碎片化试点的通病：验证了路径可行性，却没有打通路径之间的连接。\n\n借鉴日本经验的改进方向：\n1. 独立筹资：长护险应有独立筹资来源，不能长期依赖医保基金划拨，可以考虑与养老保险类似的“保险费+财政补贴”模式。\n2. 建立要照护认定体系：借鉴日本的要介护认定，由专业评估员评估失能等级，按等级给付，全国统一标准。\n3. 培养照护人才：50万专业护工远远不够，需要职业化培训、薪酬保障、职业发展通道，这可能成为未来最大的就业增长点之一。\n4. 居家优先：借鉴日本居家服务为核心的理念，大多数老人希望在家养老，社区上门服务比机构更经济，也更人性化。\n\n## 七、医保与长护险的协同\n\n长护险不只是多一个险种，它与医保有重要的协同关系。\n\n一是防止“压床”。没有长护险时，失能老人住进医院出不来，因为医院有护理、有医保报销，家里没有人管；出院回家又没有照护，形成压床现象，占用医疗资源。长护险提供居家照护服务后，失能老人可以回家，医院床位释放，医保支出减少。\n\n二是防止过度医疗。没有长护险时，失能老人的照护需求被转化为医疗需求，频繁住院、频繁检查、频繁用药，因为只有治病才能报销。有了长护险，照护需求由长护险给付满足，不需要靠住院治病来解决照护问题。\n\n> **【长护险与医保的协同：①防止压床，失能老人回家照护释放医院床位；②防止过度医疗，照】**护需求由长护险满足而非转化为医疗需求；③从“治病”到“照护”的范式转换，医疗资源用于治病，照护资源用于养人，各归其位。\n\n三是从治病到照护的范式转换，这是社会保障理念的深层转变。以前的社会保障以治病为核心，医疗保费用来治病，养老保险用来发钱。但人老了以后，最需要的可能不是治病，而是照护。慢性病、失能、失智，这些不是治得好的病，而是需要照料的状态。照护保险把社会保障从治病延伸到照护，这是一个范式级的扩展。\n\n集采11批加DRG/DIP支付改革，控的是医疗费用的价格和单次费用；长护险控的是医疗费用的量，通过分流照护需求，减少不必要的住院和用药。两者协同，集采控价、DRG控单次、长护险控总量，才能系统性地控制医疗支出增速。\n\n**表：自动调整机制国际对比**\n\n| 国家 | 机制名称 | 触发条件 | 调整对象 | 实际触发 |\n|:---:|---|---|---|---|\n| 瑞典 | 刹车（bromsen） | 资产/负债比<1 | 指数化削减 | 2010/2011/2014年 |\n| 德国 | 可持续性因子 | 系统依赖比变化 | 待遇增长减缓 | 2004年以来持续 |\n| 丹麦 | 退休年龄挂钩 | 预期寿命变化 | 退休年龄自动微调 | 每5年评估调整 |\n| 意大利 | 蒙蒂改革 | 预期寿命变化 | 退休年龄自动调整 | 2011年起 |\n| 中国 | 无 | — | 行政决策 | 每年国务院发文 |\n\n## 八、技术工具与制度创新\n\n这一章讲了两个主题，自动调整机制和长护保险，看似不相关，实则有内在联系。\n\n自动调整机制是**养老保险的技术工具**，让待遇调整去政治化，让制度自动适应人口结构变化。\n\n长护保险是**社会保障的制度创新**，把保障范围从养老加医疗扩展到照护，应对老龄化社会的新需求。\n\n两者都是在既定趋势下发挥制度能动性的实例。人口老龄化是不可逆的趋势，但不能因为趋势不可逆就什么都不做。自动调整让养老保险在老龄化下保持可持续，长护保险让社会保障在老龄化下覆盖新需求。制度的能动性，体现在主动适应，而非被动应对。\n\n下一章，也是全书的最后一章，把这些改革路径收束到一个更高的层面：人的能动性与制度的能动性，改善预期，形成良性循环。社会保障从被动救急转向主动共建，方才是这本书想说的最终命题。"}, {"part": "下编", "partName": "出路与方案", "num": "第十一章", "title": "能动性的觉醒", "md": "\n## 一、从“被动应对”到“主动参与”\n\n全书至此，讲清楚了三件事：困境是什么（上编），镜鉴给了什么（中编），出路在哪里（下编前两章）。但还有一个更高层面的问题没有回答：改革的终极目的，仅仅是让社保基金不破产吗？\n\n不是。\n\n改革的终极目的，是让社会保障从被动的危机应对变成主动的制度共建。这句话需要解释。\n\n当前增税议程的逻辑是被动应对：医保没钱了所以加费，养老没钱了所以延退，基金不够了所以划转国有资本，每项措施都是危机来了不得不做的被动反应。被动应对的特点是措施赶不上变化，等到缺口出现了才补，补了旧的新的又来，永远在追赶。\n\n主动参与的逻辑不同：不是等危机来了才行动，而是提前设计好制度，让人和制度都能主动适应变化。延迟退休不是被迫多干几年，而是主动延长社会参与年限；个人养老金不是被迫多存钱，而是主动规划生命周期；全国统筹不是被迫均贫富，而是主动优化资源配置。\n\n> **【被动应对vs主动参与：增税议程的逻辑是危机来了不得不补，永远在追赶；能动性的逻辑】**是提前设计制度，人和制度都主动适应变化。延迟退休从被迫多干几年变为主动延长参与，个人养老金从被迫多存变为主动规划，全国统筹从被迫均贫富变为主动优化配置。\n\n这个视角的转变，就是能动性的觉醒。人不是社会保障的被动接受者，制度的可持续性最终取决于人的参与。如果年轻人觉得“缴了也白缴”而逃保断保，制度再设计精妙也运行不了；如果退休人员觉得待遇在降而不满，再合理的自动调整也会被政治阻力推翻。人和制度是共生的，制度提供框架，人提供活力。\n\n## 二、人的能动性\n\n社会保障制度中，人的能动性有三个维度。\n\n一是延长参与。延迟退休最常听到的抱怨是要多干几年。但换一个角度看，延迟退休意味着一个人参与社会生产的时间更长，贡献的时间更长，领取的时间相对更短。这不是被迫多干，而是主动延长参与。\n\n一个60岁的人，预期再活20年。如果60岁退休，他缴纳了35年（25-60岁），领取20年，缴费与领取之比是1.75:1；如果65岁退休，他缴纳了40年（25-65岁），领取15年，缴费与领取之比是2.67:1。后者对制度的可持续性贡献大得多。\n\n但延长参与有个前提：这个人60岁时还有工作能力、还有岗位。这就要求劳动力市场不能有年龄歧视，继续教育要让60岁的人保持技能更新，健康状况要允许继续工作。这些都不是社保制度单独能解决的，需要就业政策、教育政策、健康政策的协同。\n\n国际上的经验值得对照。日本近年来60-64岁人群的就业率已经超过70%，在发达国家里是相当高的数字，背后是日本现役世代与高龄者协同的就业政策：鼓励企业返聘退休人员，设立银发人才中心，对雇用高龄者的企业给补贴。德国2023年的数据显示，14%的近期退休者继续工作，比例虽不及日本，但德国2026年将引入每月2000欧元的免税额，专门激励达到法定退休年龄者继续工作。北欧的灵活安全（flexicurity）模式提供了另一条路径，雇佣灵活、失业保障强、再培训跟得上，让60岁以上人群在就业市场里有被需要的位置。中国的现实是，劳动力市场对40岁以上的求职者已经存在显著的年龄门槛，55岁以上几乎被排斥在主流招聘之外。延迟退休如果不配套解决年龄歧视、不建立再培训体系，可能变成“延了退休年龄、延不了退休岗位”的尴尬：法定年龄延了，实际就业没跟上，中间形成既领不到养老金又找不到工作的真空带。这个真空带一旦出现，制度的社会成本会远超想象。\n\n二是主动规划。个人养老金的开户热缴存冷，表面原因是税优不够、产品不够吸引人，深层原因是中国人还没有主动规划养老的习惯和意识。在过去，养老是单位的事、是国家的事，个人不需要操心；现在第三支柱把选择权交给了个人，但个人还没准备好行使这个选择权。\n\n主动规划的培养需要时间。英国的自动加入（auto-enrolment）改革用了十年，才让职业养老金覆盖率从30%升到80%以上。中国的个人养老金也需要十年甚至更长的培育期，关键是让主动规划成为默认选项，让不规划成为需要主动退出的例外。\n\n三是健康管理。一个人活到80岁，最后十年的医疗费可能占一生的60%以上。但这些费用中很大一部分，慢性病管理、生活方式干预、早期筛查，如果在更早年龄段投入，可以大幅降低晚年支出。健康管理不是治病，是防病，是主动维护人力资本。\n\n> **【人的能动性三维度：①延长参与（延迟退休=主动延长社会贡献期）；②主动规划（个人养】**老金=主动生命周期规划）；③健康管理（预防=主动维护人力资本）。三个维度共同构成从被保障者到参与共建者的转变，社会保障不是单向的国家保障个人，而是双向的个人与制度共建。\n\n三个维度共同指向一个转变：**从被保障者到参与共建者。** 社会保障不是单向的国家保障个人，而是双向的个人与制度共建。缴费是贡献，延迟退休是贡献，健康管理是贡献，主动规划是贡献。人越主动参与，制度越可持续；制度越可持续，人越有信心参与，这就是良性循环的起点。\n\n## 三、制度的能动性\n\n制度不是被动的“收钱发钱机器”，它本身也应该有能动性。\n\n自动调整是主动适应。瑞典刹车机制、德国可持续性因子、退休年龄与预期寿命挂钩，这些不是被动削减待遇的工具，而是主动适应人口变化的机制。制度不等危机爆发才反应，在常态运行中就持续微调，保持长期平衡。\n\n全国统筹是主动优化。把31个省的基金池合并为一个全国池，不是抽肥补瘦的被动调剂，而是主动实现资金在全国范围内的最优配置。广东的结余不是被调剂走了，而是在全国基金池中发挥更大效率，包括投资运营效率。\n\nNDC化是主动选择。把空账从不得不接受的现状变为主动选择的制度形态，这不是认命，而是在理解了PAYG运行规律后的理性选择。NDC不是放弃积累制，积累制从来没有真正运行过，而是把已经在做的事情做规范。\n\n长护保险是主动扩展。不是等失能老人压垮医保和医院之后才被动建立照护体系，而是提前布局，把社会保障的覆盖范围从养老加医疗主动扩展到照护。\n\n> **【制度的能动性四表现：①自动调整=主动适应人口变化（不等危机才反应）；②全国统筹=】**主动优化资源配置（不是抽肥补瘦而是最优配置）；③NDC化=主动选择制度形态（不是认命而是理性选择）；④长护保险=主动扩展覆盖范围（不等压垮才被动建立）。制度的能动性核心：从危机应对变为前瞻设计。\n\n制度的能动性核心：**从危机应对变为前瞻设计。** 危机应对是被动，等出了问题才补；前瞻设计是主动，提前预判变化、设计机制、留出缓冲。自动调整机制、全国统筹、NDC化、长护保险，每一项都是前瞻设计的产物。\n\n前瞻设计的好处不只是防患于未然，更重要的是**改善预期**。\n\n## 四、改善预期：确定性是核心价值\n\n社会保障的核心价值是什么？不是多给钱，是给确定性。\n\n一个人知道自己老了以后每月能拿到多少养老金，这是确定性；知道自己病了能报销多少医疗费，这是确定性；知道自己失能了有照护服务，这也是确定性。这些确定性本身就是福利，比实际发放的钱更有价值。\n\n为什么？因为不确定性是最高的社会成本。\n\n> **【确定性是社会保障的核心价值，比实际发放的钱更有价值。一个人不知道老了能拿多少养老】**金，就会拼命存钱（预防性储蓄），挤压当前消费。一个企业不知道明年社保费率会不会涨，就会推迟投资和扩张。不确定性压低消费、压低投资、压低经济增长，比实际的财政负担更可怕。\n\n一个人不知道老了能拿多少养老金，就会拼命存钱，预防性储蓄挤压当前消费；一个企业不知道明年社保费率会不会涨，就会推迟投资和扩张。不确定性压低消费、压低投资、压低经济增长，比实际的财政负担更可怕。\n\n日本就是前车之鉴。日本人的预防性储蓄率居全球最高之列，不是因为富裕，而是因为对未来不确定。年金替代率持续下降，医疗自付比例可能上升，长护需求在膨胀，这些不确定性让日本人不敢花钱。通缩时期消费不振，不全是宏观经济问题，有相当一部分是社会保障不确定性导致的预防性行为。\n\n这个机制的量化证据在日本清晰可见。日本家庭金融资产约2000万亿日元，其中超过一半由65岁以上老年人持有，这一代人的储蓄动机里，防老和防病占了相当权重。2004年宏观经济滑动导入后，年轻一代对年金制度的信任度持续下滑，民调显示认为老了能领到养老金的日本人不足三成。信任下滑直接抬高了预防性储蓄，既然制度不可靠，就多存一点。结果就是日本经济的悖论：人均储蓄全球前列，但消费长期不振，通缩持续了二十多年。日本失去的二十年，至少有一部分是被社会保障不确定性偷走的。中国目前正走在类似的方向上：居民储蓄率长期高企，消费对GDP的贡献一直低于发达国家，宏观上反复呼吁扩内需却难以见效。一个不可忽略的解释是，社保确定性不足，居民不敢把预防性储蓄降下来。把确定性做实，储蓄才能松手，消费才能释放。这不是社保部门一家的事，是宏观经济的基础工程。\n\n改善预期的制度路径有四条：\n1. 自动调整机制，让待遇调整可预测。不是今年涨4%、明年涨3%、后年不知道，而是公式算出来涨多少就涨多少。\n2. 全国统筹，让跨地区流动的权益可预期。不是跳槽可能丢掉统筹权益，而是全国一个池，去哪都不丢。\n3. 长护保险，让失能后的照护可预期。不是老了失能了不知道谁来管，而是有制度保障、有服务供给。\n4. 二三支柱发展，让补充保障可预期。不是只靠基本养老金，而是有多层次保障、多渠道积累。\n\n当预期改善、确定性提高，预防性储蓄降低，消费释放，投资恢复，经济增长加速。经济增长加速→税收增加→财政补贴能力增强→社保更可持续→预期进一步改善，这就是良性循环。\n\n**表：恶性循环与良性循环对比**\n\n| 维度 | 恶性循环（当前趋势） | 良性循环（改革后） |\n|:---:|---|---|\n| 起点信号 | 老龄化→缺口扩大 | 制度重构→年轻人看到希望 |\n| 缴费意愿 | 下降（觉得缴了也白缴） | 上升（信任制度可持续） |\n| 基金状况 | 缺口扩大→补贴增加 | 基金充裕→补贴可降 |\n| 待遇预期 | 下降→不满增加 | 稳定→信心增强 |\n| 生育意愿 | 下降（负担重不敢生） | 可能回升（确定性提高） |\n| 人口结构 | 持续恶化 | 长期改善 |\n| 关键变量 | 不确定性→恐惧→保守 | 确定性→信心→参与 |\n\n## 五、良性循环的逻辑\n\n当前中国社保面临的是一个潜在的恶性循环：\n\n**人口老龄化 → 社保缺口扩大 → 增税增费压力 → 年轻人负担加重 → 生育意愿下降 → 人口结构进一步恶化 → 老龄化更严重**\n\n这个循环的核心节点是年轻人负担加重导致生育意愿下降。年轻人看到工资条上扣掉一大块社保费，觉得养不起孩子，生育率进一步下降，未来缴费者更少，缺口更大，负担更重，循环恶化。\n\n打破恶性循环的关键，不在循环的末端（鼓励生育），而在循环的起点：**制度重构让年轻人看到希望。**\n\n如果年轻人看到：\n- 社保制度是可持续的，不会到我老了就破产\n- 个人账户是真实的，多缴多得，不会被挪用\n- 待遇调整是可预测的，不会突然大幅下降\n- 全国统筹实现了，跳槽不丢权益\n- 有长护保险，父母老了有制度照护，不需要我辞职回家\n\n那么，缴费意愿上升→基金充裕→待遇有保障→年轻人信心增强→生育意愿可能回升→人口结构改善→老龄化压力减轻→制度更可持续，这就是良性循环。\n\n> **【良性循环的逻辑：制度重构→年轻人信任→缴费意愿高→基金充裕→待遇有保障→生育意愿】**回升→人口结构改善→老龄化压力减轻→制度更可持续。打破恶性循环的关键不在末端（鼓励生育），而在起点（制度重构让年轻人看到希望）。核心节点：确定性→信心→参与→可持续。\n\n良性循环不是乌托邦，它有数学基础。抚养比 $\\tau = s \\times D$ 这个公式告诉我们：如果制度可持续性改善（自动调整使 $s$ 不需要大幅下降），年轻人信心增强（缴费意愿提高使实际费基做实），生育意愿回升（$D$ 长期改善），三个变量同时改善，制度就从恶性循环转入良性循环。\n\n当然，生育意愿的回升不取决于社保一个因素，住房、教育、就业、文化都在起作用。但社保是基础变量，如果年轻人连老了有没有保障都不确定，谈不上考虑生孩子。\n\n北欧的经验恰好印证了这一点。瑞典、丹麦、挪威的总和生育率长期保持在1.7-1.9区间，远高于南欧的1.2-1.3，更高于东亚的1.0-1.2。学界对北欧生育率相对高的解释里，社会保障结构是一个高频变量：北欧国家的社保支出不仅压在养老和医疗上，还显著压在儿童照顾、育儿假、学前教育这些全世代项目上。瑞典父母共享480天带薪育儿假，丹麦公共托育覆盖几乎所有3岁以下儿童，芬兰每孩每月发放固定儿童津贴，这些制度让生孩子对一个家庭的财务冲击大幅降低。反观东亚的日本、韩国、中国，社保支出高度集中在养老和医疗，育儿支持要么薄弱要么缺位，结果是年轻人觉得养孩子是私事、养老人是公事，两头挤压之下生育意愿走低。日本2018年的全世代型社会保障改革正是要纠正这个失衡，把消费税增税的份额从养老医疗扩展到幼儿教育、保育无偿化、介护职员待遇改善，逻辑是用社保的存量重新分配给生育的一代。中国的恶性循环要破，北欧和日本这两个镜鉴都指向同一个方向：社保支出结构必须从老人偏重转向全世代平衡。这不是简单的加钱给育儿，而是把社保的再分配功能从单代扩展到多代。\n\n## 六、大保障的最终定位\n\n回到导论提出的命题：社会保障是社会主义市场经济的底层支柱。\n\n前三章讲的是怎么改：筹资重构、统筹跃升、自动调整与照护。这一章讲的是为什么改：不只是为了基金不破产，而是为了让人和市场都更有活力。\n\n好的社会保障降低预防性储蓄，释放消费，促进内需，带动经济增长。日本人的高储蓄率被长期诟病为消费不振的根源，但高储蓄率的成因之一正是社会保障不确定性。中国如果能把社保确定性提高，预防性储蓄降低哪怕5个百分点，释放出来的消费规模就是万亿级。这个万亿级消费的释放，比任何一轮消费券、家电下乡、以旧换新都更持久，因为它来自制度底层的确定性，不来自政策的临时刺激。确定性改善一次，消费红利吃十年。\n\n好的社会保障降低劳动力市场摩擦，促进流动，提高配置效率，同样落到经济增长。如果养老保险全国统筹、个人权益无损转移，劳动力跨地区流动的阻力降低，人往有效率的地方去，资源配置效率提升。\n\n好的社会保障稳定宏观经济，自动稳定器逆周期，衰退时托底消费，繁荣时回抽购买力，比每次衰退都开会决定发多少钱更及时、更精准。\n\n> **【大保障作为市场经济底层支柱的三重经济效应：①降低预防性储蓄→释放消费→促进内需；】**②降低劳动力市场摩擦→促进流动→提高配置效率；③自动稳定器→逆周期调节→稳定宏观。保障不是市场的累赘，而是市场的基础设施。好的保障让市场更有活力，不是更没活力。\n\n保障不是市场的累赘，而是市场的基础设施，好的保障让市场更有活力，不是更没活力。产权制度保障交易的预期收益，合同执行保障交易的可履行性，货币稳定保障交易的计算尺度，社会保障保障人在市场风险面前的底线安全，四根柱子缺一不可。这四根柱子里，社会保障是最被低估的一根。产权、合同、货币这些制度的市场经济功能，学界和政策界讨论了几十年，已经形成共识；但社会保障的市场经济功能，降低预防性储蓄、促进劳动力流动、提供自动稳定器，还停留在福利层面被理解，没有上升到基础设施层面被对待。这个认知滞后，正是中国社保改革反复卡在加钱不加制度层面的根源。\n\n大保障不是某个部委的业务，而是市场经济的底层支柱。理解这一点，才能理解为什么社保改革如此重要：它不只是让退休人员有钱领，而是让整个市场经济的底盘更稳。\n\n这本书的愿望，就是在这个层面上推进讨论，超越费率涨不涨、待遇降不降的技术争论，回到社会保障作为市场经济底层支柱的制度建构。在既定趋势与约束下，发挥人与制度的能动性，解决问题、改善预期、形成良性循环，最终促进我国国民福利得以保障增长。\n\n全书从钱去哪了开始，经过代际契约的裂痕、从单位到社会的转型、空账与转轨的包袱，到以日为鉴、观全球谱系、析中国症结，再到筹资重构、统筹跃升、自动调整与照护创新，最后落到能动性的觉醒。一条主线贯穿始终：社会保障不是危机来临时的被动救火，而是塑造国民预期、支撑市场经济、连接代际信任的底层制度。把这个底层制度搭稳了，人口老龄化的压力才有地方承接；搭不稳，再多的财政补贴也填不满一个漏水的池子。\n\n不是多收钱。是改制度。不是被动应对。是主动共建。"}, {"part": "结语", "partName": "从国家的人到社会的人", "num": "结语", "title": "从国家的人到社会的人", "md": "\n周弘在《走向人人享有保障的社会》结尾写了这样一段话：\n\n> “在新中国成立初期，一名国有企业的职工可能会说：'只要我认真工作，我就是国家的人了。'在发生了这一系列的变化过后，他应当说：'只要我按时缴费，我就是社会的人了。'”\n\n近百年。从1921年中国共产党建党伊始将“建立社会保险制度”写进纲领，到2010年《社会保险法》覆盖全民，近一个世纪的制度探索。\n\n这条路上有几代人的努力。1951年劳动保险条例的制定者，在战争废墟上搭起第一块基石。文革期间坚守的企业管理者，在统筹断裂后仍努力维持着退休金发放。1980年代摸着石头过河的改革者，在没有任何“红头文件”的情况下推动社会化的试点。1997年统账结合的设计者，试图兼取现收现付制和积累制之长。2010年社会保险法的立法者，用法律确认了覆盖全民的承诺。\n\n也有几代人的困惑。空账，缴费者发现个人账户里没有真钱；碎片，跳槽者发现养老保险关系转移接续困难；三轨，城乡居民发现月均246元不够生活；缺口，管理者发现剔除补贴后1.39万亿当期赤字。\n\n还有几代人的忧思。面对增税议程，一个在体制内分管产业政策的干部，在中信接触过养老金年金的运营实务后，感受到了一种弥漫的焦虑：医保没钱了、社保没钱了，增费率挤企业、延迟退休挤个人、补贴挤财政，三条路走哪条都不讨好。\n\n这本书就是从这份忧思开始的。\n\n## 一\n\n困境的根源，不是钱花错了地方。养老钱发给退休人员，医疗钱付给了医院，补贴钱补了缺口，钱都在该花的地方。问题在钱的进出方式：\n\n进来：名义费率24%但实际征缴15-18%，费基不实使收入不足；三轨并行使筹资碎片化，统筹层级低使配置效率低。\n\n出去：支出增速失控，医保13.5%的支出增速远超4.6%的收入增速；替代率从69%降到40%，但退休人员仍觉得不够；长护需求缺位使失能老人“压床”医院，照护需求转化为医疗支出。\n\n中间：个人账户空账使储蓄功能失效，名义上的统账结合实际退化为纯现收现付；转轨成本1.9-86万亿的隐性债务没有显性化分摊，持续以挪用个人账户的方式隐性消化；基金运营效率低，3.32万亿战略储备的境外配置仅13%、股票上限40%，远低于GPIF的40%境外和GPFG的97%境外。\n\n把这些进出中间的毛病串起来，有一个判断需要说清楚：中国社保不会崩盘，但会慢性失血。崩盘是急性病，某一年突然发不出养老金，社会动荡；失血是慢性病，每年补贴加一点、缺口大一点、结余少一点、替代率降一点，温水煮青蛙，十年二十年看下来，制度还在运转，但保障水平在慢慢缩水。慢性失血比崩盘更危险，因为它是隐性的，每一年看起来都没什么大问题，累积起来就是代际断层。今天的退休者领到3253元，二十年后同等购买力可能只剩两千出头；今天的财政补贴1.93万亿，十年后可能翻到三万亿。不会有哪一天突然出事，但每一天都在透支未来。这就是为什么这本书反复说：问题在制度不在钱。钱可以加，制度不改，加多少都是往漏水的桶里倒水。\n\n六重困境，人口结构、转轨成本、省际失衡、费率待遇、医保扩张、财政依赖，不是六个独立的问题，而是一个系统性症结的不同表现。这个症结，用两个字概括：**碎片化。**\n\n## 二\n\n出路不在多收钱。增税议程把问题简化为钱不够就加钱，但钱不够的根源是制度结构。碎片化、空账、三轨、运营低效，这些结构性毛病不解决，多收的钱也会被低效配置吞噬。\n\n出路在改制度，八个字：**筹资重构、统筹跃升。**\n\n筹资重构，从“费率+补贴”的二元结构，转向费、划转、运营、二三支柱、费基的五路并行。划转国有资本持续做大，提升SSF运营收益对标GPIF，做强企业年金把覆盖率从9%提到20%以上，破局个人养老金缴存冷，费基做实并用降名义费率对冲。五路并行，不是五条独立的路，而是相互支撑。\n\n五路怎么相互支撑？划转国有资本做大存量，存量大了运营收益才高；运营收益对标GPIF，收益高了基金充裕，补贴压力才降；企业年金覆盖率从9%提到20%以上，分流了第一支柱的压力，第一支柱费率才降得下来；个人养老金破局缴存冷，补了第三支柱，三支柱结构才平衡；费基做实，费基实了，降名义费率才不会伤基金。这五条路，动一条带动其余四条。反过来，只动一条不动其余，效果就被稀释：只做费基做实不提运营收益，是收上来了但跑不赢通胀；只提运营收益不做二三支柱，是存量投好了但流量仍压在第一支柱。所以出路必须系统性推进，不能单兵突进。\n\n统筹跃升，从31个省各自的基金池到全国统一基金池。三轨并行分解为三层结构：基础层统一普惠，个人层NDC可携带，补充层自愿。个人账户空账正式承认NDC化，补上精算设计，即名义账户+寿命指数化+自动调整三位一体。\n\n再加两个技术工具和一个制度创新。\n\n自动调整，即瑞典刹车机制、德国可持续性因子、退休年龄与预期寿命挂钩，把政治决策外包给公式，让制度在人口结构变化时自动适应。温水煮青蛙式的渐进调整，比一次性大幅改革的政治成本低得多。\n\n长护保险，借鉴日本介护保险，把社会保障从养老加医疗扩展到照护。独立筹资、要照护认定、培养照护人才、居家优先。与医保协同，防压床、防过度医疗，完成从治病到照护的范式转换。\n\n## 三\n\n但制度和技术的改革，最终服务于一个更高的目的：**让社会保障从被动的危机应对变成主动的制度共建。**\n\n人的能动性：延迟退休不是被迫多干几年，而是主动延长社会参与；个人养老金不是被迫多存钱，而是主动规划生命周期；健康管理不是被动治病，而是主动维护人力资本。从被保障者到参与共建者，人越主动参与，制度越可持续。\n\n制度的能动性：自动调整不是被动削减待遇，而是主动适应人口变化；全国统筹不是被迫均贫富，而是主动优化资源配置；NDC化不是认命空账，而是主动选择制度形态；长护保险不是被动增加支出，而是主动覆盖新需求。从危机应对到前瞻设计，制度越前瞻，预期越稳定。\n\n改善预期。确定性是社会保障的核心价值，比实际发放的钱更有价值；不确定性是最高的社会成本，预防性储蓄挤压消费，投资观望，增长放缓。改善预期的制度路径：自动调整使待遇可预测，全国统筹使权益可携带，长护保险使失能后有保障，二三支柱使补充有渠道。\n\n良性循环：制度重构让年轻人看到希望→缴费意愿上升→基金充裕→待遇有保障→信心增强→生育意愿可能回升→人口结构改善→老龄化压力减轻→制度更可持续。打破恶性循环的关键不在末端（鼓励生育），而在起点（制度重构让年轻人看到希望）。\n\n为什么关键在起点不在末端？因为生育意愿是结果不是原因。年轻人不生孩子，不是因为不喜欢孩子，是因为看不到确定性：不知道老了有没有养老金，不知道孩子上学贵不贵，不知道房子买不买得起，不知道工作稳不稳。确定性是社会保障的核心价值，当制度能提供你老了有保障、你病了有医保、你孩子有学上的承诺并且兑现，预期就稳了，预防性储蓄就降了，消费就释放了，增长就起来了，生育意愿才可能回升。制度重构是因，人口改善是果。因果不能倒置，先鼓励生育再改制度，是本末倒置。\n\n## 四\n\n大保障不是某个部委的业务，而是社会主义市场经济的底层支柱。\n\n市场经济需要四根柱子：产权制度、合同执行、货币稳定、社会保障。前三者保障交易的效率和可预期性，第四者保障人在市场风险面前的底线安全。没有社会保障的市场经济是丛林法则，有了社会保障的市场经济才是文明经济。\n\n好的保障降低预防性储蓄，释放消费，促进内需；好的保障降低劳动力市场摩擦，促进流动，提高配置效率；好的保障稳定宏观经济，自动稳定器逆周期。保障不是市场的累赘，是市场的基础设施，好的保障让市场更有活力，不是更没活力。保障给得起，市场才稳得住。劳动者敢于消费、敢于流动、敢于冒险，是因为底线有托。这是保障之锚的深意：锚住底线，风浪中才敢远航。\n\n锚有三重意思。\n\n第一重，稳定器。船在风浪中靠锚稳定，不漂走、不翻覆；市场经济在周期波动中靠社会保障稳定，衰退时社保托底消费，过热时社保回抽购买力。没有锚的船不敢出港，没有保障的市场不敢冒险。中国经济的内需长期不振，一个深层原因是预防性储蓄率偏高，老百姓不敢花钱，因为对老了病了失能了以后的保障不确定。把锚做牢了，不确定性降了，消费就敢释放。\n\n第二重，底线锚。锚把船固定在一个位置，不在风浪中漂移；社会保障把人的基本生活固定在一条底线之上，不在市场风险中坠落。这条底线不是高水平，是不跌穿。一个人知道自己最低也能拿到多少养老金、报销多少医疗费、失能后有照护，这条底线给了他参与市场的底气。不怕输，才敢搏。北欧人敢于创业，丹麦人敢于跳槽，因为有保障托底。中国如果能把这条底线锚牢，灵活就业者敢于消费，农民工敢于进城，年轻人敢于生育，经济活力就会释放。\n\n第三重，预期锚。锚不只是物理装置，它是一种心理承诺。船抛了锚，水手安心睡觉，知道明天醒来船还在。社会保障的另一个名字叫确定性，一个人知道明天会发生什么，就能做长期决策。买房子、生孩子、创业、投资，这些都需要长期视角，长期视角的前提是确定性，而确定性来自制度承诺。自动调整机制、全国统筹、长护保险，每一项改革都在增加确定性。确定性不是抽象的福利，它是消费、投资、生育的催化剂。\n\n三重锚意，稳定器、底线锚、预期锚，合在一起，就是保障之锚的完整含义。社会保障不只是一项支出，它是一种锚定。锚住了底线，市场才敢远航；锚住了预期，人才敢做长期决策；锚住了周期，经济才有韧性。这本书取名“保障之锚”，不是因为它讲保障，而是因为它讲的是保障如何锚定市场经济、锚定国民预期、锚定社会信心。三重锚定做好了，国民福利的保障增长就是水到渠成的事。\n\n## 五\n\n从国家的人到社会的人，这个转变还没有完成。\n\n空账、碎片、三轨，社会的人的权利还有太多窟窿。一个人从广东跳槽到黑龙江，养老保险关系转移接续的麻烦依然存在；一个农民工回乡，城镇职工养老保险能不能带回去仍是问题；个人账户里记着数字，账户里却没有真钱；机关事业退休6372元、企业退休3253元、城乡246元，社会的人的身份还没有完全取代身份的人。\n\n但方向已经清楚。\n\n统账结合的制度框架搭起来了，覆盖面铺开了，十多亿人纳入了保障网。接下来要做的是：把空账做实（或正式NDC化），把碎片统筹起来（全国统一基金池），把三轨合一（三层结构），把运营效率提上去（对标GPIF），把照护补上（长护保险），把自动调整嵌进去（瑞典刹车、德国因子）。\n\n这些改革不需要一蹴而就。每一步都是半步：中央调剂金是全国统筹的半步，渐进式延迟退休是到位的半步，49城长护险试点是全覆盖的半步。但半步累积起来就是全步，关键是方向正确、步履不停。\n\n半步累积的例子已经不少。中央调剂金是全国统筹的半步，从2018年的3%调剂到2022年的全国统筹启动，走了四年。渐进式延迟退休是到位的半步，十五年从60延到63，慢但到位。49城长护险试点是全覆盖的半步，从2016年试点到2024年参保1.88亿人，覆盖面在扩但还没全国。门诊共济改革是做实统筹的半步，个人账户缩了，统筹池大了，虽然社会阵痛不小。个人养老金是第三支柱的半步，从36城试点到全国推开，开户一亿五但缴存率不到四分之一。每一步都不完整，但每一步都在往前走。改革不怕慢，怕停。方向比速度重要，制度比政策根本。三十年中国社保走过的路，比起跑线更要紧的是走对了方向：从单位保障到社会保险，从县级统筹到全国统筹，从身份壁垒到人人负责。方向对了，慢一点没关系。一步一个脚印，总有一天能走到社会的人那天。到那天，人人按时缴费、人人彼此负责、人人享有保障。\n\n周弘说：**“人人享有的社会保障制度，其实也就是一种人人负责的制度。”**\n\n在同一个国度中，人们彼此负责、相互保障，政府为这种保障提供制度条件。在市场规则运行的条件下，这种制度提供的是基本的保障；在社会主义制度同时运行的条件下，这种制度还肩负着通过社会再分配实现社会公平的责任。\n\n从国家的人到社会的人。从被动应对到主动共建。从多收钱到改制度。\n\n在既定趋势与约束下，发挥人与制度的能动性，解决问题、改善预期、形成良性循环，最终促进我国国民福利得以保障增长。\n\n这是这本书的愿望。也是写这本书的那个人，一个在体制内工作、分管产业政策、在中信接触过年金运营、感受到了增税议程的忧思的中国干部，对这片土地和这里的人们的祝愿。愿保障之锚，锚住每一个人的底线与尊严。这是这本书终章最后的嘱托。\n\n---\n\n*全书完*"}]};

let cur = 0;

/* ── 书房渲染 ── */
function renderLibrary(){
  document.getElementById('libTitle').textContent = DATA.book.title;
  document.getElementById('libTitleEn').textContent = DATA.book.subtitle_en;
  document.getElementById('libMotto').textContent = DATA.book.motto;
  document.getElementById('rBookTitle').textContent = DATA.book.title + ' · ' + DATA.book.subtitle;

  const shelf = document.getElementById('libShelf');
  DATA.spines.forEach(sp => {
    const card = document.createElement('div');
    card.className = 'spine';
    let chBtns = '';
    sp.chapters.forEach(c => {
      chBtns += '<button class="spine-ch" onclick="openChapter(' + c.i + ')">' +
                '<span class="spine-ch-num">' + c.num + '</span><span>' + c.title + '</span></button>';
    });
    card.innerHTML =
      '<div class="spine-roman">' + sp.roman + '</div>' +
      '<div class="spine-name">' + sp.name + '</div>' +
      '<div class="spine-thesis">' + sp.thesis + '</div>' +
      '<div class="spine-chs">' + chBtns + '</div>' +
      '<div class="spine-meta">' + sp.span + '</div>';
    shelf.appendChild(card);
  });
}

/* ── 目录渲染 ── */
function renderToc(){
  const toc = document.getElementById('rToc');
  toc.innerHTML = '';
  DATA.spines.forEach(sp => {
    const g = document.createElement('div');
    g.className = 'r-toc-group';
    g.textContent = sp.roman + ' · ' + sp.name;
    toc.appendChild(g);
    sp.chapters.forEach(c => {
      const b = document.createElement('button');
      b.className = 'r-ch' + (c.i === cur ? ' active' : '');
      b.onclick = () => openChapter(c.i);
      b.innerHTML = '<span class="r-ch-num">' + c.num + '</span>' +
                    '<span class="r-ch-title">' + c.title + '</span>';
      toc.appendChild(b);
    });
  });
}

/* ── 章渲染 ── */
function renderChapter(){
  const ch = DATA.chapters[cur];
  const sp = DATA.spines.find(s => s.chapters.some(c => c.i === cur));
  document.getElementById('rPartRoman').textContent = sp.roman + ' · ' + sp.name;
  document.getElementById('rPartThesis').textContent = ch.partName;
  document.getElementById('artOrder').textContent = ch.num;
  document.getElementById('artTitle').textContent = ch.title;
  document.getElementById('artPart').textContent = sp.span + ' · ' + sp.thesis;

  // markdown渲染
  document.getElementById('prose').innerHTML = marked.parse(ch.md);

  // KaTeX
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('prose'), {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '\\[', right: '\\]', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false}
      ],
      throwOnError: false,
      ignoredTags: ['script', 'code', 'pre', 'style']
    });
  }

  // 📌边栏样式
  document.querySelectorAll('#prose blockquote').forEach(el => {
    if (el.textContent.indexOf('📌') !== -1) el.classList.add('sidebar');
  });

  // 上下章
  const prev = document.getElementById('navPrev');
  const next = document.getElementById('navNext');
  if (cur > 0) {
    const p = DATA.chapters[cur-1];
    prev.innerHTML = '<small>上一章</small>' + p.num + ' ' + p.title;
    prev.style.visibility = 'visible';
  } else { prev.style.visibility = 'hidden'; }
  if (cur < DATA.chapters.length - 1) {
    const n = DATA.chapters[cur+1];
    next.innerHTML = '<small>下一章</small>' + n.num + ' ' + n.title;
    next.style.visibility = 'visible';
  } else { next.style.visibility = 'hidden'; }

  document.getElementById('rScroll').scrollTop = 0;
  location.hash = 'ch-' + cur;
}

function openChapter(i){
  cur = i;
  document.getElementById('library').style.display = 'none';
  document.getElementById('readerView').classList.add('on');
  renderToc();
  renderChapter();
}

function navChapter(d){
  const t = cur + d;
  if (t >= 0 && t < DATA.chapters.length) { cur = t; renderToc(); renderChapter(); }
}

function goHome(){
  document.getElementById('readerView').classList.remove('on');
  document.getElementById('library').style.display = 'flex';
  location.hash = '';
}

/* ── 启动 ── */
function boot(){
  renderLibrary();
  const m = location.hash.match(/ch-(\d+)/);
  if (m && +m[1] < DATA.chapters.length) openChapter(+m[1]);
}
if (window.marked) { marked.setOptions({breaks:true, gfm:true}); boot(); }
else window.addEventListener('load', function(){ setTimeout(function(){ marked.setOptions({breaks:true, gfm:true}); boot(); }, 250); });
</script>
</body>
