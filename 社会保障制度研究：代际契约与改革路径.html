<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f0e6;--paper:#faf6ee;--ink:#2c2418;--muted:#857c6d;
  --accent:#8b6f47;--crimson:#9b3a2e;--gold:#c4a35a;--rule:#d4c9b8;
  --font-serif:"Noto Serif SC","Source Han Serif SC","Songti SC",serif;
  --font-sans:"PingFang SC","Microsoft YaHei",sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--font-serif);line-height:1.85;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ═══ 书房首页 ═══ */
.library{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:64px 20px 90px}
.lib-header{text-align:center;margin-bottom:46px}
.lib-title{font-size:44px;font-weight:700;letter-spacing:.18em;color:var(--ink)}
.lib-title-en{display:block;font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:15px;margin-top:8px;letter-spacing:.05em}
.lib-motto{font-size:15px;color:var(--muted);margin-top:16px;font-style:italic}
.lib-divider{width:60px;height:2px;background:var(--gold);margin:24px auto 0}
.lib-shelf{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;max-width:1180px;margin-bottom:54px}
.spine{width:296px;min-height:380px;padding:32px 26px;background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:2px;display:flex;flex-direction:column;transition:all .2s;text-align:left}
.spine:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(44,36,24,.12);border-left-color:var(--crimson)}
.spine-roman{font-size:13px;letter-spacing:.25em;color:var(--muted)}
.spine-name{font-size:26px;font-weight:700;color:var(--ink);margin:10px 0 6px;line-height:1.35}
.spine-thesis{font-size:13.5px;color:var(--accent);line-height:1.75;flex:1;margin-top:4px}
.spine-chs{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.spine-ch{display:flex;gap:8px;align-items:baseline;width:100%;padding:4px 0;text-align:left;font-size:13px;color:var(--ink);transition:color .15s;line-height:1.5}
.spine-ch:hover{color:var(--crimson)}
.spine-ch-num{font-size:11px;color:var(--muted);white-space:nowrap;flex-shrink:0}
.spine-meta{font-size:12px;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.lib-frontmatter{text-align:center;max-width:680px}
.lib-fm-title{font-size:14px;color:var(--muted);letter-spacing:.1em;margin-bottom:14px}
.lib-fm-note{font-size:13.5px;color:var(--muted);line-height:1.9}

/* ═══ 阅读视图 ═══ */
.reader-view{display:none;flex-direction:column;height:100vh;position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg)}
.reader-view.on{display:flex}
.r-topbar{display:flex;align-items:center;gap:16px;padding:12px 26px;background:var(--paper);border-bottom:1px solid var(--rule);box-shadow:0 1px 4px rgba(0,0,0,.04);z-index:10;min-height:56px}
.r-home{padding:6px 14px;font-size:14px;color:var(--muted);transition:color .15s;white-space:nowrap}
.r-home:hover{color:var(--accent)}
.r-book-title{font-size:15px;font-weight:600;white-space:nowrap;color:var(--accent)}
.r-sep{color:var(--rule)}
.r-part-title{flex:1;font-size:15px;display:flex;align-items:center;gap:10px;min-width:0}
.r-part-roman{font-size:12px;color:var(--gold);letter-spacing:.15em;white-space:nowrap}
.r-part-thesis{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-body{flex:1;display:flex;overflow:hidden}

.r-toc{width:262px;background:var(--paper);border-right:1px solid var(--rule);overflow-y:auto;padding:14px 0 40px;flex-shrink:0}
.r-toc-group{padding:10px 20px 4px;font-size:11px;color:var(--muted);letter-spacing:.18em}
.r-ch{display:flex;align-items:baseline;width:100%;padding:7px 20px;text-align:left;transition:all .15s;border-left:3px solid transparent;gap:8px}
.r-ch:hover{background:var(--bg)}
.r-ch.active{background:var(--bg);border-left-color:var(--accent)}
.r-ch-num{font-size:11.5px;color:var(--muted);white-space:nowrap;flex-shrink:0;width:44px}
.r-ch-title{font-size:13px;line-height:1.5;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-ch.active .r-ch-title{font-weight:600;color:var(--accent)}

.r-scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.article{max-width:700px;margin:0 auto;padding:58px 42px 130px}
.art-head{text-align:center;margin-bottom:44px}
.art-order{font-size:13px;color:var(--muted);letter-spacing:.2em}
.art-title{font-size:29px;font-weight:700;margin-top:8px;line-height:1.35}
.art-rule{width:42px;height:1px;background:var(--gold);margin:20px auto}
.art-part{font-size:12.5px;color:var(--muted);letter-spacing:.1em}
.art-foot{margin-top:64px;padding-top:26px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:14px}
.art-nav{padding:9px 18px;background:var(--paper);border:1px solid var(--rule);border-radius:3px;font-size:13.5px;color:var(--ink);transition:all .15s;line-height:1.5}
.art-nav:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.art-nav small{display:block;font-size:11px;color:var(--muted)}
.art-nav:hover small{color:rgba(250,246,238,.75)}

/* ═══ 正文排版 ═══ */
.prose h1{font-size:22px;font-weight:700;margin:38px 0 16px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.prose h2{font-size:20px;font-weight:700;margin:42px 0 14px;color:var(--ink)}
.prose h3{font-size:17px;font-weight:600;margin:30px 0 10px;color:var(--accent)}
.prose p{font-size:16px;margin-bottom:17px;text-align:justify}
.prose strong{font-weight:700;color:var(--ink)}
.prose em{font-style:italic;color:var(--accent)}
.prose ul,.prose ol{margin:12px 0 18px 24px}
.prose li{margin-bottom:6px;font-size:16px}
.prose blockquote{margin:22px 0;padding:16px 22px;background:var(--paper);border-left:3px solid var(--gold);font-size:15px;color:var(--muted);line-height:1.75}
.prose blockquote p{font-size:15px;margin-bottom:8px;text-align:left}
.prose blockquote p:last-child{margin-bottom:0}
.prose blockquote.sidebar{background:#f8f0e0;border-left-color:var(--crimson);padding:18px 22px}
.prose blockquote.sidebar p{color:#5a4a30;font-size:14.5px}
.prose table{width:100%;border-collapse:collapse;margin:22px 0;font-size:14px}
.prose th{background:var(--paper);font-weight:600;text-align:center;padding:9px 12px;border:1px solid var(--rule)}
.prose td{padding:8px 12px;border:1px solid var(--rule);vertical-align:top;text-align:center}
.prose td:first-child{text-align:left}
.prose tr:nth-child(even){background:var(--paper)}
.prose hr{border:none;border-top:1px solid var(--rule);margin:34px 0}
.prose code{font-family:Consolas,monospace;background:var(--paper);padding:2px 6px;border-radius:3px;font-size:.88em}
.katex-display{margin:20px 0;overflow-x:auto;overflow-y:hidden;padding:4px 0}
</style>

<script>
const DATA = {"book": {"title": "保障之锚", "subtitle": "中国大社会保障的困境、镜鉴与出路", "subtitle_en": "The Anchor of Security", "motto": "锚住底线，风浪中才敢远航。", "meta": "2026年 · 导论 + 十一章 + 结语"}, "spines": [{"roman": "导论", "name": "增税议程的忧思", "thesis": "大保障作为市场经济的底层支柱：再分配、储蓄保险、宏观稳定三重功能", "span": "问题的提出", "chapters": [{"i": 0, "num": "导论", "title": "增税议程的忧思"}]}, {"roman": "上编", "name": "困境与原理", "thesis": "让数字说话、让数学说话、让历史说话、让机制说话", "span": "第一章至第四章", "chapters": [{"i": 1, "num": "第一章", "title": "钱去哪了"}, {"i": 2, "num": "第二章", "title": "代际契约的裂痕"}, {"i": 3, "num": "第三章", "title": "从单位到社会"}, {"i": 4, "num": "第四章", "title": "空账与转轨"}]}, {"roman": "中编", "name": "镜鉴", "thesis": "以中国问题为经，以日本、全球经验为纬——我注六经", "span": "第五章至第七章", "chapters": [{"i": 5, "num": "第五章", "title": "以日为鉴"}, {"i": 6, "num": "第六章", "title": "全球谱系"}, {"i": 7, "num": "第七章", "title": "碎片化与统筹"}]}, {"roman": "下编", "name": "出路与方案", "thesis": "筹资重构、统筹跃升、自动调整与照护、能动性的觉醒", "span": "第八章至第十一章", "chapters": [{"i": 8, "num": "第八章", "title": "增税之外的路径"}, {"i": 9, "num": "第九章", "title": "从碎片到统一"}, {"i": 10, "num": "第十章", "title": "自动调整与照护之维"}, {"i": 11, "num": "第十一章", "title": "能动性的觉醒"}]}, {"roman": "结语", "name": "从国家的人到社会的人", "thesis": "人人享有的社会保障制度，也就是一种人人负责的制度", "span": "全书收束", "chapters": [{"i": 12, "num": "结语", "title": "从国家的人到社会的人"}]}], "chapters": [{"part": "导论", "partName": "增税议程的忧思", "num": "导论", "title": "增税议程的忧思", "md": "\n![](figs/00.png)\n*插图 · 00*\n\n\n## 一\n\n2025年，一个在体制内工作的干部，就是我，感受到了一种弥漫的焦虑。\n\n医保个人账户改革落地后，门诊共济的争议从政策文件蔓延到街头巷尾。老百姓发现划入个人账户的钱少了，去药店买药要多掏腰包，有人算了笔账觉得自己亏了。武汉、西安先后出现退休人员聚集表达不满的场景，网络上的情绪更为汹涌。与此同时，社保费率能不能再涨的讨论从未停歇。企业叫苦，名义五险费率加起来超过40%，在全球排得上前几位；职工也觉得手紧，每月工资条上扣掉一大块，到手的钱比名义工资少了一截。延迟退休方案自2025年起渐进式落地，男职工60岁逐步延到63岁，女职工50岁、55岁分别延到55岁、58岁，十五年到位。每一条消息传来，社交媒体上都是一片唏嘘。\n\n> **【2024年五项社会保险基金收入8.53万亿元、支出7.61万亿元，表面当期结余9】**195亿元。但剔除1.93万亿元财政补贴后，基本养老保险当期缺口约1.39万亿元。数据来源：人社部《2024年度人力资源和社会保障事业发展统计公报》。\n\n感慨是真实的。一个在体制内分管产业政策的人，此前在中信短暂工作期间接触过养老金年金的运营实务，深知这套体系的钱是怎么进、怎么出、怎么投的。眼下的增税议程，本质上就是多收钱的议程。它不是哪个部门的拍脑袋，而是三十年制度运转走到一个关口后，人口结构、制度转轨、统筹碎片化三重压力叠加逼出来的结果。医保没钱了，社保没钱了，这句话不是危言耸听，而是剔除财政补贴后账本上的事实。\n\n2025年这几件事几乎同时落地。延迟退休1月1日生效，男职工每四个月延一个月，十五年到位，慢是慢，但箭已离弦。医保门诊共济改革2024年底发文，2025年起全国全面推行，单位缴费不再划入个人账户，退休人员每月划入的那笔钱说没就没了。个人养老金制度2024年12月刚从三十六城试点扩到全国，开户冲到一亿五，但真正往里存钱的不到四分之一，政策给了税优，老百姓用脚投票。三件事各有各的道理：延迟退休缓解抚养比，门诊共济做实统筹池，个人养老金补第三支柱。但叠在一起，落在同一年，落在同一批人头上，体感就是处处收紧、样样要钱。一个五十出头的女工，原指望着五十岁退休领养老金，现在被告知要延到五十五；她的医保个人账户缩了水，去药店买药多掏腰包；听说个人养老金能抵税，可她工资没到起征点，抵不抵税跟她没关系。改革的每一步单独看都对，但合在一个人身上，就是被挤压的感觉。而且她这个年纪，找工作嫌她老，等退休又嫌她小。五十岁上下的劳动力卡在就业市场和退休年龄的夹缝里，想干没人要，想退退不了，进退两难。\n\n但感慨之后，必须沉思。\n\n增税议程的三重挤压，不是三个独立的改革，而是同一套制度三十年积累的压力被迫同时释放。它们挤的是同一批人。\n\n究竟是什么原因造成了今日的困境？问题的症结、体制机制问题在哪？纵观全球、推导原理，未来该怎么办？这些问题不能靠情绪回答，不能靠部门本位回答，更不能靠简单照搬某个外国模式回答。需要一本认真的书，把中国大社会保障体系的困境、原理、镜鉴与出路讲透。\n\n## 二\n\n先说大社会保障这个视角。\n\n社会保障在中国，习惯上被视为人社部的业务或医保局的业务。养老归人社，医疗归医保，低保归民政，补贴归财政，各管一段，井水不犯河水。这种部门本位不是谁的过错，是行政科层制的天然产物。但理解社保的困境，必须跳出部门本位。\n\n> **【2025年度国家一般公共预算中，社会保障和就业支出超4.5万亿元，卫生健康支出超】**2.2万亿元，两项合计占中央财政支出三分之一以上。社会保障已经不是某个部委的业务，而是国家财政的支柱性科目。\n\n从大视角看，社会保障是社会主义市场经济体系的底层支柱之一。市场经济要运转，需要四根柱子：产权制度、合同执行、货币稳定、社会保障。前三者保障交易的效率和可预期性，第四者保障人在市场风险面前的底线安全。没有社会保障的市场经济，是丛林法则；有了社会保障的市场经济，才是文明经济。\n\n所谓底层支柱，不止是兜底的意思。社会保障承担三重功能，缺一不可。\n\n第一重，再分配功能。市场按边际生产力分配收入，必然产生差距。社会保障通过累进性缴费和普惠性给付，对初次分配的结果进行二次调节。城镇职工养老保险中，统筹账户（雇主16%）就是再分配的载体，高收入者多缴、低收入者相对多得，这叫公平。中国当前的问题恰恰是再分配力度不够：企业退休人员月均养老金3253元，机关事业单位6372元，城乡居民仅246元。三轨之间差距悬殊，再分配非但没缩小鸿沟，反而固化了身份壁垒。\n\n第二重，储蓄保险功能。一个人一辈子的收入曲线是倒U形的：年轻时低收入，中年高收入，退休后零收入。社会保障通过强制缴费和分期给付，实现生命周期内的收入平滑，这叫效率。个人账户就是储蓄功能的载体。但中国的个人账户长期空账，统筹账户挪用个人账户资金支付当期养老金，储蓄功能名存实亡。名义上的统账结合实际变成了纯统筹，激励相容性大打折扣。\n\n第三重，宏观稳定功能。经济有周期，繁荣时就业充分、社保缴费充裕，衰退时失业增加、社保支出上升。社会保障天然具有自动稳定器功能：经济过热时超额缴费回抽购买力，经济衰退时超额给付托底消费。凯恩斯在《就业、利息和货币通论》里提出财政逆周期调节，社会保障是最自动化的逆周期工具，不需要每次衰退都开会决定发多少钱。2008年金融危机、2020年疫情冲击，社保减免缓缴政策都发挥了稳定器作用。\n\n这三重功能不是抽象理论，是账本上看得见的数字。2020年疫情冲击下，国家出台阶段性减免社保费政策，企业部分养老、失业、工伤保险单位缴费全部免征，最长五个月。那一年的三项社会保险基金收入降了14.3%，当期赤字6914亿元，是少有的收不抵支年份。这就是自动稳定器的代价：经济衰退时让利给企业保就业，代价是基金当年亏空。亏空靠累计结余和财政补贴填，但结余是有限的，补贴是要还的。2021年收入猛增34.6%，恢复性增长把上一年的窟窿补了回来。这个V字形说明，稳定器有效，但只在短期有效。如果衰退不是一次冲击而是长期趋势，比如人口结构持续恶化带来的慢性失血，自动稳定器就力不从心了，因为结余会被持续侵蚀。中国现在面临的不是2020年那种突发冲击，而是抚养比从2.6比1滑向1.5比1的结构性下行。这种慢变量，单靠自动稳定器扛不住。\n\n> **【世界银行1994年报告《Averting the Old Age Crisis》】**将老年保障分为三大功能：再分配（redistribution）、储蓄（saving）、保险（insurance）。这三个功能可以由不同支柱承担，但必须都有人承担，缺一即废。\n\n三重功能中，中国当前最弱的是储蓄功能（空账）和宏观稳定功能（统筹碎片化导致稳定器难以跨区域发力）。再分配功能虽然存在，但方向有问题。在三轨并行格局下，再分配更多是体制内自我强化，而非缩小全社会的差距。这就是大保障视角的洞察：不是某个险种没钱了要加钱，而是三重功能都有结构性缺陷，需要从制度底层重构。\n\n## 三\n\n这本书的方法论，用四个字概括：我注六经。\n\n六经是素材，是镜鉴。日本超高龄社会三十年的制度演化是六经。1973年福利元年的扩张，1980年代财政重建的迟滞，2004年年金改革导入宏观经济滑动，2012年消费税从5%到8%再到10%的社保税一体改革，介护保险的制度创新，GPIF的投资运营纪律化，这些是日本人用自己的代价换来的经验，值得尊重、值得研究。全球六大模式也是六经。贝弗里奇的普遍主义、俾斯麦的职业保险、北欧的高税负高福利、新加坡的强制储蓄、智利的私有化兴衰、中国的混合实验，这些都是人类在如何保障人的底线安全这个根本问题上的不同回答。\n\n但六经是六经，我是我。一个中国干部写中国社会保障，不能写成日本社会保障制度介绍，也不能写成全球社保模式巡礼。日本经验再好，中国不是日本：人口基数差一个数量级，城乡二元结构独此一家，制度转轨包袱比谁都重，共产党领导的政治体制决定了改革动力和路径不同于西方。全球模式再完备，中国不能照搬：俾斯麦模式需要成熟的劳资协商机制，贝弗里奇模式需要强大的税收征管能力，北欧模式需要高度社会信任和小国寡民，新加坡模式需要政府包办住房，智利模式的私有化连智利自己都推翻了。\n\n四个特殊性摆出来，就知道为什么不能照搬。一是人口基数差一个数量级。日本一点二亿人，中国十四亿，同样的替代率意味着十倍的基金规模和十倍的转轨成本。二是城乡二元结构独此一家。日本城市化率九成以上，没有城乡居民养老保险这个概念，而中国五点三八亿人参保的居民养老保险月均才两百四十六元，这个洼地日本从未面对过。三是转轨包袱比谁都重。日本从未有过单位保障到社会保险的制度断裂，而中国从1951年劳动保险条例到1997年统账结合，中间经过文革单位化、改革开放社会化，每一次转轨都积下一笔隐性债务，累计一点九到八十六万亿，学界估算跨度极大。四是政治体制不同。日本改革靠多党博弈达成共识，中国的改革动力来自党的统一领导，路径不一样，节奏不一样，但执行力更强。四条决定了：镜鉴可以借，路径不能抄。\n\n> **【日本1949年出生者一生领取年金与缴费之比为2.3倍，2000年代出生者仅为0.】**6倍，代际差距达6000万日元。中国如果不及时改革，类似代际断层将更加严峻。计划生育一代（1960-70年代出生）正进入退休高峰，他们的子女（1990-2000年代出生）数量更少、负担更重。数据来源：日本国立社会保障·人口问题研究所。\n\n所以这本书的结构是：以中国问题为经，以日本和全球经验为纬。上编诊断中国困境、推导原理、追溯演化、剖析空账，这是“我”。中编以日为鉴、全球谱系、中国体制症结，这是我注六经，六经为我所用，而非我为六经作注。下编讲出路：增税之外的路径、碎片到统一、自动调整与照护、能动性的觉醒，这是“我”要解决的问题。\n\n全书十一章加导论结语，体量十万字多一点。不算大，但不敢轻，力求每一句有据、每一章有骨。\n\n## 四\n\n全书分三编。\n\n上编“困境与原理”四章。第一章“钱去哪了”把中国社保基金的收支全景摆出来：8.53万亿收支、1.39万亿缺口、3.1亿60岁以上人口、抚养比2.6比1，让数字说话。第二章“代际契约的裂痕”从原理层面推导现收现付制在老龄化下为什么不可持续，用数学说话。第三章“从单位到社会”追溯中国社保制度从1951年劳动保险条例到2010年社会保险法的演化路径，让历史说话。第四章“空账与转轨”解剖统账结合的制度逻辑、隐性债务和省际失衡，让机制说话。\n\n中编“镜鉴”三章。第五章“以日为鉴”不是日本制度排排坐，而是按中国面临什么问题、日本提供了什么镜鉴来组织：老龄化加速、基金运营、长护需求、代际公平、改革时机、筹资困境，每个主题先说中国困境，再照日本经验。第六章“全球谱系”把六大模式摆上对比表，讲私有化逆转的三个案例（阿根廷、哈萨克斯坦、智利）和NDC的兴起（瑞典、德国），提炼自动调整机制这个核心技术工具。第七章“碎片化与统筹”回到中国，系统梳理六重困境根源：人口结构、转轨成本、省际失衡、费率待遇、医保扩张、财政依赖。这是全书中国问题最集中的一章。\n\n下编“出路与方案”四章。第八章“增税之外的路径”讲筹资体系的多维重构：划转国有资本、提升运营收益、做强二三支柱、费基做实。第九章“从碎片到统一”讲统筹层级的跃升和NDC化重构。第十章“自动调整与照护之维”把两个主题合一章：去政治化的自动调整机制（瑞典刹车、德国因子、退休年龄与预期寿命挂钩）和长期护理保险的制度创新（借鉴日本介护保险）。第十一章“能动性的觉醒”是全书收束：人的能动性（延迟退休即主动延长参与）、制度的能动性（自动调整即主动适应）、改善预期（确定性是社保核心价值）、良性循环（人口、增长、可持续、生育意愿的传导链）。\n\n结语回到周弘的一句话：“只要我按时缴费，我就是社会的人了。”从国家的人到社会的人，是近百年中国社会保障变迁的深意。大保障就是人人负责的制度。在既定趋势与约束下，发挥人与制度的能动性，解决问题、改善预期、形成良性循环，最终促进国民福利得以保障增长，这是这本书的愿望。\n\n这本书的写作立场需要交代。它不是智库报告。智库报告讲平衡、讲对策、讲建议，这本书讲困境、讲原理、讲为什么。它也不是政策辩解。政策辩解为现行做法背书，这本书对现行做法有批评，比如门诊共济改革技术正确、政治失分，比如全国统筹半步半步走得慢。它更不是情绪宣泄。情绪宣泄说社保要崩了，这本书说社保不会崩，但会慢性失血，而失血的原因在制度不在钱。它是一个在体制内工作、分管产业政策、在中信接触过年金运营的干部，面对增税议程时的忧思与沉思。忧思是感性的，眼看着改革一件件落地，压力一层层加码；沉思是理性的，把感性变成数据、原理、镜鉴、方案。忧思是起点，沉思是方法，出路是终点。全书的目标不在说服谁，而在讲清楚，给同在这条船上的人一份地图。地图不是答案，但有了地图，航向就不再是一笔糊涂账。\n\n那就开始吧。从钱去哪了说起。"}, {"part": "上编", "partName": "困境与原理", "num": "第一章", "title": "钱去哪了", "md": "\n![](figs/01.png)\n*插图 · 01*\n\n\n## 一、总体收支：表面平衡下的暗流\n\n2024年，中国五项社会保险基金（养老、医疗、失业、工伤、生育）收入合计8.53万亿元，支出合计7.61万亿元，当期结余9195亿元，累计结余约9.1万亿元。单看这两个数字，社保基金似乎运转正常：收大于支，略有盈余。\n\n但这个平衡是含了财政补贴的。\n\n2024年，各级财政对社会保险基金的补贴合计约1.93万亿元，绝大部分补在养老保险上。剔除补贴，仅看保险费收入与支出的对应关系，基本养老保险基金的当期缺口约为1.39万亿元。也就是说，养老保险每年收上来的保险费，已经不够付当年该发的养老金。差额靠财政补贴填，而补贴的来源是税收，本质上是纳税人给社保体系补窟窿。\n\n> **【人社部《2024年度人力资源和社会保障事业发展统计公报》（2025年6月13日发】**布）：全年三项社会保险基金（养老/失业/工伤）收入85313亿元，支出76118亿元，当期结余9195亿元。但其中基本养老保险基金含财政补贴约1.93万亿元，剔除后保险费收入仅约5.87万亿元，对7.26万亿元养老支出形成约1.39万亿缺口。\n\n这不是某一年偶然的波动。从趋势看，财政补贴占养老保险基金总收入的比重逐年攀升：十年前约15%，现在接近25%，预计2035年突破30%。补贴的绝对规模也在膨胀。2015年不到5000亿，2024年逼近2万亿，十年翻两番。这个增速比GDP快，比财政收入快，比任何一项社保支出都快。\n\n财政依赖到什么程度才算危险？没有统一标准，但有一个常识：当一项支出的四分之一靠非自身收入来源支撑时，这项制度在财务上就不是自维持的，而是需要外部输血的。养老保险已经越过了这条线。\n\n**表1：五项社会保险基金收支总览（2024年）**\n\n| 险种 | 参保人数（万人） | 收入（亿元） | 支出（亿元） | 累计结余（亿元） |\n|------|:---:|:---:|:---:|:---:|\n| 基本养老保险（合计） | 107,282 | — | — | — |\n| 　城镇职工 | 53,452 | — | — | — |\n| 　城乡居民 | 53,830 | — | — | — |\n| 基本医疗保险（含生育） | 132,662 | 34,913 | 29,764 | 38,629 |\n| 　职工基本医保 | 37,948 | 23,732 | 19,103 | 30,446 |\n| 　城乡居民医保 | 94,714 | — | — | — |\n| 失业保险 | 24,589 | — | — | — |\n| 工伤保险 | 30,398 | — | — | — |\n| 生育保险 | 25,299 | — | — | — |\n| **三项合计** | — | **85,313** | **76,118** | **~91,000** |\n\n注：人社部公报口径的三项社会保险基金指养老、失业、工伤，医疗和生育保险由医保局单独公布。此处合并展示。\n\n数据来源：人社部2024年度统计公报、国家医保局2024年度统计公报、国家统计局2024年国民经济和社会发展统计公报。\n\n## 二、养老保险：万亿缺口与三轨鸿沟\n\n养老保险是社保体系的核心，也是缺口最大的险种。\n\n中国养老保险实行三轨并行：城镇职工基本养老保险、城乡居民基本养老保险、机关事业单位工作人员养老保险。三轨覆盖人群不同、缴费水平不同、待遇标准也不同。\n\n城镇职工基本养老保险覆盖5.35亿人，是主渠道。2024年末在职职工约3.7亿人，领取待遇的退休人员约1.4亿人，制度内抚养比（在职缴费者与退休领取者之比）约为2.6比1，意思是每2.6个在职者养1个退休者。二十年前这个比是3比1以上，十年前约3.5比1，现在2.6比1，还在持续恶化。中国社科院预测到2035年将降至2比1以下，到2050年可能逼近1.5比1。\n\n> **【抚养比2.6:1的含义：每个退休人员的养老金，由2.6个在职者的缴费分摊。如果平】**均每个在职者月缴800元（雇主加个人），每月共筹2080元，而退休人员月均养老金约3253元，缺口由财政补贴和累计结余弥补。随着抚养比继续恶化，缺口将扩大。\n\n企业退休人员月均养老金3253元，替代率（养老金占退休前工资的比例）约45%。这个数字十年前还在50%以上，二十年前接近60%。国际劳工组织公约建议最低替代率55%，中国已经跌破这条线。替代率持续下降的原因很复杂：工资增长快于养老金调整、新退休者待遇基数低、统筹层次低导致地区差异，但核心原因还是人口结构，缴费者增速跟不上退休者增速。\n\n城乡居民基本养老保险覆盖5.38亿人，比城镇职工还多，但待遇极低。基础养老金全国最低标准仅百余元，加上地方补贴和个人账户，全国月均约246元。这个数字不够一个人在城市生活一周。城乡居民养老保险本质上是低保加象征性保险，保障功能弱，再分配功能也弱。因为缴费和待遇都很低，谈不上调节收入差距。\n\n机关事业单位工作人员养老保险在2014年改革前是完全独立的退休制：不缴费、由财政直接发放、替代率高达80%至90%。2014年并轨改革后名义上与企业职工同制度，但设置了十年过渡期（2014至2024年），且职业年金作为补充使实际待遇仍远高于企业。2024年机关事业单位月均养老金约6372元，是企业退休人员（3253元）的近两倍、城乡居民（246元）的26倍。\n\n> **【三轨养老金对比（2024年月均）：机关事业6372元，企业职工3253元，城乡居】**民246元，最高与最低相差26倍。2014年并轨改革名义上统一了制度，但过渡期设置和职业年金补充使实际待遇差距延续。并轨并了制度形式，没并待遇实质。\n\n三轨鸿沟的背后是身份壁垒。一个人是机关事业编、企业职工还是城乡居民，决定了他老了以后每月拿6372、3253还是246。这个身份壁垒不是市场选择的：机关事业编是考试分配的，城乡居民身份是户籍绑定的。社会保障本应缩小差距，但三轨并行格局让再分配方向反了，体制内自我强化，体制外保障不足。\n\n全国社保基金理事会管理的战略储备基金是另一道防线。2024年末资产3.32万亿元，当年投资收益率8.10%，成立24年来年均7.39%。这笔钱目前还没有动用，是为将来养老支付高峰预留的战略储备。但3.32万亿对每年1.39万亿的缺口来说，也不过够补二十几年。如果缺口持续扩大，战略储备的缓冲能力有限。\n\n## 三、医疗保险：支出增速的警报\n\n基本医疗保险基金2024年收入3.49万亿元、支出2.98万亿元、累计结存3.86万亿元。表面看结存充裕，但深入看职工医保的数据，警报就响了。\n\n> **【2024年职工医保统筹基金（含生育）收入17342亿元、支出13223亿元。收入】**增速4.6%，支出增速13.5%，支出增速是收入增速的近三倍。如果这个趋势持续，职工医保统筹基金的当期结余将在五到八年内被逆转。\n\n职工医保分统筹基金和个人账户两部分。统筹基金用于住院和大病报销，个人账户用于门诊购药。2021年门诊共济改革后，单位缴费不再划入个人账户而全部进入统筹基金。这本意是做实统筹、增强共济，但引发了退休人员不满，因为个人账户每月划入金额减少了。\n\n在职职工与退休职工的比例（医保制度内抚养比）为2.63比1，与养老保险的2.6比1接近。但医保的支出驱动因素比养老更复杂：养老支出只跟退休人数和待遇水平有关，医保支出还跟医疗通胀、过度医疗、技术扩散有关。\n\n人均医疗费随年龄指数级增长。日本数据显示，75岁以上人群人均医疗费是65岁以下的4.4倍。中国虽然没有完全可比的统计，但规律相同：一个人60岁以后的医疗支出可能占其一生的60%以上。老龄化对医保的冲击比对养老更猛，因为养老是线性增长，多一个退休者多发一份养老金；医疗是指数增长，老年人均医疗费远高于年轻人。\n\n**表2：医疗费年龄结构（日本数据，中国趋势类似）**\n\n| 年龄段 | 人均医疗费相对倍数 | 说明 |\n|------|:---:|------|\n| 0-14岁 | 0.5 | 儿科费用相对低 |\n| 15-44岁 | 1.0 | 基准 |\n| 45-64岁 | 1.8 | 慢性病开始出现 |\n| 65-74岁 | 3.2 | 慢性病高发 |\n| 75岁以上 | 4.4 | 高龄医疗密集 |\n\n数据来源：日本厚生劳动省《国民医疗费》统计。\n\n国家组织药品集采已开展11批，累计为患者减负超6000亿元。DRG/DIP支付方式改革基本实现全覆盖，按病种付费出院人次占比超90%。这两项改革确实在控费，但控的是价格，不是数量。集采压低了药价，DRG限制了单次住院费用，但就诊人次在增长、慢性病管理需求在膨胀、老龄人口在增加，量的增长最终会吞噬价的控制。\n\n细看数量的驱动因素，有三股力量同时施压。\n\n一是绝对就诊量。3.1亿60岁以上人口，他们的人均就诊次数是年轻人的两到三倍。一个65岁老人年均门诊约6至8次、住院约0.3次；一个30岁年轻人年均门诊2至3次、住院0.05次。老年人占比每升1个百分点，全国总就诊量增加数千万人次。到2035年60岁以上占比突破30%，仅老龄化一项就使总就诊量比现在多出约30%。\n\n二是慢性病管理。高血压患者约2.7亿，糖尿病患者约1.4亿，这两类慢病需要终身用药、定期复查。慢病管理不是治好，是控制，意味着持续的医疗支出。集采确实压了药价，一盒降压药从几十元降到几元，但2.7亿高血压患者每天都要吃药、每年都要复查，量的基数太大了。\n\n三是技术扩散。CT、核磁、支架、靶向药，这些在二十年前不存在或极昂贵的项目，现在成了常规。以前不查的病现在查了，以前不治的病现在治了。技术进步是好事，但它推高了人均医疗支出。一个支架从两万降到一万，但以前一年放五十万个支架，现在放两百万个。价降了一半，量翻了四倍，总支出还是涨。\n\n三股力量叠加，即使集采和DRG继续推进，医疗总支出仍将保持高于收入增速的增长。这不是改革不力，是人口和技术规律的必然。医保基金面临的不是一个可以治好的病，而是一个需要长期管理的慢性状态。\n\n个人账户累计结存1.45万亿元，看着不少，但2024年当期结存仅510亿元，接近收支平衡。个人账户改革后，资金从个人账户流向统筹账户，长期看有利于共济，但短期内退休人员的获得感下降，改革的社会成本不小。\n\n## 四、人口结构：抚养比的数学\n\n社会保障的财务可持续性，最终取决于人口结构。所有的收支数据，根子上都是人口数据。\n\n2024年末，中国60岁以上人口3.10亿，占总人口22.0%；65岁以上人口约2.17亿，占15.6%。这两个数字还在增长，2025年60岁以上人口预计达3.23亿（23.0%）。到2035年，60岁以上占比将突破30%，意味着三个人里有一个是老人。\n\n出生人口方面，2024年出生约954万，虽然较2023年略有回升，但相比2016年的1883万几近腰斩。总和生育率约1.0，远低于2.1的世代更替水平。中国人口已连续三年负增长：2022年首次出现，2023年扩大，2024年延续。\n\n> **【中国人口关键指标（2024）：总人口约14.1亿，60+人口3.10亿（22.0】**%），65+人口2.17亿（15.6%），出生人口954万，总和生育率约1.0，连续三年负增长。数据来源：国家统计局《2024年国民经济和社会发展统计公报》。\n\n把人口结构翻译成社保语言，就是抚养比。老年抚养比，即65岁以上人口与15至64岁劳动年龄人口之比，2024年约22.5%，也就是每100个劳动年龄人口养22.5个老人。二十年前这个比约10%。中国社科院预测到2050年将升至53.5%，即每100个劳动年龄人口养53.5个老人；到2084年峰值可达87.5%，几乎是一对一。\n\n养老保险制度内抚养比更直接：现在2.6比1，到2035年约2比1，到2050年可能逼近1.5比1。这意味着什么？现在每2.6个缴费者养1个退休者，到2050年每1.5个缴费者养1个。如果维持现有待遇水平不变，到2050年每个缴费者的负担要增加70%以上。\n\n这就是现收现付制在老龄化下的数学困境。这个制度的本质是代际转移，当期缴费者养当期退休者，没有真实积累。当缴费者减少、退休者增加时，要么提高费率（缴费者更苦），要么降低待遇（退休者更苦），要么财政补贴（纳税人更苦）。三条路走哪条都不讨好。\n\n日本的镜鉴摆在眼前。日本1970年进入老龄化社会（65岁以上占比7%），1994年老龄社会（14%），2007年超老龄社会（21%）。从7%到21%只用了37年。中国2000年65岁以上占比约7%，2024年约15.6%，预计2033年前后突破21%。速度相当，但中国多了计划生育这个加速器：人口断崖比日本更陡峭，老龄化对社保的冲击更集中。\n\n## 五、财政依赖：万亿补贴的不可持续\n\n回到那1.93万亿元财政补贴。\n\n这笔钱在账本上叫财政对社会保险基金的补助，实际上是养老保险的输血。它的来源是税收，增值税、企业所得税、个人所得税等等，最终是纳税人的钱。等于全体纳税人每年拿出近2万亿，补养老保险的收支缺口。\n\n> **【2024年全国社会保险基金决算中，财政补贴合计约2.63万亿元（含中央和地方各级】**财政），占社会保险基金总收入的21.9%。其中基本养老保险补贴约1.93万亿元，医疗保险补贴约0.4万亿元，其余补在失业、工伤、生育等险种。数据来源：财政部《2024年全国社会保险基金决算》。\n\n2.63万亿是什么概念？2024年全国一般公共预算收入约21.97万亿元，社保补贴占了12%；全国一般公共预算支出约28.55万亿元，社保补贴占了9.2%。这笔钱如果不用来补社保，可以用于教育、科研、基础设施、国防，但现在它必须补社保，因为不补就会出欠发养老金的事故。\n\n2017年，国务院决定划转部分国有资本充实社保基金，统一划转10%的国有股权。截至2024年，划转工作基本完成，涉及中央和地方国有股权约1.68万亿元。但这里有个技术问题：划转的是股权，不是现金。社保基金理事会作为股东可以分红，但分红的规模取决于国企利润和分红政策。2024年实际可用于社保支出的分红约几百亿元，对1.39万亿缺口来说杯水车薪。\n\n划转国有资本的方向正确，用国有资产存量补社保流量缺口，是中国的制度优势。但目前的规模和效率还远远不够。后续章节会详述如何提升这块的效能。\n\n## 六、不是没钱的问题，是制度的问题\n\n把以上数据串起来看，结论就清楚了。\n\n中国社保基金表面收支平衡，但平衡靠万亿级财政补贴维持。养老保险剔除补贴后缺口1.39万亿，医保支出增速是收入增速的三倍，人口抚养比持续恶化，财政依赖逐年加深。这不是哪个年份偶然的波动，而是制度结构性矛盾的集中显现。\n\n增税议程，无论是社保费率能不能再涨、医保个人账户能不能再改、还是延迟退休能不能再推，本质上是在问：当现收现付制在老龄化下的数学困境已经显现时，用什么方式填缺口？\n\n答案不应该是多收钱。多收钱是增税议程的思路，它把问题简化为钱不够就加钱。但钱不够的根源不是支出增长本身，支出增长是人口老龄化和医疗技术进步的必然结果，不可逆转。真正的根源在制度结构：统筹碎片化导致资金配置效率低，个人账户空账导致储蓄功能失效，三轨并行导致再分配方向反了，基金运营效率低导致存量增值不足。\n\n制度性毛病有三个具体表现。\n\n一是筹资碎片化。31个省各有基金池，广东的结余不能发黑龙江的养老金。三轨并行使身份壁垒切割了再分配功能。费基不实使名义24%的费率只收上来15%至18%，中间6至9个百分点的差距就是这么漏掉的。筹资碎片化意味着：同样的费率、同样的人群，在不同省份、不同制度下，产生完全不同的保障效果。\n\n二是给付刚性化。养老金待遇能升不能降，每年涨多少由国务院发文决定，通胀来了要涨、工资增长时要涨、退休人员不满了要涨。没有自动调整机制意味着待遇只增不减，在人口结构恶化时，制度没有自我调节能力。日本走过的路就是教训：替代率从68%持续下降到50%以下，年轻人对制度失去信任，缴费意愿下降，恶性循环。\n\n三是运营保守化。3.32万亿战略储备境外配置仅13%，股票上限40%，远低于GPIF的40%境外和GPFG的97%境外。基本养老保险基金9万多亿结余中，只有3.52万亿委托社保基金理事会运营，其余近6万亿在各省内沉淀，存银行跑不赢CPI。运营保守化意味着存量增值不足，已有的钱在贬值，该赚的钱没赚到。\n\n三个毛病合在一起，就是增税议程治不了的制度病。多收的钱进来了，碎片化使配置低效，给付刚性化使缺口扩大，运营保守化使存量缩水。钱进了漏水的桶，加多少都漏光。\n\n问题的症结在制度，出路也在制度。后续各章将逐一拆解：第二章推导现收现付制的人口学原理，第三章追溯中国社保制度的演化路径，第四章解剖空账与转轨的制度逻辑。中编以日为鉴、观全球谱系、析中国体制症结。下编讲出路：筹资重构、统筹跃升、自动调整与照护创新、能动性的觉醒。\n\n钱去哪了？钱花在了该花的地方：养老人、治病人、保底线。问题不是钱花错了地方，而是钱进来的方式和花出去的方式，都有制度性的毛病。治这个毛病，比多收钱重要得多。"}, {"part": "上编", "partName": "困境与原理", "num": "第二章", "title": "代际契约的裂痕", "md": "\n![](figs/02.png)\n*插图 · 02*\n\n\n## 一、一个公式\n\n现收现付制（Pay-As-You-Go, PAYG）的运行逻辑可以用一个极简公式表达：\n\n$$\\tau = s \\times D$$\n\n其中 $\\tau$ 是缴费率（缴费占工资比例），$s$ 是替代率（养老金占退休前工资比例），$D$ 是抚养比（退休人数与缴费人数之比，$D = R/L$）。\n\n这个公式说的道理十分直白：**缴费率等于替代率乘以抚养比。**\n\n举个例子。如果替代率是50%（退休后拿到退休前工资的一半），抚养比是0.25（4个缴费者养1个退休者），那么缴费率就是50% × 0.25 = 12.5%。雇主和雇员各负担一半，各缴6.25%。\n\n这个公式的好处在哪？它把三个变量钉在了一起。三个变量里，抚养比 $D$ 是人口结构决定的，不由政策选择。政策能选择的只有 $\\tau$（缴费率）和 $s$（替代率）。但公式说，$\\tau$ 和 $s$ 不是独立的：确定了 $s$，$\\tau$ 就由 $D$ 决定；确定了 $\\tau$，$s$ 就由 $D$ 决定。\n\n> **【这个公式是现收现付制的“不可能三角”：缴费率、替代率、抚养比三者联动，只能选两个】**。人口结构（抚养比）不是政策变量。所以政策只能在多收钱和少发钱之间选。这就是增税议程的数学根源。\n\n中国当前的情况：城镇职工养老保险名义费率24%（雇主16%+雇员8%），替代率约45%，抚养比约0.385（即2.6比1）。验算：24% ≈ 45% × 0.385 × 1.38，不匹配。不匹配的原因是费基不实（很多企业按最低基数缴费，名义费率与实际费率差距大），加上财政补贴填补缺口。如果费基做实、取消补贴，要维持45%替代率，在2.6比1的抚养比下，缴费率应该约17.3%，低于名义24%，但高于实际征收水平。矛盾的核心在于：费率名义上够，实际征收不足，缺口靠补贴填。\n\n这个公式看似冷冰冰的数学，背后其实是一段思想史。现收现付制的现代形态诞生于1889年的俾斯麦德国，那是人类第一次用国家立法把老年有保障写进公民身份。二战之后，贝弗里奇报告把这一模式推广为福利国家的标配，整个欧美用四十年代到七十年代这三十年，把现收现付制铺到了几乎所有工业国家。彼时正值婴儿潮，缴费者众、退休者寡，公式算出来的费率很低，制度运行得风生水起。PAYG的黄金时代恰好是人口红利的黄金时代。这并非巧合。一旦人口红利翻转为人口负债，公式的另一面就显出来了：它同样冷酷地把危机写进了制度。当年让它运行顺畅的人口结构，正是今天让它难以为继的同一个人口结构。公式没有变，变的是公式背后那群人。他们变老了。\n\n## 二、代际转移的本质\n\n理解这个公式之后，现收现付制的本质就清楚了：它不是自己存钱自己花，而是**当期缴费者养当期退休者**。\n\n年轻时缴的费，没有进入个人账户投资增值。它直接发给当时的退休者了。等你老了，你的养老金也不是你自己年轻时存的本息，而是你子女那一代缴的费。这是一份代际契约：每一代人工作时养上一代，退休时被下一代养。\n\n契约的稳定性，取决于人口结构的稳定性。如果每代人口规模大致相当，每对夫妇生两个孩子，人口稳定更替，代际转移就是平滑的。但如果人口结构出现断层，某一代人特别多（婴儿潮），下一代人特别少（生育低谷），契约就裂了。\n\n中国的断层是双重的。\n\n第一重断层是计划生育造成的。1950-1970年代出生的人口特别多。这代人现在正进入退休高峰。1962-1975年中国年出生人口均在2000万以上，1963年峰值近3000万。这批人从2022年起陆续退休（男职工60岁，女职工50/55岁），退休人数的增速远超缴费人数的增速。\n\n> **【中国1962-1975年年出生人口均在2000万以上（1963年峰值约2934万】**），这批人2022-2035年陆续进入退休年龄。同期，1990年后出生人口持续下降，2024年出生仅954万。1963年峰值与2024年谷值之间，人口规模相差三倍。数据来源：国家统计局历年统计公报。\n\n第二重断层是预期寿命延长。1950年中国人均预期寿命约40岁，2024年已达78.6岁。退休年龄60岁（女50/55），意味着退休后平均还有18.6年（女28.6/23.6年）的领取期。三十年前设计制度时，预期寿命约68岁，退休后平均领取8年；现在是18年，翻了一倍多。\n\n两重断层叠加：缴费者增速放缓（生育低谷），退休者增速飙升（婴儿潮退休），领取期延长（寿命增长）。三重因素叠加，抚养比恶化速度前所未有。\n\n这里有一个容易被忽略的量化细节。预期寿命延长对现收现付制的冲击，并非线性而是乘数性的。设想一个1963年出生的男性婴儿。按当年预期寿命测算，他预期活到约60岁，几乎踩在退休门槛上，制度为他预留的给付义务近乎为零。而按2024年预期寿命测算，他活到78.6岁是大概率事件，退休后平均领取18.6年，按月均养老金3253元计算，仅他一人就将从制度中提取约72.6万元的终身给付。把1962-1975年出生的约2.5亿人换算一遍，仅“活得更久”这一项，就让制度的隐性给付义务膨胀了数十万亿元。这不是某届政府的政策失误，而是人口学规律在制度参数不变下的必然结果：制度设计时的预期寿命假设，已经被现实远远甩在身后。\n\n## 三、从10:1到2.6:1到1.5:1\n\n把数字摆出来更直观。\n\n中国城镇职工养老保险制度内抚养比的变化轨迹：\n\n| 年份 | 抚养比 | 含义 |\n|:---:|:---:|------|\n| 1990年代初 | 约5:1 | 5个缴费者养1个退休者 |\n| 2000年 | 约3.5:1 | |\n| 2010年 | 约3:1 | |\n| 2020年 | 约2.8:1 | |\n| 2024年 | 约**2.6:1** | 当前水平 |\n| 2035年（预测） | 约**2:1** | |\n| 2050年（预测） | 约**1.5:1** | 婴儿潮退休完毕 |\n\n> **【抚养比从5:1降到2.6:1用了三十年，从2.6:1降到1.5:1可能只需二十五】**年。恶化在加速。因为婴儿潮退休高峰还没到顶（1963年出生的人2023年刚退休），而生育低谷的影响才开始显现（1995年后出生的人刚进入劳动力市场）。\n\n把抚养比代入前面的公式 $\\tau = s \\times D$：\n\n- 现在 $D = 1/2.6 = 0.385$，维持 $s = 45\\%$ 替代率，需要 $\\tau = 17.3\\%$（名义费率24%看似够，但费基不实+补贴填）。\n- 2035年 $D = 0.5$，维持 $s = 45\\%$，需要 $\\tau = 22.5\\%$。\n- 2050年 $D = 1/1.5 = 0.667$，维持 $s = 45\\%$，需要 $\\tau = 30\\%$，远超当前24%的名义费率。\n\n这就是增税议程的数学本质：如果不改革制度结构，到2050年要维持45%替代率，缴费率得涨到30%以上。而30%的养老保险费率意味着什么？加上医疗保险8%、失业1%、工伤0.5%、生育0.5%，五险总费率逼近40%。企业承担20%以上，在全球排进前十。这个负担，在当前经济下行、企业利润率收窄的环境下，几乎没有上调空间。\n\n那么降低替代率呢？从45%降到30%？这意味着退休人员月均养老金从3253元降到2170元，在城市不够生活。日本走过的路就是前车之鉴：厚生年金替代率从1970年代的68%一路下调，2004年改革导入宏观经济滑动后预计降至50%以下，到2057年可能降至40%左右。替代率持续下降导致年轻人对年金制度失去信任，日本年轻一代中认为“老了领不到养老金”的比例超过70%。信任一旦丧失，缴费意愿下降，制度陷入恶性循环。\n\n日本这条路走得并不轻松。2004年那次改革是分水岭。它废除了每五年一次的“财政再计算”机制，改用宏观经济滑动，按(1+人口变动率+物价变动率)/4自动调整给付。这等于把政治决断下调变成了公式自动下调。但代价是：调整期要持续到2057年度，整整半个世纪里每年实质给付下降约0.9%。一个1980年出生的日本人，从25岁缴费到65岁退休，整整四十年的给付曲线都在被这条公式悄悄压低。日本年轻一代对年金制度失去信任，不是无缘无故的情绪，是半个世纪的连续削减累积出来的经验认知。\n\n## 四、中国的速度比日本更快\n\n日本是全球老龄化速度最快的国家，但中国可能更快。\n\n日本的老龄化时间线：1970年65+占比7%（老龄化社会），1994年14%（老龄社会），2007年21.5%（超老龄社会）。从7%到21.5%用了37年。\n\n中国：2000年前后65+占比约7%，2024年约15.6%，预计2033年前后突破21%。从7%到21%约33年，比日本还快4年。\n\n> **【日本从7%到14%用了24年，中国从7%到14%用了约24年，速度相当。但从14】**%到21%，日本用了13年（1994-2007），中国预计用约10年（2024-2034左右），中国更快。核心原因：计划生育使出生率下降比日本更陡峭。\n\n但速度不是唯一的差距。日本在1970年进入老龄化社会时，人均GDP已经达到2000美元（当年价），属于“先富后老”。中国2000年进入老龄化社会时，人均GDP约1000美元，是典型的“未富先老”。日本的财政底子比中国厚，制度改革的资源空间更大。\n\n这个未富先老的量化差距贯穿了整个老龄化进程。日本1994年跨入老龄社会（65+占比14%）时，人均GDP约3.8万美元（当年价，按购买力平价更高），已经完成了汽车家电产业升级、积累了庞大的海外资产。中国2024年走到15.6%这个位置时，人均GDP约1.3万美元，刚跨过中等收入陷阱的上沿，产业升级还在爬坡阶段，半导体、高端装备这些关键领域还在被卡脖子。换言之，日本是在已经“上岸”之后才迎来超老龄化的冲击，制度腾挪的财政空间、产业空间、外交空间都还宽裕；中国是还在水里游的时候，老龄化这股浪就拍过来了。\n\n更尖锐的对比在社保基金的缓冲垫厚度。日本GPIF管理的年金积立金约200万亿日元（约合人民币10万亿元），2014年改革后海外配置比例超过50%，2001年以来累计收益达196万亿日元，相当于每年给公共年金给付贡献约一成财源。中国的全国社保基金理事会3.32万亿元人民币，规模只有GPIF的三分之一，境外配置仅13%，能在国际市场捕捉的收益有限。缓冲垫的差距，意味着日本在压力来临时还有“用存量补流量”的余地，而中国的存量弹药更显单薄。\n\n日本还有一个中国没有的缓冲：庞大海外资产。日本GPIF管理的年金积立金约200万亿日元，海外配置比例超过50%。日本用海外投资收益补贴国内社保缺口。中国的全国社保基金3.32万亿人民币，境外配置仅13%，缓冲能力弱得多。\n\n## 五、长寿风险与退休年龄的错配\n\n抚养比公式里有一个隐藏变量：退休后领取期长度。这个长度取决于两个因素，一是退休年龄，二是预期寿命。\n\n$$D = \\frac{R}{L} = \\frac{\\text{退休人口}}{\\text{劳动年龄人口}}$$\n\n退休人口 $R$ 的大小，不仅取决于有多少人达到退休年龄，还取决于他们退休后活多久。如果退休年龄不变、寿命延长，$R$ 就增大，$D$ 增大，缴费率 $\\tau$ 必须上升。\n\n中国当前的退休年龄（男60岁、女职工50岁、女干部55岁）是在1950年代定的。当时人均预期寿命约50岁，退休后平均活几年。现在预期寿命78.6岁，退休后平均活18-28年。制度参数与人口现实严重错配。\n\n延迟退休方案2025年起渐进式落地：男职工60→63岁，女职工50→55岁、女干部55→58岁，十五年到位。这是正确的方向，但步子够不够快？\n\n> **【中国延迟退休方案：2025年起，男职工每4个月延1个月，15年从60岁延到63岁】**；女职工每4个月延1个月，15年从50岁延到55岁。到2040年到位。届时预期寿命可能已超80岁，63岁退休后仍有17年领取期。\n\n相比之下，德国法定退休年龄正从65岁向67岁过渡（按出生年份逐年延后），丹麦将退休年龄与预期寿命自动挂钩，每五年评估一次，自动调整。意大利2011年蒙蒂改革也将退休年龄与预期寿命挂钩。中国目前是渐进式延迟，但没有与预期寿命自动挂钩的机制。这意味着每次延迟都需要政治决策，阻力大。\n\n国际比较能看出错配的严重程度。OECD国家2024年男性平均法定退休年龄约64.3岁，女性约63.4岁；中国男60、女50/55的参数，男性低4岁有余，女性低10岁有余。日本支给开始年龄已从60岁阶梯式引上至65岁，2025年度继续上行；美国全额退休年龄正从65岁延至67岁；英国领取国家养老金的年龄规划到2037-2039年间进一步延至68岁。这些国家的人均预期寿命多在80-84岁区间，比中国的78.6岁高出几岁，但他们的退休年龄比中国晚5-8年。预期寿命更短而退休更早，这是中国独有的倒挂。倒挂的根源是1950年代那套参数一直沿用至今，制度惯性硬生生拖过了半个世纪的人口变迁。\n\n退休年龄错配的本质是：**制度参数固化，人口现实变了。** 1950年代定60岁退休是合理的，当时活到60岁的人不多，退休后领取期短。现在活到60岁是大概率事件，退休后还有二十年领取期。这意味着制度承诺的给付义务比设计时膨胀了三四倍。制度参数没有跟着人口参数走，这是现收现付制困境的制度性根源。一位老社保人私下说过一句话：“制度参数这东西，跟钢筋一样，刚浇下去时是软的，能塑形；一旦凝固，再想动就得凿，凿一下震三下。”中国的退休年龄参数，凝固了整整七十年。\n\n## 六、德国的启示：把人口变量写进公式\n\n前文那个公式 $\\tau = s \\times D$ 告诉我们：人口结构变了，要么调 $\\tau$ 要么调 $s$。但调整这件事，无论涨费率还是降待遇，在政治上极不受欢迎。每次调整都需要立法、需要说服公众、需要面对抗议。改革的政治成本高昂。\n\n德国人想了一个聪明的办法：**把人口变量直接写进待遇调整公式，让它自动调整。**\n\n2004年，德国在养老金调整公式中加入了可持续性因子（Nachhaltigkeitsfaktor）。这个因子将养老金的年度调整与“系统依赖比”（即缴费者与领取者之比）挂钩。当老龄化加剧、依赖比上升时，养老金的年度增长率自动减缓。\n\n$$s_{t+1} = s_t \\times (1 + g_w \\times (1 - \\lambda) + \\lambda \\times \\Delta D)$$\n\n简化理解：替代率 $s$ 的年度变化不仅取决于工资增长 $g_w$，还取决于抚养比变化 $\\Delta D$。当 $D$ 增大（老龄化），$\\Delta D$ 为正，替代率增长被压减。$\\lambda$ 是可持续性因子的权重参数，决定了人口因素对调整的影响力度。\n\n> **【德国2004年可持续性因子使未来净替代率降至53.3%，低于OECD平均63.2】**%。如果永久暂停该因子，替代率将高出约5个百分点。代价是财政不可持续。德国选择了可持续而非高待遇。来源：OECD Pensions at a Glance 2025。\n\n这个设计的精妙之处在于：**它把政治决策变成了技术参数。** 每年养老金涨多少，不再由议会吵架决定，而是由公式自动算出。公众可能不满意，但愤怒的对象是人口结构和数学公式，不是某个政客或某届政府。政治成本被分散了、稀释了。\n\n这就是“自动调整机制”的精髓。不是每次危机都开会决定发多少钱，而是提前设定规则，让制度在人口结构变化时自动适应。瑞典的“刹车机制”（当系统资产/负债比低于1时自动削减指数化）、丹麦的退休年龄与预期寿命挂钩，原理相同：把政治决策外包给公式，用技术理性对冲人口不确定性。\n\n中国目前没有这样的机制。养老金年度调整由国务院发文决定，今年涨4.5%、明年涨4%，每次都是政治决策。人口结构恶化了，但调整公式没有变。这意味着改革窗口在收窄，但改革动作没有跟上。\n\n德国用了二十年把可持续性因子打磨成熟。中国的人口老龄化速度比德国快得多，留给中国的时间窗口比德国窄得多。下一章追溯中国社保制度的演化路径，看看走到今天这步，制度是怎么一步步积累下来的。"}, {"part": "上编", "partName": "困境与原理", "num": "第三章", "title": "从单位到社会", "md": "\n![](figs/03.png)\n*插图 · 03*\n\n\n## 一、1951年：劳动保险条例\n\n1951年2月26日，政务院颁布《中华人民共和国劳动保险条例》。这是新中国社会保障的第一块基石。\n\n条例覆盖的企业职工（铁路、航运、邮电三个行业及百人以上工厂）获得了一揽子保障：疾病免费治疗、工伤全薪休养、退休按工龄领取养老金（本企业工龄5年起算，替代率30-60%）、生育假56天、死亡发丧葬费和遗属抚恤。费用由企业按工资总额3%缴纳，其中30%交中华全国总工会作为全国统筹基金，70%留在企业用于当期给付。\n\n> **【《劳动保险条例》1951年2月26日颁布，1953年修正扩大覆盖。条例确立了“企】**业缴费、工会统筹、职工免缴”的模式，职工个人不缴费，由企业单方负担。全国总工会提取30%建立统筹基金，跨企业调剂余缺。这个设计在理念上领先于同时期多数发展中国家。\n\n这个制度有几个特点。一是职工个人不缴费，保障被视为劳动者权利，费用由企业单方承担，体现工人阶级领导的政治定位。二是工会统筹，全国总工会提取30%缴费作为统筹基金，在行业和地区间调剂，使保险不再局限于单个企业。三是企业是执行主体，职工的生老病死都由企业经办，企业既是生产单位也是基层社会单元。\n\n这个制度运转了十五年。从1951年到1966年，劳动保险覆盖面从三个行业扩大到全国国营和大集体企业，退休职工从无到有积累了数百万人。这段时期，中国人均预期寿命从35岁升到65岁，虽然不全归功于劳动保险，但免费医疗和退休金保障确实发挥了基础作用。\n\n## 二、文革的断裂：劳动保险“单位化”\n\n1966年文化大革命爆发，劳动保险制度的运转被打断。\n\n冲击最严重的是工会统筹功能。全国总工会被“砸烂”，各级工会组织瘫痪，劳动保险的统筹基金（30%那部分）失去了管理机构。1969年，财政部发文（《关于国营企业财务工作中几项制度改革意见》），规定：企业不再提取工会统筹基金，劳动保险费用全部在企业营业外支出中列支。这一纸红头文件，改动不过几行字，制度后果却绵延二十年。\n\n这一个动作，把社会保险打回了企业保险。\n\n原来的制度设计是有跨企业调剂的：全国总工会统筹30%，在行业间、地区间、新老企业间平衡负担。文革后统筹基金取消，每个企业各管各的退休人员。老企业退休人员多、负担重；新企业几乎没有退休人员、负担轻。企业间的畸轻畸重从此埋下。\n\n> **【1969年财政部规定企业劳动保险费用在营业外支出中列支，取消了全国总工会30%统】**筹基金。这使劳动保险从社会保险退化为企业保险，每个企业自管自家退休人员，跨企业调剂机制丧失。这一退化持续了二十年，直到1990年代社会化改革才重新建立统筹。来源：周弘《走向人人享有保障的社会》第二章。\n\n更深层的影响是：企业变成了职工“从摇篮到坟墓”的全能机构。生老病死、衣食住行、子弟入学、家属医疗，全部由企业包揽。职工一进企业定终生，甚至两三代人都在同一个企业。劳动力不流动，企业负担越来越重，竞争力越来越差。这个单位体制持续到改革开放前，成为后来改革的最大包袱。\n\n## 三、1978年104号文件：退休潮与“顶替”旋风\n\n1978年5月，国务院发布“104号文件”，即《关于工人退休、退职暂行办法》和《关于安置老弱病残干部的暂行办法》。这是文革后恢复和完善退休制度的第一个重要文件。\n\n104号文件的主要内容：统一企业和机关事业单位的退休条件和待遇；退休金替代率从40-60%提高到60-80%；放宽离职休养条件，覆盖1949年9月底前参加革命工作的人员。\n\n但文件开了一个政策口子：职工因病丧失劳动能力或从事特殊工种可以提前退休，其岗位可由子女“顶替”。初衷是解决病残人员安置和减轻就业压力。但退休金加子女就业的双重动力，加上企业也乐得趁机换人，催生了一股提前退休浪潮。\n\n> **【104号文件后退休职工人数激增：1978年全国314万人，1980年猛增到816】**万，1984年近1400万，六年翻三倍半。大量“假病退”：某省20万退休人员中假病退占70%以上。一个城市的国营理发店一两百名理发师病退后开店，挤垮了28家国营理发店。来源：周弘《走向人人享有保障的社会》第三章。\n\n退休潮的直接后果是企业负担暴涨。1978年退休费用约100亿元，相当于工资总额的10%左右；到1984年退休职工翻了两番，费用同步膨胀。一些老企业的退休费开支相当于工资总额的30-40%，有的甚至超过盈利。成都搬运装卸公司4000在职+4000退休，盈利变亏损，靠交通局补贴过日子。形成鲜明对照的是新兴产业：陕西显像管厂6000名职工仅15名退休工人。\n\n畸轻畸重的负担使竞争机制扭曲。老企业背着沉重退休包袱，在新市场竞争中举步维艰；新企业轻装上阵，获得了不公平的竞争优势。纺织业等传统优势产业因退休负担沉重，生存和发展受到威胁。\n\n## 四、畸轻畸重倒逼改革：从企业保障到社会化统筹\n\n1982年1月，国家劳动总局在重庆召开云、贵、川三省社会保险座谈会，两个议题提上日程：集体所有制企业养老金改革、全民所有制企业退休费用统筹。这两个议题指向同一个方向：劳动保险要“去单位化”，建立社会化的保障体系。\n\n退休费用社会统筹的核心思路很简单：把各企业分散负担的退休金收上来，建立统筹基金，按实际需要统一发放。老企业退休人员多但缴费基数大（如果统筹范围够大），新企业退休人员少但也要缴费，在统筹范围内均摊负担。\n\n但改革阻力来自有实力的国有企业。对于退休负担轻的新企业来说，统筹等于拿我的钱养别人的退休人员，不划算。改革从无到有比动既得利益容易，集体企业没有旧制度包袱，反而率先建立了社会化养老金。\n\n> **【1982年国家劳动总局重庆座谈会提出去单位化、社会化统筹的思路。但改革推进异常艰】**难。原劳动人事部保险福利局局长傅华中回忆：“整个80年代，社会保险改革的推进异常艰难，没有一个'红头文件'，只能动员各地以试点来推动工作……法定强制社会保险，没有法律依据开展工作，应该说是不正常的。”来源：周弘书第三章。\n\n重庆座谈会上有一场关键争论：先搞全民企业退休费用统筹，还是先搞集体企业？当时四川省劳动局保险处处长周修杰力主先从集体企业入手。他有一句被反复引用的概括：全民企业的问题是“吃多吃少问题”，集体企业的问题是“有吃没吃问题”。前者已有制度只是待遇偏低，后者连退休制度都没有，街道企业的老职工干到71岁退不了休的比比皆是。先解决有吃没吃的问题，阻力小、示范效果好；新建制度还可以绕开全民企业的既得利益纠缠。这个判断被历史证明是对的。集体企业试点跑通之后，全民企业的统筹才有了可借鉴的模板和可说服的依据。\n\n最早被选中的试点是四川南充。1982年，南充是一个以轻工业为主的县级小城，在职职工7.1万人，集体企业职工占31%。这些集体企业规模小、经营不稳，退休负担逐年加重，已经自发冒出了各种自办养老办法：有的企业每月给老职工发几块钱糊口，有的干脆让超龄职工继续上班不办退休。南充摸底后定下方案：企业按工资总额20%提缴，个人按标准工资3%缴纳，国家以利润分成优惠（街道企业上缴利润从20%降到10%）和税前列支两种方式资助。“国家资助、企业多纳、个人少出”的三方筹资雏形由此奠定。但个人缴费那一关差点过不去。当时主流观念是“我参加了工作就是国家的人，国家要负责我的福利”，让个人掏钱被指为违反社会主义原则。僵持中，一名企业女会计站出来做了番慷慨陈词，局面才扭转。原南充市社会保险局局长朱梓尧事后总结个人缴费的四大好处：促使职工关心社保、发动群众监督基金、有利于筹资、可作为日后计算待遇的依据。这四条逻辑，今天看来稀松平常，在1982年的中国却是破天荒。\n\n1984年12月，自贡市被推到了国务院法制局的汇报桌上。这个千年盐都退休负担沉重：贡井盐厂1983年利润79万元，退休费却要付185万元，盈利企业直接被拖成亏损。退休费占工资总额的比重从1964年的3%涨到1984年的40%，个别企业高达69%。负担扭曲了经营数据，老企业靠补贴过日子，新企业轻装上阵，国家根本没法考核真实效益。自贡在26个方案基础上打磨出一个“四六开”妥协方案：六成按工资总额12.5%统一缴纳，四成按各企业实际退休费开支的40%缴纳。即便如此，退休负担轻的东方锅炉厂还是不愿参加：每月要缴12万，自家的退休费才6万。最后是国务院一声令下：中央、省属单位全部参加统筹。这个行政命令兜底的逻辑，后来在全国统筹调剂中也反复出现。\n\n各地试点的模式五花八门，“两江模式”（江苏镇江、九江的医保社会统筹）、“板块模式”（按行业统筹）、“布吉模式”（深圳布吉的农村社保）层出不穷。这些试点并非各行其是，而是在中央原则性规定下探索适合的落实方式。中央的原则目标始终是：“资金来源多渠道、保障方式多层次、社会统筹与个人账户相结合、权利与义务相对应、管理服务社会化。”\n\n## 五、1991-1997：统账结合的确立\n\n1991年，国务院发布33号文《关于企业职工养老保险制度改革的决定》，首次提出“基本养老保险、企业补充养老保险和职工个人储蓄性养老保险相结合”的多层次架构。这是统账结合改革的起点。\n\n1995年，国务院发布6号文，提出社会统筹与个人账户相结合的具体实施方案，给出了两个实施办法供各地选择。但两个办法的差异导致各地做法不一，制度碎片化加剧。\n\n1997年，国务院发布26号文《关于建立统一的企业职工基本养老保险制度的决定》。这个文件是统账结合制度框架的定型之作，统一了企业缴费比例（原则上不超过20%）、个人缴费比例（不低于4%逐步到8%）、个人账户规模（11%）、基础养老金计发办法（社会平均工资20%+个人账户除以120）。\n\n> **【1997年国务院26号文确立了统账结合制度框架：社会统筹（雇主缴20%）负责再分】**配，个人账户（雇员缴8%+雇主划入3%=11%）负责积累。设计初衷是兼取现收现付制和积累制之长，统筹账户保共济，个人账户保激励。但实际运行中，个人账户资金被挪用支付当期养老金，空账问题由此产生。详见第四章。\n\n26号文真正的功绩在于“统一”二字。此前1991年的33号文提了多层次架构，1995年的6号文给了两个实施办法供各地选择。结果各地做法五花八门，制度碎片化加剧。有的省按社平工资的20%发基础养老金，有的省按15%；有的省个人账户是16%，有的省是11%；缴费比例从12%到25%都有。一个跨省流动的工人到了新地方，账户怎么接续、待遇怎么计算，几乎没有标准答案。26号文把这些参数钉死：基础养老金社平20%、个人账户11%、企业缴费不超过20%、个人缴费不低于4%，一锤定音。从此各省的制度框架有了统一的口径，后续的转移接续、全国统筹才有了技术基础。但26号文也留下了一个致命的未决问题：转轨成本由谁承担？老人和中人的视同缴费怎么补？这个问号悬而未决，直接催生了下一章要详述的空账困局。\n\n统账结合的设计理念是聪明的：把俾斯麦式的所得比例（统筹）和新加坡式的个人账户（积累）嫁接在一起，理论上兼顾了再分配和激励。但这个设计有一个致命的前提假设：个人账户里要有真钱。如果个人账户是空的，缴费被统筹账户挪用了，储蓄功能就是假的，制度就退化成了纯现收现付制，激励相容性大打折扣。\n\n这个假设在实际运行中没有成立。第四章会详述空账的来龙去脉。\n\n## 六、2010年社会保险法：覆盖全民\n\n2010年10月28日，《中华人民共和国社会保险法》由全国人大常委会通过。这是新中国第一部覆盖全民的社会保险法。\n\n从1951年劳动保险条例到2010年社会保险法，近六十年。这个立法进程的缓慢，折射的是中国社会保障制度建设的艰难：不是立法者不想快，是经济社会条件不允许。\n\n社会保险法确认了“五险”（养老、医疗、失业、工伤、生育）的法律地位，明确了用人单位和劳动者的缴费义务，确立了社会保险的强制性质。此后，中国社会保障进入全覆盖的快车道：\n\n- 2011年城镇居民社会养老保险试点启动，2012年实现制度全覆盖；\n- 2012年新型农村社会养老保险与城镇居民养老保险合并为城乡居民基本养老保险；\n- 2014年机关事业单位工作人员养老保险并轨改革启动；\n- 2016年城镇居民基本医疗保险与新型农村合作医疗合并为城乡居民基本医疗保险。\n\n到2024年，基本养老保险参保10.7亿人、基本医疗保险参保13.3亿人，覆盖了几乎所有国民。这个规模在人类历史上没有先例。\n\n**表3：中国社会保险制度演化关键节点**\n\n| 年份 | 事件 | 意义 |\n|:---:|------|------|\n| 1951 | 劳动保险条例 | 新中国社保起点 |\n| 1969 | 取消工会统筹 | 社保退为企业保险 |\n| 1978 | 104号文件 | 退休潮、顶替旋风 |\n| 1982 | 重庆座谈会 | “去单位化”思路 |\n| 1991 | 33号文 | 多层次架构 |\n| 1997 | 26号文 | 统账结合定型 |\n| 2010 | 社会保险法 | 覆盖全民立法 |\n| 2014 | 机关事业并轨 | 三轨合一第一步 |\n| 2016 | 城乡医保合并 | 统一城乡居民医保 |\n\n## 七、“从国家的人到社会的人”\n\n周弘在《走向人人享有保障的社会》结尾写了这样一段话：\n\n> “在新中国成立初期，一名国有企业的职工可能会说：'只要我认真工作，我就是国家的人了。'在发生了这一系列的变化过后，他应当说：'只要我按时缴费，我就是社会的人了。'”\n\n这个转变的深意，不亚于经济体制从计划到市场的转变。\n\n所谓国家的人，意味着保障来自国家（通过企业执行），个人不需要缴费，但也不拥有权利（企业好则保障好，企业差则保障差，失业即失保）。个人的命运绑定在单位上，单位绑定在计划上，计划绑定在国家上。一级绑一级，个人没有选择权，也没有缴费义务，但也没有制度保障。\n\n所谓社会的人，意味着保障来自社会统筹，个人缴费换取权利，权利不因企业好坏而异、不因失业而丧失（可转移接续）。个人与国家的关系变得更直接：不再通过企业中转，而是通过制度直接对接。国民身份变得更具体。\n\n> **【周弘总结中国社保变迁六大特征：①从无到有覆盖13亿人；②社保与就业密切关联（从单】**位保障到社会化）；③主要动力来自执政党的社会理念（自上而下推动）；④多样化发展态势（试点先行）；⑤统筹既破坏旧边界又催生新边界；⑥个人与国家关系变化，从国家的人到社会的人。来源：周弘《走向人人享有保障的社会》第六章“伟大的社会变迁”。\n\n但社会的人还没有完全实现。三轨并行、省际碎片、个人账户空账。这些制度性的断裂，让社会的人还停留在理念层面。一个人从广东跳槽到黑龙江，养老保险关系转移接续的麻烦依然存在；一个农民工回乡，城镇职工养老保险能不能带回去仍是问题；个人账户里记着数字但账户里没有真钱，社会的人的权利还有太多窟窿。南充那名女会计1982年争取来的个人缴费原则，到今天名义上已经普及全国，但“缴了能不能拿到、账户里的数字是不是真钱”，仍然是悬在数亿参保人头上的疑问。制度框架往前走了一步，资金真相却还落在后面。\n\n回看统账结合的制度设计，有一个深层的悖论需要正视。1997年26号文的设计者试图兼取现收现付制和积累制之长，统筹账户保共济、个人账户保激励。但这个嫁接有一个前提假设：个人账户里要有真钱。如果个人账户是空的，缴费被统筹挪用了，储蓄功能就是假的，统账结合就退化成纯现收现付制。\n\n这个前提假设在实际运行中没有成立。不是因为谁故意挪用，而是因为转轨成本没有单独筹资。统筹账户要同时养老人和中人的视同缴费。这些是没有实际缴费的承诺，不够用就挪个人账户。这是制度设计的先天不足，不是执行的问题。\n\n换句话说，统账结合的“统”和“账”从一开始就不是平等的伙伴。统是当家的，背着转轨成本的重担，需要钱就找账借。账是配角，名义上独立，实际上被掏空。这个格局不改变，账永远是空账，统账结合永远是名实不符。第四章会详述这个先天不足的来龙去脉，以及为什么不如正式承认NDC化，把空账从不得不接受的现状变为主动选择的制度形态。\n\n中国社保制度的演化路径，是一条从单位的人向社会的人的漫长转型路。走到今天，制度框架搭起来了，覆盖面铺开了，但转型的包袱（空账、碎片、三轨）还没有卸下。从1951到2010，近六十年走了第一步，从单位保障到社会统筹；从2010到今天又走了一步，从制度全覆盖到权益可携带。但社会的人那句承诺要真正兑现，还有第三步要走。下一章解剖这些包袱中最重的一个：空账与转轨成本。"}, {"part": "上编", "partName": "困境与原理", "num": "第四章", "title": "空账与转轨", "md": "\n![](figs/04.png)\n*插图 · 04*\n\n\n## 一、一个聪明的想法\n\n1997年国务院26号文确立的统账结合制度，在设计层面是一个聪明的想法。\n\n社会统筹账户（雇主缴纳工资总额的20%）负责再分配：高收入者多缴、低收入者相对多得，保基本、兜底线。个人账户（雇员缴纳8%，加上雇主划入3%，合计11%）负责积累，多缴多得、激励相容，类似新加坡公积金或智利AFP的个人账户。\n\n设计者的初衷是兼取现收现付制和积累制之长。统筹账户是俾斯麦式的所得比例给付，保共济；个人账户是新加坡式的强制储蓄，保激励。两个账户各管一摊，理论上既公平又有效率。\n\n> **【1997年26号文统账结合设计：社会统筹（雇主20%）+ 个人账户（雇员8%+雇】**主划入3%=11%）。设计者预期个人账户积累约11%的工资，退休时按月领取，作为统筹账户养老金的补充。但这个设计有一个前提：个人账户里要有真钱。\n\n但这个设计有一个致命的前提：**个人账户里要有真钱。** 如果个人账户是空的，缴费被统筹账户挪用了，储蓄功能就是假的，统账结合就退化成了纯现收现付制，激励相容性大打折扣。\n\n实际运行中，这个前提没有成立。\n\n## 二、转轨成本：制度切换的账单\n\n统账结合改革前，中国退休人员的养老金是由企业直接发放的，即企业保险。1997年改革后，养老金改由社会保险基金发放，即社会保险。\n\n这个切换看似简单，实际上产生了一笔巨额的隐性债务。\n\n考虑三类人：\n\n**老人**：1997年改革前已经退休的人员。他们的养老金原来由企业发，改革后改由社保基金发。但社保基金没有预先为这些人积累资金。他们是空手接收的。老人未来全部养老金的现值，就是转轨成本的第一部分。\n\n**中人**：1997年改革时在职、但此前已有工龄的人员。他们在1997年前的工龄“视同缴费”，即没有实际缴费但算作缴费年限。这些视同缴费年限对应的未来养老金，也是转轨成本。\n\n**“新人”**：1997年后参加工作的人员。他们从入职起实际缴费，理论上不产生转轨成本。\n\n$$D_{transition} = \\sum_{i \\in old} P_i \\cdot a_i + \\sum_{j \\in mid} P_j \\cdot v_j$$\n\n其中 $P$ 是人均养老金给付，$a$ 是老人的剩余领取年数，$v$ 是中人视同缴费年限对应的给付折现值。\n\n> **【转轨成本的估算因假设不同差异巨大：1990年代末学界低估约1.9万亿元，世界银行】**估算约4-8万亿元（当年价），含未来全部给付义务的高估可达8-10万亿甚至86万亿元。范围之所以大，因为折现率、工资增长率、待遇调整假设不同。但无论取哪个估算，这都是一笔万亿级的隐性债务，没有在财政预算中显性化，而是由社保基金的当期缴费和财政补贴分摊。\n\n这个估算范围的离谱程度，本身就值得制度史留一笔。1.9万亿到86万亿，上下限差了45倍，相当于同一笔账，有人看见的是茶杯，有人看见的是泳池。差异全在假设里：算到哪一年为止？折现率取3%还是7%？工资增长率按5%还是8%？待遇调整跟CPI还是跟社平工资？要不要把机关事业单位的并轨成本也算进来？每一个问号都能撬动几十万亿的口径。学界的共识是：把口径限定在“已退休老人+中人视同缴费”这两块、折现到2020年价、不含机关事业，数字约在5-10万亿区间。这是一笔真实但可控的隐性债务。问题不在于数字多大，而在于它一直没有被显性化、没有被分摊计划覆盖。账不挂出来，就没有人会主动还。\n\n关键问题在于：**这笔转轨成本由谁承担？**\n\n1997年改革时没有明确回答这个问题。改革文件只是规定“老人老办法、新人新制度、中人过渡办法”，确定了待遇计发规则，但没有为转轨成本单独筹资、单独入账。\n\n结果就是：社会统筹账户要同时干两件事，即**发当期退休人员养老金（含老人和中人）+ 积累自己该积累的部分**。一份钱干两份活，不够用。不够怎么办？挪用个人账户的钱。\n\n## 三、空账：名义与实际\n\n这就是空账的机制。\n\n社会统筹账户（雇主缴费20%）不够支付当期养老金。因为统筹账户要养老人和中人的视同缴费年限，这些都是没有实际缴费的。不够的钱，从个人账户（雇员缴费8%+雇主划入3%）里挪用。\n\n挪用的结果：个人账户里记着数字（名义余额），但账户里没有对应的真钱，实际余额为零或极少。\n\n$$\\text{空账规模} = \\sum_{i} (\\text{个人账户名义余额}_i - \\text{个人账户实际余额}_i)$$\n\n每年新增空账 ≈ 当期挪用额 ≈ 统筹账户缺口 ≈ 养老金支出 - 统筹缴费收入。\n\n空账规模逐年累积。到2020年代，学界估算全国个人账户空账累计达**数万亿元**，具体数字因口径不同有争议，但量级是确定的。中国社科院郑秉文团队的测算口径较窄，把空账界定为个人账户名义余额与实际余额之差，2015年前后这个数字约4万亿元，到2022年前后已逼近6-7万亿元区间。中国社科院另一支团队、人民大学董克用课题组则把口径放宽到全部隐性养老债务未覆盖部分，得出的数字更大，量级在10万亿以上。两支团队口径不同、结论不同，但有两点一致：一是空账规模在持续扩大，没有见顶；二是即使按最窄的口径，也已经是万亿级的隐性窟窿，且每年以千亿规模新增。学术分歧不影响一个基本判断。这是一个正在长大的洞，而不是一个正在缩小的洞。\n\n> **【个人账户空账的根源不是某届政府的失误，而是1997年统账结合改革时转轨成本未单独】**筹资的制度设计缺陷。统筹账户要养老人和中人的视同缴费，但没有对应资金来源，只能挪用个人账户。这是“制度性空账”，不是“管理性挪用”。\n\n空账的后果是严重的。个人账户的储蓄功能名存实亡，缴费者看到账户里有数字但知道没有真钱，对制度的信任下降。年轻人觉得“我缴的钱被发给了现在的退休者，等我老了不一定拿得到”，缴费意愿降低，逃保、断保增加。制度陷入恶性循环：空账→信任下降→逃保→统筹缺口更大→挪用更多→空账更大。这个循环在2010年代后期已经显现：城镇职工养老保险的断保人数一度上升，灵活就业人员参保意愿走低，制度的信任基础在悄悄被侵蚀。\n\n## 四、做实试点：一个失败的努力\n\n2001年起，国家在辽宁等省份试点做实个人账户，试图把个人账户真正积累起来，不再挪用。\n\n做实的逻辑：财政补贴一部分钱，把被挪用的个人账户资金补回去，使名义余额等于实际余额。试点从辽宁开始，扩展到吉林、黑龙江等东北省份。\n\n做实试点有一个清晰的扩展路径：2001年辽宁率先启动，按“中央财政补3.75%、地方财政补1.25%、统筹基金补1%”的三方比例做实5%的个人账户起步；2004年扩展到吉林、黑龙江，比例下调到5%；2007年再扩展到天津、山西、上海、山东、河南、湖北、湖南、新疆等11个省份，按东中西部区别比例（东部自筹、中部中央补、西部中央多补）。到2008年前后，做实试点的省份扩大到13个，但每一步推进都比上一步更吃力。中央财政每扩一个省，就要多背一块补贴；地方财政越穷，扩起来越艰难。\n\n但做实遇到两个困难。\n\n一是统筹缺口更大。做实意味着不能挪用个人账户，统筹账户必须独自承担当期养老金支出。但东北省份退休人员多、在职缴费者少，统筹缺口本来就大。不能挪用个人账户后，缺口更大，需要更多财政补贴。辽宁试点头三年，中央财政每年要补几十亿才能维持运转。做实一块，财政就要补一块，做实等于把隐性债务显性化成财政支出。\n\n二是做实的资金沉淀。做实后个人账户有真钱了，但这些钱怎么运营？地方政府缺乏专业投资能力，大量资金存在银行，收益率跑不赢CPI。做实了反而亏：名义上有钱，实际在贬值。辽宁试点前几年，做实资金的实际收益率不足2%，同期CPI动辄3-5%，等于每年缩水一两个百分点。做实出来的真钱在账上慢慢蒸发。这比空账还尴尬：空账至少不需要操心保值，做实了反而要为贬值负责。\n\n2010年代后，做实试点基本停滞。中央默认了空账常态化，个人账户实质上变成了名义账户，记账但不存钱。从想做实到承认做不动，这个心态转折花了十年，也耗去了东北三省数百亿财政投入的教训成本。\n\n> **【辽宁做实个人账户试点2001年启动，后扩展到东北三省。但做实后统筹缺口扩大、资金】**运营效率低，试点未能推广。2010年代后做实试点基本停滞，个人账户空账常态化。这标志着统账结合制度中积累制部分的实质性失败：名义上的统账结合实际退化为纯统筹，即纯现收现付制。\n\n做实试点的失败，揭示了一个深层矛盾：**在转轨成本未化解的前提下，个人账户不可能真正积累。** 只要统筹账户还背着老人和中人的转轨负担，它就会持续挪用个人账户。做实只是在用财政补贴填窟窿，但窟窿太大，财政填不起。\n\n## 五、省际失衡：9:1对1.3:1\n\n空账是全国性的问题，但地区间的不平衡更加尖锐。\n\n社会保险基金的统筹层级长期在县级和省级之间徘徊。各省的缴费者和退休者比例差异巨大：经济发达、人口流入的省份结余充裕，经济落后、人口流出的省份当期收不抵支。\n\n**表4：省际抚养比对比（2024年估算）**\n\n| 省份 | 制度内抚养比 | 特征 |\n|:---:|:---:|------|\n| 广东 | 约9:1 | 人口流入大省，9个缴费者养1个退休者，结余充裕 |\n| 北京 | 约5:1 | 人口流入，结余较好 |\n| 全国平均 | 2.6:1 | |\n| 辽宁 | 约1.8:1 | 老工业基地，退休人员密集 |\n| 黑龙江 | 约**1.3:1** | 1.3个缴费者养1个退休者，当期严重收不抵支 |\n| 吉林 | 约1.6:1 | 同属东北，困难类似 |\n\n> **【广东抚养比约9:1，黑龙江约1.3:1，两省差距7倍。2022年启动全国统筹调剂】**后，东北三省每年从全国调剂中获得超2000亿元补助。这意味着广东等人口流入省的社保结余，被调剂到东北等人口流出省发放养老金。来源：报告04引用人社部全国统筹调剂数据。\n\n省际失衡的根源是人口流动。改革开放以来，劳动力从东北、中西部流向珠三角、长三角，四十年的单向流动刻进了社保账本。年轻劳动力走了，缴费基数留在了流入省；退休老人留下了，养老金支出留在了流出省。人口流动天然导致社保负担的地理错配。\n\n全国统筹调剂是应对这个问题的制度安排。2018年启动中央调剂金制度，各省按比例上缴一部分结余，由中央分配给收支缺口省份。2022年全面推开全国统筹，调剂规模逐年扩大。\n\n但调剂只是补窟窿，不是治根本。只要人口还在持续从东北流向南方，东北的抚养比就会持续恶化，调剂需求就会持续扩大。广东等省份的结余不是无限的。当广东自身的老龄化加速（广东60+人口占比也在上升），结余增长会放缓甚至逆转，调剂的资金来源就会萎缩。\n\n## 六、准NDC：空账的制度含义\n\n回到那个问题：空账是问题还是制度特征？\n\n从另一个角度看，空账意味着中国的个人账户实际上已经是**名义账户**，记账但不存钱。这与瑞典1998年改革的NDC（名义确定缴费制，Notional Defined Contribution）在形式上高度相似。\n\n瑞典的NDC：缴费进入名义账户（不实际投资），退休时按账户余额和预期寿命计算年金。待遇是“缴费确定”的，多缴多得，但资金来源是当期缴费（PAYG），不是真实积累。\n\n中国的个人账户空账：缴费记入个人账户（不实际积累，被统筹挪用），退休时按账户余额计算待遇。待遇也是缴费确定的，多缴多得，但资金来源同样是当期缴费。\n\n形式上几乎相同。区别在于：\n- 瑞典正式承认NDC，设计了完整的精算体系：寿命指数化（退休时按预期寿命调整年金因子）、自动平衡机制（系统资产/负债比<1时自动削减）、AP缓冲基金。\n- 中国没有承认空账是NDC，缺乏精算设计：没有寿命指数化（退休后按固定月数除），没有自动调整机制（年度调整靠行政决策）。\n\n这个区别看似技术性，其实是制度哲学的分野。瑞典人1998年改革时做了一个清醒的选择：既然人口结构注定要恶化，那就把这个恶化写进公式，让它自动体现在每一年的待遇调整里，不再留给政治决策来回拉扯。寿命指数化的含义是：同一笔名义账户余额，如果退休时预期寿命是20年，年金因子按20算；如果十年后预期寿命延长到22年，年金因子自动按22算。同一笔钱分得更长，每月到手更少。这不是“克扣”，是把长寿风险在同龄退休者之间均摊。中国目前恰恰缺这一道。1963年出生的人和1993年出生的人，如果名义账户余额相同，按现行计发办法算出来的月养老金可能差不多，但前一批人预期再活20年，后一批人预期再活25年，后一批人的终身给付反而更少，账面平等掩盖了事实上的代际不平等。NDC的精算设计就是为了消除这种隐性的代际转移。\n\n> **【中国的个人账户空账与瑞典NDC在形式上高度相似，都是“名义记账、PAYG运行、缴】**费确定”。区别在于：瑞典正式承认并设计了精算体系（寿命指数化+自动平衡+缓冲基金），中国没有承认也缺乏精算设计。这意味着中国的“准NDC”有NDC的缺点（无真实积累），但没有NDC的优点（自动调整机制）。\n\n这个对比揭示了一个重要的制度选择空间：**与其维持名实不符的统账结合（名义上有个人账户但实际是空的），不如正式承认NDC化，并补上精算设计。** 这不是放弃积累制，积累制从来就没有真正运行过，而是把已经在做的事情做规范、做透明、做到位。\n\nNDC化的好处：\n1. **消除空账这个负面标签**：不再是挪用个人账户，而是名义账户的正常运行。\n2. **引入寿命指数化**：退休时按预期寿命调整年金因子，长寿风险自动分担。\n3. **引入自动调整机制**：系统依赖比恶化时自动减缓待遇增长，降低政治成本。\n4. **保留多缴多得激励**：名义账户仍记录缴费，待遇与缴费挂钩。\n\n这些正是第九章（从碎片到统一）和第十章（自动调整与照护）要详述的改革路径。\n\n## 七、包袱还是特征\n\n空账、转轨成本、省际失衡。这三个“包袱”从不同角度看，性质不同。\n\n空账是问题还是“特征”？取决于是否承认NDC化。不承认，空账就是挪用的污名；承认并补上精算设计，它就是名义账户的正常运行。\n\n转轨成本是“包袱”还是“历史遗产”？取决于是否显性化分摊。不分摊，它就持续以挪用个人账户的方式隐性消化；显性化（如划转国有资本一次性填入），它就变成一次性的制度切换成本。\n\n省际失衡是“困难”还是“过渡”？取决于全国统筹的深化程度。调剂只是补窟窿；真正的全国统筹（统一费率、统一给付、统一基金池）才能从根本上消除地理错配。\n\n中国统账结合制度的这三重困境，不是哪个环节出了错，而是制度设计的“先天不足”：1997年改革时，转轨成本未单独筹资、个人账户与统筹账户的关系未理顺、统筹层级停留在县级。这些先天不足在人口红利期还能掩盖，缴费者多、退休者少，缺口不明显。但当人口红利转向负债期，婴儿潮退休叠加生育低谷，三重困境同时爆发。\n\n更值得反思的是，1997年那套设计并非没有先例可循。世界银行1994年的《防止老龄化危机》报告已经把“再分配、储蓄、保险”三功能分立讲清楚，瑞典的NDC改革1998年就要落地。中国选择了统账结合这个混合形态，理论上是聪明的，兼取PAYG的再分配和积累制的激励。但聪明的理论嫁接到复杂的现实，需要的不是一纸文件，而是一整套配套：转轨成本要有人认、账户资金要有去处、统筹层级要有强制力。这三条配套，1997年一条都没跟上。文件写了统账结合四个字，但转轨成本的账没有挂出来、个人账户的钱没有真存进去、统筹基金的池子没有真正做大。框架立起来了，血肉却没有跟上。制度在骨架状态下运行了二十多年，等到人口红利退潮，骨架下的窟窿才一齐暴露。\n\n增税议程（即多收钱）是对这三重困境的本能反应。但多收钱治标不治本。真正的出路在于：显性化转轨成本、正式承认NDC化、深化全国统筹、引入自动调整机制。这些是下编要讲的内容。\n\n上编到此为止。钱去哪了（第一章）、代际契约为什么裂（第二章）、制度怎么演化到今天（第三章）、空账和转轨的包袱有多重（第四章），困境和原理已经讲清楚了。中编开始讲镜鉴：以日为鉴，观全球谱系，回到中国体制症结。"}, {"part": "中编", "partName": "镜鉴", "num": "第五章", "title": "以日为鉴", "md": "\n![](figs/05.png)\n*插图 · 05*\n\n\n## 引子：借他人的教训省自己的学费\n\n以日为鉴不是崇日，是借他人的教训省自己的学费。\n\n日本是全球老龄化最快的国家，没有之一。从65岁以上人口占比7%到21%，日本只用了37年，而欧美发达国家普遍需要50到150年。2024年日本高龄化率29.3%，在人口4000万以上的38国中位列世界第一，紧随其后的意大利25.1%、德国23.7%，都还差一截。75岁以上人口占比16.8%，已经超过65至74岁人口。这意味着日本不只是老，而是老中之老。这不是一个远方岛国的故事，是中国十年后的预演。\n\n中国2024年65岁以上占比15.6%，按学界推算2033年前后将突破21%，速度与日本相当。但中国多了一个加速器：计划生育。日本的人口曲线是缓坡下行，中国是断崖跌落。1960至70年代出生的计划生育前高峰人群正成批退休，而他们身后接替的1990至2000年代出生者数量更少。断崖更陡，冲击更集中。\n\n日本用三十年走完了从福利扩张到财政重建、从代际断层到制度纠偏的全过程。1973年福利元年大幅扩张社保，八十年代迟滞重建，2004年导入宏观经济滑动机制，2012年消费税从5%到8%再到10%的政治苦战，介护保险1997年立法2000年实施的社会化创新，GPIF 2014年纪律化改革累计收益196兆日元。这些不是教科书上的案例，是日本人用真金白银、用代际撕裂、用政治动荡换来的经验。\n\n中国正站在类似关口。60岁以上人口3.1亿占22%，抚养比2.6比1仍在恶化，养老基金剔除补贴缺口1.39万亿，49城长护险试点尚未全国推开，计划生育一代正进入退休高峰。改革窗口还在，但窗口不会永远开着。\n\n> **【日本高龄化率推移（内閣府「令和7年版高齢社会白書」）：1970年7%→1994年】**14%→2007年21.5%→2024年29.3%。7%至14%倍加仅24年，14%至21%倍加仅13年，速度冠绝全球。2024年75+人口2078万，占比16.8%。\n\n这一章不按日本制度排排坐，而是按中国面临的六个问题逐一照镜：老龄化加速、养老基金运营、长护需求、代际公平、改革时机、筹资困境。每个主题先说中国当下的困境，再展开日本提供了什么镜鉴。\n\n## 一、老龄化加速：改革窗口期有限\n\n中国正在步入老龄化加速期。60岁以上人口3.1亿占22%，65岁以上人口2.17亿占15.6%，抚养比2.6比1。计划生育一代正进入退休高峰，他们身后接替的子代数量更少，人口断崖比任何国家都陡。这是中国当下的人口底色，也是所有社保困境的总根源。\n\n日本的镜鉴在于两个维度：速度，以及速度逼出来的窗口意识。\n\n先看速度。日本老龄化的三级跳，节奏快得令人窒息。1970年65岁以上占比突破7%，进入老龄化社会；1994年突破14%，进入老龄社会；2007年突破21%，进入超老龄社会。7%到14%只用了24年，14%到21%只用了13年。相比之下，法国从7%到14%用了126年，瑞典85年，美国69年，英国46年。日本不是老得最重的国家，论比重它还排在摩纳哥之后，但论老得最快的国家，日本当之无愧。\n\n**表1：日本老龄化三级跳与世界主要国家倍加年数对比**\n\n| 阶段节点 | 日本达成年份 | 倍加年数 | 法国 | 瑞典 | 美国 | 英国 |\n|---|:---:|:---:|:---:|:---:|:---:|:---:|\n| 65+占比7%（老龄化社会） | 1970 | — | 1864 | 1890 | 1930 | 1929 |\n| 65+占比14%（老龄社会） | 1994 | **24年** | 126年 | 85年 | 69年 | 46年 |\n| 65+占比21%（超老龄社会） | 2007 | **13年** | — | — | — | — |\n| 65+占比29%+（现况） | 2024 | — | — | — | — | — |\n\n注：法国等欧洲国家21%节点尚未达成或年份较新，故留空。数据来源：内閣府高齢社会白書、総務省統計局。\n\n速度本身不是问题，问题是速度背后的人口结构翻转。日本生产年龄人口（15至64岁）1995年达峰值8716万，此后持续减少，2024年降至7373万。抚养比（现役世代与65岁以上人口之比）从1950年的12.1比1，跌到2024年的2.0比1，预计2070年只剩1.3比1。一个人口红利期（1960至1990年代）支撑经济高速增长与社保大幅扩张的国家，在人口负债期（1995至今）突然发现：支者减、受者众，结构性的社保赤字全面显现。\n\n中国的节奏与日本相似，但有两个加速器。一是计划生育。人口出生率从1990年代陡降，1987年出生2502万，到2024年只剩954万，不到四成。二是预期寿命延长。2024年中国人均预期寿命79岁，比1990年延长近10岁。两个因素叠加，老龄化冲击比日本更集中。中国社科院预测，到2050年老年抚养比将升至53.5%，即每100个劳动年龄人口养53.5个老人；到2084年峰值可达87.5%，几乎一对一。\n\n日本的教训不在速度本身，而在速度逼出来的窗口意识。人口红利尾声，是改革最佳窗口：负担尚轻、结构尚优、调整余地尚大。错过了这个窗口，等人口负债期全面到来再被动调整，代际不公已固化、财政压力已堆积、政治阻力已形成，每一次改革都要付出十倍的代价。日本错过了，中国还能不能再错过一次？\n\n## 二、养老基金运营：GPIF的纪律化配置\n\n中国全国社保基金理事会管理的战略储备，2024年末资产3.32万亿元，成立24年年均收益率7.39%，2024年当年投资收益率8.10%。但境外配置仅约13%，大部分资产留在境内。3.32万亿对每年1.39万亿缺口来说，只够补二十几年。基金运营的效能，直接决定战略储备能撑多久：是缓冲器，还是永续的财源。\n\n日本的GPIF（年金积立金管理运用独立行政法人）给出了一个近乎教科书式的对照。\n\nGPIF管理运营日本公共年金的积立金，2025年度末资产293.6兆日元，2026年第一季度因全球股市大涨，资产跃至317.8兆日元。自2001年度起累计收益196兆9306亿日元。这个数字是什么概念？相当于日本一年社保给付费的1.4倍。一笔存量用二十年时间赚出了超过一年流量的体量，这就是纪律化运营的力量。\n\n> **【GPIF规模与收益（GPIF官方）：2025年度末运用资产293.6兆日元，20】**26年Q1（4-6月）单季收益24.1兆日元、资产增至317.8兆日元。2001年度起累计收益196兆9306亿日元。目标收益率1.9%。GPIF仅承担年金给付费约1成，9成仍由现役保险费与国库负担，积立金是缓冲器而非主力。\n\n但GPIF的故事重点不在数字，在2014年那场改革。\n\n2014年以前，GPIF的资产配置是典型的低收益国内债中心：国内债券占60%，国内股票仅12%。这种配置在人口红利期看似稳健，债券收益低但稳定，不冒风险。但进入人口负债期后，问题暴露：债券收益率持续走低，积立金增值速度远跟不上给付费膨胀速度。安倍经济学配套推动下，GPIF 2014年做了史上最大调整，把国内债券从60%砍到35%，国内股票从12%翻到25%，海外债券提到15%，海外股票提到25%。\n\n**表2：GPIF 2014年资产配置改革前后对比**\n\n| 资产类别 | 改革前目标比例 | 2014年改革后目标比例 | 变动 |\n|---|:---:|:---:|:---:|\n| 国内债券 | 60% | 35% | **-25个百分点** |\n| 国内股票 | 12% | 25% | +13个百分点 |\n| 海外债券 | 约11% | 15% | +4个百分点 |\n| 海外股票 | 约12% | 25% | +13个百分点 |\n| 合计股票 | 约24% | 50% | **+26个百分点** |\n\n注：2026年最新动向显示，GPIF基本组合正朝四类资产各25%目标演进，进一步降低国内债券比重。数据来源：GPIF官方、Reuters、Institutional Investor。\n\n这场改革的逻辑不复杂：一个面临超老龄化的国家，社保积立金不能继续躺在低收益债券上安全地贬值。必须承担更高风险、把握全球股市长牛，让存量增值跟上流量膨胀。改革效果立竿见影。2014年后全球股市进入长牛周期，GPIF的股票配置大幅受益，累计收益从改革前不足50兆日元跃至2025年的196兆日元。\n\n但GPIF更可资借鉴的，是治理结构。GPIF是独立行政法人，不是政府机关，运营独立于政治干预。它有明确的政策资产组合（policy asset mix），即目标配置比例加容许偏差带（正负5至6个百分点），超出偏差带即触发再平衡。这套纪律化机制，把投资决策从谁当政谁说了算变成了按规则办事。\n\n对中国社保基金理事会的启示是直接的。3.32万亿的体量不算小，但境外配置仅13%，大部分资产留在境内，既没有充分把握全球增长红利，也承担了过度集中的国别风险。如果中国能借鉴GPIF的纪律化配置框架，把境外配置逐步提到30%以上，把政策资产组合、容许偏差带、独立法人治理的制度框架建立起来，存量增值的空间是巨大的。\n\n> **【中国全国社保基金理事会2024年末资产3.32万亿元，当年投资收益率8.10%，】**成立24年年均7.39%，境外配置占比约13%。同期GPIF资产293.6兆日元（约14万亿人民币），约为中国社保基金的4.2倍，境外配置占比40%以上。数据来源：全国社保基金理事会年报、GPIF年报。\n\n但有一点必须说清楚。GPIF在日本公共年金财政中只是缓冲器，仅承担给付费约1成，9成仍由现役世代保险费与国库负担。这说明一个根本道理：积立金再充沛，也无法化解现收现付制的结构性课题。基金运营是存量增值的工具，不是替代代际转移的方案。中国既要做强基金运营，也不能幻想靠运营收益解决一切，根源还在人口结构和筹资方式。\n\n## 三、长护需求：介护保险的社会化创新\n\n中国正在49个城市试点的长期护理保险，是社保体系最年轻也最不确定的一块。试点城市各自为政：筹资来源五花八门，有的从医保结余划拨，有的靠财政补贴，有的靠个人缴费；覆盖人群、认定标准、服务清单都没有全国统一规范；照护服务供给严重不足，专业护理人员短缺，居家照护几乎全靠家庭（主要是女性）无偿承担。一个长护险到底长什么样，尚无定论。\n\n日本1997年立法、2000年实施的介护保险，给出了社会化长护的完整制度样本。这个制度的来龙去脉，对中国长护险的全国推开有近乎一对一的参考价值。\n\n介护保险创设的直接背景，是高龄化导致家庭内介护负担增大、认知症高龄者增加、医疗费膨胀。原有的老人福祉法加老人保健法二元体制已到极限：行政裁量供给、中高所得者负担重、医疗与福祉分离。1997年12月介护保险法成立，2000年4月施行。制度核心是导入利用者主体、自由选择服务与事业者的市场型社会保险机制。这一点至关重要：介护不再是政府恩赐的福利，而是公民权利的给付。利用者自主选择服务，政府负责筹资和监管，市场负责供给。\n\n制度的骨架由四部分构成。\n\n第一是被保险者二分类。65岁以上为第1号被保险者，保险费从年金扣除或个别征收；40至64岁为第2号被保险者，与医疗保险一并征收。这个设计把未来可能需要照护的人全部纳入缴费范围，而不是等到需要照护时才筹资。这是社会保险区别于福利救济的根本所在。\n\n第二是要介护认定。流程为申请、访问调查（计算机一次判定）、主治医意见书、介护认定审查会二次判定，最终认定要支援（1至2级）、要介护（1至5级）或非该当。七级分档，对应不同给付额度。这套认定机制确保资源聚焦于真正需要照护的人，避免谁闹谁得的非制度化分配。\n\n第三是给付三类。居宅服务（访问介护、通所介护即日间服务、短期入所等）、设施服务（特别养护老人之家、老人保健设施、介护医疗院）、地域密着型服务（小规模多功能型、认知症对应型等，2006年创设）。三类服务构成从居家到设施的连续谱，核心导向是居家优先。日本的数据显示，绝大多数要介护者希望在自己熟悉的家里度过最后时光，设施照护是兜底，不是首选。\n\n第四是介护支援专门员（护理经理）。这是制度的个案管理中枢，编制利用者的介护服务利用计划，协调各类服务，需通过国家资格考试。一个人的照护需求是复合的，需要访问护理、需要日间服务、需要短期入住、需要医疗衔接。没有一个专业的人把这些服务串起来，利用者就会在碎片化的供给中迷失。护理经理就是那个把碎片织成网络的人。\n\n> **【日本介护保险制度结构（厚生労働省）：第1号被保险者（65岁以上）/第2号被保险者】**（40-64岁）二分类筹资；要介护认定七级分档（要支援1-2、要介护1-5）；给付三类（居宅/设施/地域密着型）；介护支援专门员个案管理。2000年制度起步，2023年度受给者合计约691万人（介护服务566.7万+介护予防124.5万）。\n\n2015年改正是介护保险的重要转折，核心是确立地域包括照护系统（地域包罗ケアシステム）。理念是在住惯了的地域实现医疗、介护、预防、居住、生活支援的一体化支援，目标让需要支持者即便重度化也能在地域生活到最后。支柱包括：地域包括支援中心作为地域据点；在宅医疗与介护协作；多样服务供给体制整备；自立支援与重度化防止。\n\n2015年改正的背景是2025年问题：团块世代（1947至49年出生的第一次婴儿潮）全员将满75岁，医疗费、介护费同时膨胀。制度必须在地域构建可持续的支援体制，不能只靠机构扩建。财源也做了改革：自付比例按所得差异化（从1成到1至2成），特别养护老人之家新规入所限定要介护3以上，把稀缺的设施资源聚焦于真正重度的要介护者，轻度者回归居家和地域。\n\n介护保险的给付费推移，是制度膨胀速度的最直观证据。2001年度给付费4.38兆日元，2023年度11.51兆日元，22年膨胀2.6倍，且过历史最高。预计2040年度将达约25.8兆日元，相当于制度起步时的近6倍。介护保险费率（占收入比）从2000年的0.6%升至2023年的1.82%，23年上升约3倍。\n\n**表3：日本介护保险给付费与保险费率推移**\n\n| 年度 | 介护给付费（兆日元） | 倍数 | 介护保险费率（占收入比） | 倍数 |\n|---|:---:|:---:|:---:|:---:|\n| 2001（制度起步翌年） | 4.38 | 1.0 | 0.6% | 1.0 |\n| 2023（现状） | 11.51 | **2.6** | 1.82% | **约3.0** |\n| 2040（推计） | 约25.8 | **约5.9** | — | — |\n\n注：给付费为介护服务与介护予防服务合计。数据来源：国立社会保障·人口問題研究所、isvd.or.jp。\n\n给付费膨胀2.6倍的背后，是团块世代高龄化和照护需求社会化释放的叠加效应。日本的经验告诉中国：长护险一旦全国推开，给付费膨胀的速度将远超预期。不是因为制度设计不好，而是因为原本被家庭（主要是女性）无偿承担的照护劳动一旦社会化释放，需求是井喷式的。中国49城试点还在小步试探阶段，真正全国推开时，必须对膨胀速度有充分预估。\n\n## 四、代际公平：宏观经济滑动的代际平衡\n\n中国计划生育一代（1960至70年代出生）正进入退休高峰。这批人工作年代正是社保扩张期，待遇相对优厚、缴费相对偏低、个人账户空账由统筹挪用代为积累。他们的子女（1990至2000年代出生）数量更少，将承担更高的费率、领取更低的待遇。代际不公在中国不是未来的风险，而是正在固化的现实，只是还没有人把它算成账。\n\n日本的代际断层比中国来得更早、更尖锐，也提供了制度化的纠偏工具。\n\n日本厚生年金的生涯受益负担倍率，按出生年划出了一条触目惊心的下行曲线。1940年生者，倍率2.3，一生领取的年金是缴费的2.3倍，净受益；1950年生者1.5，仍受益超过；1960年生者1.0，负担约等于受益，到了均衡线；1980年生者0.8，转为负担超过；2000年代生者0.6，生涯只受给负担的六成。1940年生与2010年生之间，生涯损益差达约6000万日元。这不是个案的运气差异，是制度结构性的代际断层。\n\n代际断层的根源在现收现付制。人口红利期，缴费者众、受给者少，制度给得起。1940年生者赶上日本经济高速增长和社保扩张，受益远超负担。人口负债期，缴费者减、受给者增，制度给不起。2000年生者赶上少子老龄化，负担远超受益。同一个制度，同一套规则，因为人口结构翻转，对不同世代的人产生了截然不同的损益。这不是哪一代人的错，是制度的错。\n\n> **【日本厚生年金生涯受益/负担倍率（按出生年，isvd.or.jp）：1940年生2】**.3倍 / 1950年生1.5倍 / 1960年生1.0倍 / 1980年生0.8倍 / 2000年代生0.6倍。1940年生与2010年生之间生涯损益差约6000万日元。国民年金第1号被保险者约49%实质未纳付，非正规雇用者约半数未加入厚生年金，年轻人覆盖率与给付双重劣势。\n\n2004年改革是日本代际公平纠偏的分水岭。此前，日本年金的给付调整依赖每5年财政再计算，每隔五年由政治决断一次给付下调幅度。这种机制的问题在于政治阻力：每次下调都要付出政治代价，政客倾向于拖延，把调整推给后任。结果是调整总是太迟、太小，代际不公持续累积。\n\n2004年改革废除这套纺锤形改定机制，导入宏观经济滑动机制。核心是按一个公式自动调整给付费：\n\n$$G_{t+1} = G_t \\times \\frac{1 + \\rho}{1 + \\nu}$$\n\n其中 $\\rho$ 为名义工资指数变化率，$\\nu$ 为调整率，由人口变动率与物价变动率合成。实际操作中，调整率近似为 $(1 + \\text{人口变动率} + \\text{物价变动率}) / 4$。当人口减少或物价低迷时，$\\nu$ 为正，给付费自动下调。不需要政治决断，不需要开会争论，公式自动完成。\n\n这套机制的革命性在于：把每次改革政治决断给付下调，转为自动调整机制。代际公平不再依赖政客的勇气，而是内化为制度的数学。年轻世代的给付会持续下降，这是残酷的事实，但至少下降是可预期的、按规则进行的，而非政治博弈的随机结果。\n\n代价也不是没有。宏观经济滑动调整期将持续至2057年度，意味着从2004年改革起，约半个世纪内年轻世代实质给付长期下行。这是日本为迟到的改革付出的代价：如果1973年福利元年之后立即紧缩，代际断层不会这么大；等到2004年才导入自动调整，代际不公已固化，只能用半个世纪的给付下行来慢慢纠正。\n\n对中国启示有二。第一，代际公平应该作为社保改革的显性约束，不能让老人既得利益锁定、年轻人负担后送成为默认选项。中国计划生育一代的退休高峰，正在复制日本的代际断层：他们待遇相对优厚，他们的子女将承担更高费率、领取更低待遇。如果不及时导入代际平衡机制，断层只会越来越深。第二，自动调整机制是去政治化的可持续工具，把给付调整从政治决断转为公式运行，避免每次改革都要付出十倍代价。这一点在第六章和第十章会进一步展开。\n\n## 五、改革时机：迟滞重建的代价\n\n中国现在正处于改革窗口期。抚养比2.6比1虽在恶化但仍优于日本的2.0比1，财政补贴虽膨胀但仍可控，计划生育一代虽进入退休高峰但他们的子女尚在缴费。错过这个窗口，十年后更难。这是日本用三十年的代价换来的教训。\n\n日本改革太迟的故事，要从1973年福利元年说起。\n\n1973年（昭和48年），日本社会保障史上最大扩张节点。年金导入物价滑动制（消费者物价指数变动超5%时相应改定年金额），厚生年金目标替代率定为60%，标准年金约5万日元每月，国民年金夫妇5万日元；医疗方面老人医疗实质免费化（70岁以上自付大幅减轻）。这一年被称为福利元年，确立了高给付、扩张型的社保路线。\n\n扩张的背景是经济高速增长尾声。日本1960至70年代GDP年均增长7%到10%，所得上升，社会对老后保障期待高涨，政府有财力也有意愿大幅扩张福利。但问题在于：扩张是基于人口红利期的乐观假设，缴费者众、受给者少，给得起。一旦人口结构翻转，给付刚性已经形成，下调的政治阻力远大于当初扩张的阻力。\n\n> **【日本1973年福利元年（厚生労働省）：导入物价滑动制；厚生年金目标替代率60%（】**标准报酬月额8.64万円×27年加入→标准年金约5万円/月）；老人医疗实质免费化。1980年代一度实际达68%替代率。此后1986/1994/2000/2004四次改革持续压低给付费，但代际不公已固化。\n\n石油危机后经济转入低成长，1973年扩张路线难继。八十年代日本进入财政重建期，增税与给付费削减并行，年金保险费率持续上调，给付费增速放缓。但改革迟滞了。不是因为没人看到问题，而是因为政治阻力：每一次给付下调都要得罪既得利益的老年选民，政客倾向于把调整推给后任。结果是改革总是太迟。1986年导入基础年金二层结构，1994年财政再计算调整，2000年给付总额抑制两成、支给开始年龄从60岁推迟到65岁，2004年才导入宏观经济滑动机制。\n\n从1973年福利元年到2004年导入自动调整，整整三十一年。这三十一年里，代际不公从尚可纠正固化为只能慢慢消化。2004年改革导入的宏观经济滑动，调整期要持续到2057年，又一个五十多年。也就是说，日本为1973年的扩张和此后三十年的迟滞，付出的是半个多世纪的给付下行代价。\n\n教训不复杂：改革要趁早。人口红利尾声是改革最佳窗口，负担尚轻、结构尚优、调整余地尚大、代际不公尚未固化。这个窗口不会永远开着。一旦人口负债期全面到来，缴费者减、受给者增，代际断层已堆积，每一次改革都要付出十倍代价。\n\n中国正处在这个窗口。计划生育一代正进入退休高峰，但他们的子女（1990至2000年代出生）还在缴费，负担虽然加重，但尚未压垮。财政补贴1.93万亿虽膨胀，但占财政收入12%，仍可控。如果现在及时改革，导入代际平衡机制、强化积立要素、构建长护体系、多元筹资，调整的代价尚可承受。如果再等十年，计划生育一代的子女进入中年、抚养比逼近2比1、财政补贴突破3万亿时再被动调整，代价将是现在的十倍。\n\n日本错过的窗口，中国还能再错过一次吗？\n\n## 六、筹资困境：消费税的政治代价与多元财源\n\n中国社保筹资过度依赖保险费和财政补贴。名义五险费率加起来超40%，在全球排得上看前几位；财政补贴1.93万亿占养老收入近四分之一。增税议程艰难，企业叫苦、职工手紧、退休人员不满。但单纯增税不够，需要税费、运营收益、划转并行的多元筹资。\n\n日本的筹资困境给出了一个完整的政治经济学样本。\n\n先看日本社保在国家财政中的体量。2025年度国家一般会计预算中，社会保障关系费38.29兆日元，占一般岁出约56%。国家预算过半投于社保，财政运营自由度被极大压缩。这意味着什么？意味着日本政府每年花的钱，有一半以上是社保支出。修路、建桥、搞科研、强国防，都要在剩下不到一半里挤。社保已经不是财政的一个科目，而是财政本身。\n\n再看社保给付费的总量。2023年度社会保障给付费135.5兆日元，对GDP比22.76%，国民人均108.9万日元每年。2026年度预算144.1兆日元。其中年金56.4兆（41.6%）、医疗45.6兆（33.6%）、福祉及其他33.5兆（24.7%，含介护11.5兆）。给付费持续膨胀，财源结构却高度依赖保险费。以国民医疗费为例，社会保险费占50.2%、公费37.5%、患者自付12.3%。后期高龄者医疗制度中，公费负担约五成、现役世代支援金约四成、保险费仅约一成，对公费依赖度更高。\n\n> **【日本社保在国家财政中的体量（厚生労働省、isvd.or.jp）：2025年度一般】**会计预算社会保障关系费38.29兆日元，占一般岁出约56%。2023年度社保给付费135.5兆日元（GDP比22.76%），人均108.9万日元/年。社保财源结构（以国民医疗费为例）：保险费50.2% + 公费37.5% + 患者自付12.3%。\n\n社保财源过度依赖保险费，意味着负担集中于现役世代。这正是代际不公的财政根源。日本2012年的社会保障与税一体改革，就是针对这个困境的一次系统性尝试。\n\n改革的核心逻辑是：社保财源过度依赖保险费（负担集中于现役世代）加借金（向将来世代转嫁），需要以安定的消费税财源支撑社保，并向全世代型转换。2012年8月，《社会保障的安定财源确保等图税制拔本改革消费税法一部改正等法律》成立，民主、自民、公明三党罕见地达成共识。2014年4月消费税率从5%升至8%，2019年10月从8%升至10%（原定2015年10月，两次延期）。\n\n> **【日本消费税改革历程（財務省）：2012年8月社保·税一体改革法案成立（三党共识）】**；2014年4月消费税5%→8%；2019年10月8%→10%（原定2015年10月，两次延期）。增税分全额充当社会保障，并扩宽用途至子育て世代（待机児童解消、幼児教育·保育无償化等）。\n\n增税的政治代价极其高昂。2014年增税前后，日本经济两度陷入技术性衰退，民众实际收入下降，支持率暴跌。安倍晋三两次推迟原定2015年10月的第二次增税，直到2019年才勉强完成。每一次增税都伴随选举失利或内阁支持率下滑。这就是为什么日本政治家对增税讳莫如深。\n\n但日本增税的逻辑不只是多收钱。改革的口号是社会保障与税一体改革，核心是财源结构转型：从保险费中心转向保险费、消费税、运营收益并重的多元结构，从高龄者受益、现役世代负担的非对称转向全世代型。消费税增税部分不仅用于年金、医疗、介护，也投入幼儿教育保育无偿化、介护人员待遇改善、低收入高龄者介护保险费减免。2018年全世代型社会保障改革进一步明确：少子化对策与社保可持续性需联动，打破高龄者受益、现役世代负担的非对称。\n\n> **【日本全世代型社会保障改革（財務省）：核心理念是社保从高龄者中心转向全世代。消费税】**增税分不仅用于年金·医疗·介护，也投入幼児教育·保育无償化、介护职員処遇改善、所得低高龄者介护保険料轻减等。背景：少子化对策与社保可持续性需联动。\n\n对中国的启示是：单纯增税不够。日本的政治苦战表明，靠提高保险费率或开征新税来填缺口，政治代价极高、经济副作用大，且无法从根本上解决结构问题。中国的出路必须是多元筹资组合。\n\n一是划转国有资本。2017年国务院决定划转10%国有股权充实社保基金，截至2024年涉及1.68万亿元已到位。但划转的是股权不是现金，实际可用于社保支出的分红仅几百亿，对1.39万亿缺口杯水车薪。提升国有资本分红率、扩大划转范围，是这块的潜力所在。\n\n二是提升基金运营收益。对标GPIF的纪律化配置，把全国社保基金的境外配置从13%逐步提到30%以上，建立政策资产组合、容许偏差带、独立法人治理的框架。3.32万亿存量如果能达到GPIF级别的运营效能，增值空间是巨大的。\n\n三是做强二三支柱。企业年金覆盖仅9%，个人养老金开户7279万但缴存率不足21%，二三支柱的潜力远未释放。税优政策、默认参保、账户可携带性，是破局缴存冷的关键。\n\n四是费基做实。名义费率40%不低，但实际缴费基数远低于名义工资，逃漏缴、低报基数普遍。税务征收改革已经在推进，做实费基等于不涨费率也能增收。\n\n多元筹资的核心逻辑是：不把负担压在单一支柱上。保险费、税、运营收益、划转、二三支柱，五根柱子共同支撑，任何一根独木难支。日本的经验和教训，都指向这个方向。\n\n## 收束：日本镜鉴的核心启示\n\n日本经验的核心启示，可以收敛为一句话：社会保障制度的可持续性最终取决于人口结构。\n\n日本在人口红利期（1960至1990年代）大幅扩张福利，却在人口负债期（1995至今）陷入给付刚性、负担固化的困境。1973年福利元年的扩张，是基于人口永远年轻的乐观假设；2004年导入宏观经济滑动，是为迟到的改革付出半个世纪的代价；代际断层从1940年生的2.3倍滑到2000年代生的0.6倍，是结构性的代际转移在人口翻转下的必然结果。\n\n中国的优势在于窗口尚未关闭：抚养比2.6比1尚优于日本的2.0比1，改革窗口仍在。但窗口不会永远开着。关键是在超老龄化（预计2030年代中期65岁以上占比超20%）到来前，完成四大布局。\n\n一是积立要素强化。借鉴GPIF的纪律化配置，把全国社保基金的运营效能提上去，让存量增值跟上流量膨胀。不能全盘现收现付，必须增大缓冲层。\n\n二是代际公平制度化。借鉴日本2004年宏观经济滑动的代际平衡原理，把给付调整从政治决断转为公式运行。不能让代际断层在沉默中固化。\n\n三是长期照护体系构建。借鉴日本介护保险的社会化机制，把家庭（主要是女性）无偿承担的照护劳动社会化释放。不能等到家庭介护崩溃后再立法。\n\n四是多元财源结构。借鉴日本税费、运营收益、划转的组合逻辑，不把负担压在单一支柱上。不能靠增税议程单腿走路。\n\n这四大布局，每一项都有日本的镜鉴可参，也有中国的体制优势可用。国有资本划转是日本没有的制度资源，全国统筹的行政能力是日本难以复制的。以日为鉴，不是照搬日本，是借日本人的教训，省中国人的学费。\n\n日本人已经付过的学费，中国人不必再付一次。前提是趁窗口还在，及时动手。"}, {"part": "中编", "partName": "镜鉴", "num": "第六章", "title": "全球谱系", "md": "\n![](figs/06.png)\n*插图 · 06*\n\n\n## 一、全球没有标准答案，但有原理谱系\n\n一个中国干部研究本国社保，绕不开一个问题：别的国家怎么搞的？\n\n这个问题看似简单，实则陷阱重重。最常犯的毛病是把“别的国家怎么搞”写成制度巡礼：英国这样，德国那样，瑞典如此，日本这般，然后说一句各有千秋收尾。这种写法信息量大，洞见却少。读者看完记得一堆国名和数据，却没搞懂一个根本道理：每个国家的社保制度，都是那个国家在特定历史条件下回答三个问题的结果。问题只有三个：钱从哪里来（税收、保险费、还是强制储蓄），给谁、给多少（普遍定额、所得比例、还是个人账户），谁来管、谁担风险（国家兜底、还是个人自负）。三组选择的排列组合，构成了全球社保制度的模式光谱。\n\n全球没有标准答案。瑞典的NDC做得漂亮，但搬到中国水土不服，北欧的高税负和高度社会信任不是一朝一夕能长出来的。智利的AFP私有化一度被奉为新自由主义的典范，最后被智利人自己推翻了。新加坡的CPF效率惊人，但那种政府包办住房的社会契约，全世界独此一份。德国的俾斯麦模式稳运行了一百四十年，可它依赖的劳资共治传统和自治基金体系，不是每个国家都学得来。\n\n但全球有原理谱系。把各国制度的表象剥离，剩下的内核可以归纳为几种理想型。韦伯说理想型不是现实的描述，而是分析的坐标。用理想型来定位，才能看清中国统账结合在整个谱系中的位置。它不是一个孤立的发明，而是俾斯麦式统筹与智利式个人账户的嫁接物，嫁接之处恰恰是问题丛生之处。\n\n这一章不讲制度巡礼，只讲原理。六大模式摆在对比表上，私有化逆转的三个案例提炼共同逻辑，NDC的兴起讲清楚它为什么是无资金变化的改革，自动调整机制揭示一个当代社保改革的核心智慧：把政治决策外包给公式。\n\n## 二、六大模式的原理图谱\n\n学界通常以筹资方式与给付逻辑为坐标轴，把全球社保制度归纳为六种理想型。现实中没有哪个国家是纯粹的某一种，都是混合体。分类的意义不在贴标签，而在看清原理。\n\n### 1. 贝弗里奇模式：普遍主义与税收筹资\n\n1942年，英国经济学家威廉·贝弗里奇向战时内阁提交了《社会保险及相关服务》报告。这份报告奠定了战后英国福利国家的基石，也成为一种社保模式的命名来源。贝弗里奇的核心理念是：社会保障是公民权利，而非劳动的附属物。以普遍主义为原则，覆盖全民，与就业身份脱钩；以一般税收为主要筹资来源；待遇水平相对均一、偏低，定额给付，目标是防止贫困而非维持生活水平。\n\n英国国家养老金和国民保健服务（NHS）是这一模式的典型载体。NHS成立至今仍是全球最大的单一支付者公共医疗体系，税收筹资、公立为主。贝弗里奇模式的优点很清晰：覆盖广、行政简单、再分配功能强、对非正规就业者友好。缺点同样清晰：替代率偏低、对工作激励弱（无所得关联）、财政压力大。这种模式要求国家有强的税收征管能力和广泛的社会共识，人口结构相对年轻时运转良好，老龄化一来就吃力。英国近年的三重锁定争议，即国家养老金每年按通胀、工资增长、2.5%三者最高者上调，正是贝弗里奇模式在老龄化下可持续性受质疑的缩影。\n\n### 2. 俾斯麦模式：职业保险与所得比例\n\n比贝弗里奇早半个多世纪，1883年至1889年间，德意志帝国宰相俾斯麦建立了世界最早的社会保险法，疾病、工伤、养老三险。俾斯麦模式的原理是：社保是职业保险，待遇与缴费（工资）挂钩，所得比例给付，以雇主雇员共同缴纳的保险费为主，而非税收。权利与缴费义务绑定，多缴多得。待遇替代率较高，旨在维持生活水平而非仅防止贫困。\n\n德国是俾斯麦模式的母国。法定养老保险（GRV）现收现付制，2024年缴费率18.6%（雇主雇员各9.3%），法定退休年龄正从65向67岁过渡。法定医疗保险（GKV）由约240个法定疾病基金构成，多付款人但监管严格，缴费率约14.6%加附加费。俾斯麦模式的优点是激励相容性强，缴费与待遇对应清晰，财政独立于国家预算，工会与雇主共治。缺点是覆盖受就业身份限制，非正规就业和零工容易漏覆盖，再分配功能弱，费率上升会挤压工资。这种模式要求正规就业占比高、劳资协商机制成熟。法国、日本的社保制度都属此谱系，连中国城镇职工的统筹部分，骨子里也是俾斯麦式。\n\n> **【OECD《Pensions at a Glance 2025》（2025年11月】**27日发布）：德国未来净替代率53.3%（2024年22岁入职、平均收入、完整职业生涯），低于OECD平均63.2%。若永久暂停可持续性因子，替代率将高出约5个百分点。含自愿私人养老金（按4%完整缴费），总替代率升至68.0%。数据来源：OECD国别报告。\n\n### 3. 北欧模式：高税负、高福利与NDC\n\n北欧五国（瑞典、丹麦、挪威、芬兰、冰岛）在贝弗里奇普遍主义基础上发展出高税负、高福利变体。税收GDP比为全球最高梯队：丹麦45.2%、瑞典41.4%、挪威40.2%（2024年，Tax Foundation）。普遍的医疗、教育、育儿、长照、失业保障覆盖全民。劳动力市场推行灵活安全（flexicurity），以丹麦为典型，雇佣灵活加失业保障强加再培训。\n\n北欧模式的养老制度是普遍主义加NDC的结合。瑞典1998年改革创造了名义确定缴费制（NDC），把PAYG的DB改为PAYG的DC，即无资金变化的改革，后面专门讲。北欧模式优点突出：低贫困率、低不平等（基尼系数全球最低梯队）、社会流动性高。缺点也明显：税负极高，对经济周期敏感，移民和老龄化下财政承压。适用条件苛刻：高度信任社会、公共部门高效、人口规模适中、产业竞争力强。这些条件缺一不可，所以北欧模式虽好，模仿者寥寥。\n\n### 4. 新加坡中央公积金模式：强制储蓄与个人账户\n\n1955年，英属新加坡设立中央公积金（Central Provident Fund, CPF）。独立后强化为支柱性制度。原理是：强制储蓄加个人账户，政府集中管理，待遇完全取决于个人账户累积，互济性弱。\n\nCPF结构独特。三个账户：普通账户（OA）利率2.5%由政府担保，用途最广，可购组屋、批准投资、保险、教育；特别与退休账户（SA/RA）利率较高（4%至5%）用于养老，55岁后SA关闭转入RA；医疗储蓄账户（MediSave）用于住院、手术、门诊慢病、家属医疗。退休时CPF LIFE终身年金化支付。缴费率按年龄分段，55岁以下总费率20%雇主加20%雇员等于40%，是全球最高强制储蓄率之一。\n\n> **【新加坡CPF 2026年缴费率（55岁以下）：雇主20%+雇员20%=40%。O】**A利率2.5%/年（政府担保），SA/RA利率4-5%。OA可购HDB组屋，使CPF同时承担养老+住房保障功能。数据来源：新加坡中央公积金局cpf.gov.sg官方。\n\n新加坡模式的优点是财务可持续性强，完全积累、无代际转移；激励强；与住房、医疗捆绑形成综合保障；行政成本低。缺点致命：互济性几乎为零。低收入者、短工龄者、长寿者保障不足；无风险分散；投资收益率受政府担保利率上限约束。这种模式要求经济持续增长、政府治理能力强、人口年轻、住房保障与公积金绑定。条件极特殊，所以全世界只有新加坡一个样本。\n\n### 5. 智利私有化模式：完全积累与私人管理（1980至2022）\n\n1980年，皮诺切特军政府颁布DL 3500法令，将公共PAYG养老金改为完全积累的个人账户DC制，由私人养老基金管理公司（AFP）运营。这是世界上最激进的私有化养老金改革。原理是：强制储蓄加个人账户加私人管理加完全积累。缴费10%（外加残疾和丧偶保险约1.5%）进入个人账户，工人在几家AFP间选择，AFP收取管理费，退休时按寿险年金或分期领取。\n\n智利AFP一度被新自由主义阵营奉为典范。理论优点确实存在：财务可持续（无隐性养老金债务）、资本积累、个人选择。AFP持股成为智利资本市场主体，推动了国内资本市场发展。但实践效果与理论承诺差距巨大。覆盖率低，大量自雇者、零工未参与；替代率低，21世纪头十年仅约35%至45%；管理费高、AFP寡头垄断；市场风险全部由个人承担；性别差距大（女性工龄短、工资低）。2020至2021年新冠期间，国会三次强行通过10%提取法案（Ley 21.248、21.295、21.330），允许参保者从个人账户提取资金。AFP协会估计第二次提取后，1100万成员中近三分之一可能耗尽储蓄，团结养老金仅约240美元每月。\n\n> **【智利AFP三次10%提取：第一次Ley 21.248（2020年7月）、第二次L】**ey 21.295（2020年12月）、第三次Ley 21.330（2021年4月）。AFP协会估计第二次提取后近1/3的1100万成员可能耗尽储蓄。团结养老金仅约240美元/月。数据来源：Americas Quarterly、IESET。\n\n2022年11月7日，总统博里奇提交法案结束AFP系统，国家作为私人储蓄的共同管理者，建立公私混合新系统。从1980到2022，全球最激进的私有化实验画上句号。智利AFP的故事不是私有化的成功，而是私有化的失败，后面私有化逆转一节详述。\n\n### 6. 中国混合模式：统账结合、碎片化与转轨中\n\n1991年国务院33号文、1997年国务院26号文确立了社会统筹加个人账户的统账结合模式。原理是：试图嫁接俾斯麦式所得比例（统筹）加智利、新加坡式个人账户（积累），形成部分积累的混合PAYG。城镇职工缴费：统筹（雇主16%）加个人账户（雇员8%）。机关事业单位2014年并轨但仍存待遇差。城乡居民养老、医疗分设。个人账户长期空账，因转轨成本未单独筹资，统筹账户挪用个人账户资金支付当期养老金。省级统筹2020年底实现，2022年启动全国统筹调剂。\n\n中国混合模式的优点是兼顾再分配与激励，覆盖快速扩张，养老参保10.7亿人。缺点是碎片化（城职、城乡、机关三轨，待遇差距大）、空账与隐性债务（转轨成本未化解，名义账户化趋势）、费率偏高（养老24%）、地区失衡严重。它的定位很特殊：处于俾斯麦加新加坡的混合，但个人账户因空账实际已准NDC化。这点对后面的启示至关重要。\n\n### 模式对比总表\n\n把六大模式摆在一张表上，用筹资、给付、再分配、风险承担四个维度来对比，谱系就清楚了。\n\n**表1：六大社保模式四维对比**\n\n| 维度 | 贝弗里奇 | 俾斯麦 | 北欧 | 新加坡CPF | 智利AFP | 中国混合 |\n|---|---|---|---|---|---|---|\n| 筹资 | 一般税收 | 保险费 | 税收为主 | 强制储蓄 | 强制储蓄 | 费+税 |\n| 给付逻辑 | 普遍定额 | 所得比例 | 普遍+所得比例 | 个人账户 | 个人账户 | 统筹+账户 |\n| 再分配 | 强 | 中 | 强 | 弱 | 弱 | 中（名义） |\n| 风险承担 | 国家 | 国家 | 国家 | 个人 | 个人 | 混合 |\n| 互济 | 强 | 中 | 强 | 弱 | 弱 | 中（名义） |\n| 典型国 | 英、加 | 德、法、日 | 瑞典、丹麦 | 新加坡 | 智利（1980-2022） | 中国 |\n\n看这张表，有一个规律浮现。从贝弗里奇到俾斯麦到北欧，筹资从税收到保险费再到税收为主，给付从普遍定额到所得比例再到混合，再分配和互济都强，风险都由国家承担。这是公共取向。从新加坡CPF到智利AFP，筹资都是强制储蓄，给付都是个人账户，再分配和互济都弱，风险都由个人承担。这是私人取向。中国混合卡在中间：筹资是费加税，给付是统筹加账户，再分配名义上是中等，风险承担是混合。这个卡在中间的位置，不是设计失误，而是转轨的必经阶段：旧制度（单位保障）要破，新制度（积累）要立，中间这一步就是混合。问题是混合了三十年还没走完，个人账户始终空账，统筹始终碎片化。走完这一步，需要的是原理的澄清和路径的选择。全球谱系给中国的，正是这种澄清和选择。\n\n## 三、私有化逆转：三个案例的共同逻辑\n\n20世纪八九十年代，私有化是社保改革的主流话语。世界银行1994年报告《Averting the Old Age Crisis》明确提出三支柱模型，把私人管理的强制储蓄作为第二支柱，许多国家据此推行私有化改革。但进入21世纪，一个反向潮流出现了：多国从私人管理回归公共管理。三个案例最有代表性：阿根廷2008、哈萨克斯坦2013、智利2022。\n\n### 阿根廷2008：完全消除私人DC层\n\n阿根廷1994年引入个人账户DC（capitalización）作为SIJP两层制的一部分，是世界银行三支柱模型的践行者。2001年经济危机重创阿根廷，但此后财政状况有所改善。2008年金融危机后，政府宣布国有化养老基金。Law 26.425完全消除私人DC层，回归纯PAYG-DB，由国家社保局ANSES管理。\n\n逆转的效果是覆盖率和充足度的改善。覆盖率提升至90%以上，待遇充足度提升，累积率提高。财政影响也很显著：转移25.5亿美元，政府债务占比从53%降至38%。但阿根廷的逆转并非完美，财政纪律与治理风险仍然存在，国有化后的资金管理透明度受质疑。覆盖和充足度改善是真的，治理风险也是真的。\n\n### 哈萨克斯坦2013：统一累积基金的建立\n\n哈萨克斯坦1998年自由化私有化改革，受世界银行影响，建立了分散的私人养老基金体系。2013年6月21日，Law No. 105-V ZRK《关于哈萨克斯坦共和国养老金》逆转私有化。同年8月22日，基于国家累积养老基金成立统一累积养老基金（UAPF/ENPF），政府（财政部国家财产和私有化委员会）为创始人和股东。\n\n新模型分两层：支柱0是基本社会养老金（BPP，普遍、非缴费），支柱1是完全积累个人账户DC（由国家统一基金管理）。女性退休年龄从58提到63。默认由哈萨克斯坦国家银行管理资产，缴费者可选投资组合管理人（IPM）。2017年再次改革调整。哈萨克斯坦的逆转没有回到PAYG-DB，而是把分散的私人管理转为集中的国有管理，保留DC的精算逻辑，但去掉私人管理的成本和寡头风险。\n\n### 智利2022：结束AFP的公私混合新系统\n\n智利AFP的故事最长也最戏剧。1980年完全私有化，一度被奉为新自由主义的样板。但危机逐步累积：覆盖率低、替代率低、管理费高、AFP寡头垄断、性别差距大。2019年10月estallido social（社会大爆发）抗议，120万人游行。2020年10月宪法公投通过。2020至2021年三次10%提取重创AFP，国会违背政府和央行意愿强行通过，个人账户在危机面前暴露出致命脆弱性。\n\n2022年9月4日，新宪法草案在第三次公投中被否决，但这不意味着改革方向逆转。2022年11月7日，总统博里奇提交法案结束AFP系统，国家作为私人储蓄的共同管理者，建立公私混合新系统。这是博里奇的竞选承诺与旗舰改革。Americas Quarterly评价：改革方向正确但财政成本高，智利面临严峻经济前景，仍需配套措施。\n\n### 逆转的共同逻辑\n\n三个案例国别不同、时间不同、逆转程度不同，但共同逻辑清晰。\n\n**表2：私有化逆转三案例对比**\n\n| 维度 | 阿根廷（2008） | 哈萨克斯坦（2013） | 智利（2022） |\n|---|---|---|---|\n| 立法 | Law 26.425 | Law 105-V ZRK | Boric法案 |\n| 逆转程度 | 完全消除私人DC，回归PAYG-DB | 分散私人→集中国有管理（保留DC） | 结束AFP，公私混合新系统 |\n| 触发 | 2008金融危机 | 私人管理成本高、覆盖窄 | 三次10%提取+社会抗议 |\n| 覆盖率变化 | 升至90%+ | 统一管理提升覆盖 | 改革中 |\n| 民意基础 | 大规模民意支持 | 政府主导 | 120万人游行+宪法公投 |\n\n第一条逻辑：私有化承诺的高替代率未兑现。智利AFP运行四十多年，替代率仅35%至45%，远低于DB制下普遍50%以上的水平。阿根廷的私人DC层在2001年危机中暴露同样问题。承诺很丰满，现实很骨感。\n\n第二条逻辑：私人管理成本高、覆盖窄。AFP寡头垄断，管理费侵蚀账户余额。哈萨克斯坦的私人基金分散经营，成本高企，覆盖面无法扩张。私人管理不是效率的同义词，垄断的私人管理比公共管理更贵。\n\n第三条逻辑：危机暴露市场风险全部由个人承担的不公平。2008年金融危机、2020年疫情，资本市场剧烈波动，个人账户余额缩水。智利三次10%提取是参保者自救的本能反应，但自救的结果是耗尽储蓄，团结养老金仅240美元每月。当市场风险全部由个人承担时，个人在危机面前毫无缓冲。\n\n第四条逻辑：政治上再国有化获得民意支持。阿根廷、智利均获大规模民意。这说明私有化在政治上不得人心，不是因为国民不懂市场，而是因为国民用切身感受发现私有化的承诺不靠谱。\n\n### 对中国的警示\n\n这三个案例对中国有直接的警示意义。中国有完全DC加私人管理的冲动吗？有。第二支柱企业年金、第三支柱个人养老金，都带着DC和私人管理的色彩。发展二三支柱方向没错，多支柱是对的，但必须警惕完全DC加私人管理的陷阱。第二支柱应保DB与DC混合、加强治理（参考美国401(k)的ERISA监管），第三支柱应强化受托责任和费率管控。智利AFP的教训是：把第一支柱也私有化，是不可承受之重；把二三支柱私有化但缺乏治理，是另一重风险。前者中国不会犯（统账结合已经把第一支柱留在公共管理），后者中国正在面对（个人养老金试点中的账户管理和费率问题）。\n\n## 四、NDC的兴起：无资金变化的改革\n\n私有化逆转是一面，另一面是NDC的兴起。如果说私有化是换资金，即从PAYG换成完全积累，NDC就是换公式，即保留PAYG的现金流，只改给付的计算逻辑。NDC全称Notional Defined Contribution，名义确定缴费制。它是20世纪90年代以来全球社保结构性改革最成功的路径。\n\n### 瑞典1998：五党共识、长过渡期与刹车机制\n\n瑞典NDC改革是全球公认的范本。旧ATP系统（1960年生效，DB型）在1990年代因人口与经济双重压力不可持续，可能危及瑞典经济。1994年6月议会通过改革框架，1998年6月8日通过完整立法，将公共养老金从DB改为NDC加第二支柱基金制个人账户。改革由五个议会政党共同设计，跨党派共识。这是改革成功的关键政治条件。\n\nNDC的原理可以拆成三个关键词。Notional（名义）：PAYG基础，无真实资金积累，名义账户记录缴费。Defined Contribution（确定缴费）：待遇由个人缴费累积加寿命指数化决定，待遇不确定。Insurance：终身年金给付。总缴费率18.5%，其中16%进NDC名义账户、2.5%进第二支柱真实基金个人账户。\n\nNDC的给付公式：\n\n$$P = \\frac{NAB}{D(a, e)}$$\n\n其中 $P$ 为年度养老金，$NAB$ 为退休时名义账户余额，$D(a,e)$ 为年金因子，由退休年龄 $a$ 和退休时点预期寿命 $e$ 决定。名义账户余额随名义回报率累积：\n\n$$NAB_t = NAB_{t-1}(1 + g_t) + c \\cdot w_t$$\n\n$g_t$ 为名义回报率（通常取工资增长或人均工资增长），$c$ 为缴费率，$w_t$ 为个人当年工资。年金因子 $D$ 则基于退休时点的人口生命表：\n\n$$D(a, e) = \\sum_{s=0}^{\\omega} \\frac{1}{(1+r)^s} \\cdot \\frac{l_{a+s}}{l_a}$$\n\n$r$ 为贴现率，$l_{a+s}/l_a$ 为存活概率，$\\omega$ 为最大年龄。\n\n这套公式有两个精妙之处。第一，待遇与缴费一一对应，多缴多得，晚退多得（年金因子随退休年龄提高而减小），激励相容性强。第二，长寿风险通过寿命指数化自动分担，退休时点预期寿命越长，年金因子越大，同样余额对应更低年度给付，系统自动调整，不需要每代人重新谈判。\n\nAP缓冲基金。四只国民养老基金（AP1至AP4）持有约1.8万亿瑞典克朗资产，作为系统负债侧的缓冲。75年精算预测确认系统长期财务稳定。瑞典养老金管理局估计：AP基金市值需从2025年1月1日估值下跌约89%，系统才会陷入赤字并触发刹车。系统极具韧性。\n\n自动平衡机制即刹车（bromsen, the brake）。NDC系统内置自动平衡机制。当系统资产（缴费流现值加AP基金）与负债（已计养老金权利现值）比率低于1时，自动触发指数化削减。在2010、2011、2014年实际触发了削减。2026年瑞典正在讨论引入gas rule（pensionsgasen），刹车处理赤字，gas处理盈余，使机制更对称。\n\n> **【瑞典NDC：总缴费率18.5%（16% NDC + 2.5% FDC）。AP基金】**约1.8万亿瑞典克朗，需跌89%才触发刹车。2010、2011、2014年刹车实际触发。2026年拟引入对称的gas rule分配盈余。数据来源：BBVA、European Pensions、IESET、government.se。\n\n瑞典NDC改革的经验可以概括为三句话。第一句：无资金变化的改革。把PAYG的DB改为PAYG的DC，财务性质不变，还是当期缴费付当期养老金，没有真实资金积累，但激励与代际分配重塑。这解决了完全积累私有化转轨成本过高的难题。第二句：跨党派共识加长过渡期。五党共设，1998立法到2003全面运行，五年过渡期让旧制度领取者不受冲击。第三句：自动调整机制兜底。刹车机制把财务平衡自动化，不需要每次失衡都开政治会议决定削减。\n\nNDC也有批评。研究显示，从PAYG-DB转NDC在中国情境下有利于富人、迫使穷人工作更久。因为低收入者预期寿命短，寿命指数化对他们不利，而激励相容意味着少缴少得更严格。这提醒我们：NDC的精算公平是双刃剑，需要配保障养老金（瑞典有garanti pension）托底，否则会扩大老年贫困。\n\n### 拉脱维亚、意大利、波兰：跟进与反复\n\n瑞典之后，多国跟进NDC。拉脱维亚1996年起与瑞典同期推进NDC，是小国先行者。意大利1995年Dini改革引入NDC，渐进过渡，旧制度权利保留，新缴费按NDC记账，过渡期长达数十年。波兰1999年引入NDC，但后因政治反复出现倒退，取消部分NDC，回到更接近DB的安排。波兰的倒退说明：NDC不是装上就一劳永逸，政治承诺的稳定性比制度设计更重要。\n\n### 德国可持续性因子：DB制内嵌自动调整的典范\n\n德国没有走NDC路径，但走了另一条同样精彩的路，即在DB-PAYG框架内嵌入自动调整。2004年Riester改革，在养老金调整公式中加入可持续性因子（Nachhaltigkeitsfaktor）。该因子将年度待遇变化与系统依赖比（缴费者与领取者之比）挂钩，当人口老龄化、依赖比上升时，自动减缓待遇增长。\n\n德国养老金调整公式的简化形式：\n\n$$P_t = P_{t-1} \\cdot \\frac{w_t}{w_{t-1}} \\cdot \\left[\\alpha + (1-\\alpha)\\frac{Q_t}{Q_{t-1}}\\right]$$\n\n其中 $P_t$ 为当年养老金，$w_t$ 为当年平均工资，$Q_t$ 为系统依赖比（缴费者/领取者），$\\alpha$ 为权重因子（约0.25）。依赖比上升（缴费者相对减少）时，方括号内数值下降，待遇增长被自动抑制。$\\alpha$ 越小，依赖比的权重越大，自动调整力度越强。\n\n可持续性因子的效果显著。德国未来净替代率53.3%，低于OECD平均63.2%。这个低于不是失败，是成功：低替代率是自动调整的结果，意味着制度在老龄化下仍能维持财务平衡。若永久暂停可持续性因子，替代率将高出约5个百分点。也就是说，没有自动调整，德国早就不可持续了。2004年改革后仅两年，因人口与劳动力市场假设被证明不现实，系统再度需要改革。这说明自动调整不是一劳永逸，参数需要定期校准。2024年Rentenpaket II保证养老金水平48%至2040、设立代际资本基金（Generationenkapital）由德国联邦银行管理，是德国在自动调整基础上的进一步加固。\n\n**表3：NDC与自动调整国家对比**\n\n| 国家 | 改革年份 | 制度类型 | 自动调整机制 | 缓冲基金 | 政治条件 |\n|---|---|---|---|---|---|\n| 瑞典 | 1998立法/2003运行 | NDC + FDC | 刹车（资产/负债比<1） | AP1-4基金 | 五党共识 |\n| 拉脱维亚 | 1996 | NDC | 寿命指数化 | — | 小国先行 |\n| 意大利 | 1995 | NDC（渐进过渡） | 寿命指数化 | — | 技术官僚主导 |\n| 波兰 | 1999（后倒退） | NDC→部分回退 | 寿命指数化 | — | 政治反复 |\n| 德国 | 2004 | DB-PAYG（嵌入调整） | 可持续性因子 | 代际资本基金（2024） | 共识渐进 |\n\n瑞典走的是NDC，即换公式；德国走的是DB内嵌调整，即不换制度、换公式。两条路径殊途同归：都把人口结构变化内生化到待遇调整中，都把政治决策外包给公式，都降低了改革的政治成本。NDC更彻底（给付逻辑从DB变DC），德国因子更温和（制度形态不变，只调参数）。中国该走哪条？看政治可行性。NDC更彻底但转型成本高，德国因子更温和但调整力度有限。一个折中的选择：在统账结合框架内，先把个人账户的空账正式NDC化（承认它是PAYG而非积累），同时在统筹账户的待遇调整公式中引入可持续性因子。两步走，先承认现实，再嵌入调整。\n\n## 五、自动调整机制：把政治决策外包给公式\n\n自动调整机制是21世纪社保改革的核心创新。它的意义不亚于任何一次结构性改革，因为它解决了一个根本难题：社保改革的政治成本。\n\n社保改革为什么难？因为福利刚性。待遇一旦给了，就很难收回来。退休年龄一旦定了，就很难延后。费率一旦涨了，就很难降下来。每一次参数调整都需要政治决策，而政治决策在民主国家意味着选票压力，在其他国家意味着社会稳定压力。结果就是：明明知道制度不可持续，却改不动，直到危机爆发才被迫改革，而危机中改革的代价更大。\n\n自动调整机制把政治决策外包给公式。三种典型形态。\n\n第一，瑞典刹车，财务平衡的自动触发。系统资产（缴费流现值加AP基金）与负债（已计养老金权利现值）比率低于1时，自动触发指数化削减。不需要议会开会，不需要政府决定，公式自动运行。2010、2011、2014年三次触发，削减后系统恢复平衡。刹车处理赤字，2026年拟引入的gas rule处理盈余，对称化后机制更完整。AP基金需跌89%才触发刹车，说明系统极具韧性，不是动辄削减，是极端失衡才削减。\n\n第二，德国可持续性因子，人口结构的内生化。系统依赖比（缴费者与领取者之比）进入养老金调整公式。老龄化加剧时，依赖比上升，待遇增长自动减缓。不需要每次人口数据更新都开政治会议决定是否调整，公式自动消化。德国因子使替代率低于OECD平均，但换来了财务可持续。这是一种温水煮青蛙的智慧：待遇不是一刀切下降，而是增长速度放缓，公众感受不到剧烈冲击，但长期平衡得以维持。\n\n第三，退休年龄与预期寿命挂钩，丹麦和意大利的路径。退休年龄不再由法律规定固定值，而是与预期寿命指数化挂钩，预期寿命延长，退休年龄自动后延。丹麦、意大利已实行这种机制。中国2025年起渐进延迟退休，但缺乏与预期寿命挂钩的自动调整，延迟到63岁就停了，没有后续的自动延后机制。预期寿命继续延长，退休年龄却不动，等于重蹈日本1973福利元年改革太迟的覆辙。\n\n> **【自动调整机制的意义（来源：FIAP Pension Notes N°70, 20】**23）：AAM寻求在“最少政治争议、基于技术论证”的过程中改善长期财务平衡或充足性。把政治决策外包给公式，降低改革的政治成本。是参数改革与结构改革之间的“中间道路”。\n\n自动调整机制的本质，是把政治决策技术化、去政治化。这不是逃避政治责任，而是把政治决策从每次都要开会争论，变成一次性设定规则、之后自动运行。一次设定规则需要政治共识，瑞典五党共设、德国跨届渐进，但设定之后，日常调整不再需要反复动员政治资本。这降低了改革的社会成本，也降低了改革的反复风险。波兰的倒退就是反例：没有稳固的跨党派共识，NDC也会被推翻。\n\n对中国的启示直白：与其每次人口数据更新后争论要不要延迟退休、要不要降低替代率，不如一次性设定规则，退休年龄与预期寿命挂钩、替代率调整与系统依赖比挂钩，让公式自动运行。中国的体制下，跨党派共识的含义不同（没有议会多党博弈），但跨部门共识加跨届承诺同样重要。设定规则一次，自动运行多年，比每届政府都重新争论效率高得多，社会成本也低得多。\n\n## 六、对中国统账结合的启示\n\n全球谱系摆在眼前，对中国的启示可以收敛为五条。\n\n第一，个人账户空账NDC化的必然性。中国个人账户因转轨成本未化解而长期空账，统筹挪用个人账户资金支付当期养老金。空账的实质是：个人账户已经不是积累制，而是PAYG。账户里记的数字不是真金白银的余额，而是缴费权利的记账。这不就是NDC吗？瑞典NDC的名义账户（PAYG基础、无真实积累、记录缴费）和中国空账的个人账户，在财务性质上是一样的。区别在于：瑞典是主动设计的NDC，有精算公平的给付公式、有寿命指数化、有自动调整；中国是被动形成的空账，没有精算设计、没有寿命指数化、没有自动调整。\n\n启示很清楚：空账不是问题，是制度特征。不如正式承认并借鉴瑞典NDC的精算设计，把空账从被动形成的尴尬转为主动设计的制度。这叫顺水推舟。第四章详述了空账的形成逻辑，第九章会给出NDC化的具体路径，这里只点明原理：承认现实比粉饰现实更有改革空间。\n\n第二，引入系统依赖比自动调整因子。借鉴德国可持续性因子，在养老金调整公式中嵌入缴费者与领取者之比的因子。当制度内抚养比恶化（现在是2.6比1，到2035年约2比1，到2050年可能逼近1.5比1），待遇增长自动减缓。不需要每次抚养比恶化都开全国两会争论是否调整，公式自动消化。这把人口结构变化内生化到待遇调整中，是参数改革的极致，也是政治成本最低的改革路径。\n\n第三，退休年龄与预期寿命挂钩。中国2025年起渐进延迟退休，男职工60岁延到63岁、女职工50岁和55岁延到55岁和58岁，十五年到位。但到位之后就停了，没有后续的自动延后机制。预期寿命还在延长，退休年龄却不动，等于每过若干年就要重新启动一次延迟退休的议程，重新承受一次社会成本。借鉴丹麦和意大利模式，让退休年龄与预期寿命自动挂钩，一次设定规则，多年自动运行。这比每届政府重新争论效率高，社会成本低。\n\n第四，警惕完全DC加私人管理陷阱。私有化逆转三案例的共同逻辑，私有化承诺的高替代率未兑现、私人管理成本高、覆盖窄、危机暴露市场风险，对中国二三支柱的发展是直接警示。第二支柱企业年金覆盖仅9%，第三支柱个人养老金2022年试点开户7279万但缴存率不足21%。发展二三支柱方向没错，但必须避免完全DC加私人管理的陷阱。第二支柱应保DB与DC混合、加强治理（参考美国401(k)的ERISA监管）；第三支柱应强化受托责任和费率管控，防止AFP式寡头垄断。智利AFP的教训不是不要个人账户，而是不要私人垄断管理加无治理的个人账户。\n\n第五，改革政治可行性：跨党派共识与宪法强推的对比。瑞典五党共识设计了NDC，改革运行二十多年稳健；法国2023年退休改革动用宪法第49.3条强行通过，引发全国超百万人示威、持续数周大规模抗议，付出巨大政治成本。技术上必要的改革（延长工作年限）却因缺乏跨党派共识而代价高昂。这两国对比说明一个道理：改革的政治可行性往往比技术方案更重要。\n\n中国的体制下，没有议会多党博弈，但有跨部门共识加跨届承诺的需要。社保改革是跨届的事，1997年26号文到2010年社会保险法到2014年并轨到2025年延迟退休，每一步都是跨届接力。如果每一届政府都只顾任内的稳定、不愿启动有社会成本的改革，改革就会永远滞后于人口结构变化。自动调整机制的意义正在于此：一次设定规则（跨部门共识加跨届承诺），之后自动运行多年，把每届政府都重新争论的压力降下来。这是温水煮青蛙的政治智慧，不是不改革，是用公式替代会议、用规则替代博弈，让改革在最低社会成本下持续推进。\n\n全球没有标准答案。瑞典的NDC、德国的因子、丹麦的寿命挂钩，都是技术方案；但瑞典的五党共识、法国的49.3条之争、智利的民意反转，都是政治条件。技术方案可以借鉴，政治条件必须自创。中国的大保障改革，需要的不是照搬某个国家的制度，而是把全球原理谱系中的智慧，NDC的精算公平、自动调整的去政治化、多支柱的风险分散，消化进中国自己的制度土壤。统账结合是起点，不是终点；空账是问题，也是机会；碎片化是病灶，也是改革的抓手。第七章回到中国，把这六重困境的系统根源梳理清楚。"}, {"part": "中编", "partName": "镜鉴", "num": "第七章", "title": "碎片化与统筹", "md": "\n![](figs/07.png)\n*插图 · 07*\n\n\n## 一、三轨并行：身份壁垒的制度根源\n\n中国社会保障最突出的体制特征，是三轨并行。\n\n城镇职工基本养老保险覆盖5.35亿人，即在企业就业的正式职工。城乡居民基本养老保险覆盖5.38亿人，即不在企业就业的农村居民和城镇非就业居民。机关事业单位工作人员养老保险覆盖约4000万人，即公务员和事业单位职工。\n\n三轨之间，缴费水平不同、待遇标准不同、基金池不同。一个人属于哪一轨，不是由他的劳动贡献或缴费意愿决定的，而是由他的身份（户籍、就业形式、编制）决定的。\n\n2024年的月均养老金对比：机关事业6372元，企业职工3253元，城乡居民246元。最高与最低相差26倍。\n\n> **【三轨鸿沟的根源不是谁多缴了钱，而是制度设计时按身份分类建立。1951年劳动保险条】**例只覆盖企业职工；机关事业单位另有退休制（财政兜底、不缴费、高替代率）；农村居民长期在社保体系之外。2014年机关事业并轨改革名义上统一了制度，但过渡期设置和职业年金使实际待遇差距延续。并轨并了制度形式，没并待遇实质。\n\n三轨不是一天建成的，是七十多年制度演化的层积。\n\n机关事业单位退休制历史最久。1951年劳动保险条例只覆盖企业职工，机关事业单位的退休保障另由财政兜底：不缴费、替代率八九成、由各单位自行发放。这套制度一直运行到2014年，六十三年没动过根本。2014年并轨改革名义上把机关事业单位拉进统账结合框架，但设了十年过渡期（2014至2024年），过渡期内新老办法对比、保低限高，实际待遇不降。职业年金作为强制补充，单位缴8%、个人缴4%，合计12%，又把待遇差补了回来。2024年过渡期结束，但机关事业退休6372元、企业退休3253元的双倍差距纹丝未动。并了形式，没并实质。\n\n城镇职工养老保险是主渠道。1991年国务院33号文提出社会化方向，1997年26号文确立统账结合，2010年社会保险法确认覆盖全民。但覆盖和保障是两回事：企业职工名义费率从最初的28%（单位20%加个人8%）经2019年降到24%，替代率却从1999年的69%滑到现在的45%左右。二十年间费率降了4个百分点，替代率降了24个百分点。降费让企业松了口气，但代价是退休人员的购买力缩水。\n\n城乡居民养老保险历史最短。2009年国务院开展新农保试点，2011年城镇居民养老保险试点，2014年两者合并为城乡居民基本养老保险，建立至今不到十五年。基础养老金全国最低标准从最初的55元涨到一百多元，加上地方补贴和个人账户，全国月均246元。这个数字背后的逻辑是：居民养老保险从一开始就不是保险。个人缴费低、财政补贴占大头，2024年城乡居民养老保险的财政补贴占月均养老金的81%。说白了，居民养老保险是财政发钱、挂了个保险的名。\n\n三轨的历史层积决定了改革的难度：机关事业动不了（政治阻力大），企业职工降不动（费率已经不低），城乡居民提不上（财政兜不起）。\n\n三轨并行意味着社会保障的再分配功能被身份壁垒切割了。本应缩小差距的制度，反而因为三轨之间的待遇差，尤其是机关事业对企业职工的双倍差、对城乡居民的26倍差，固化了甚至放大了不平等。一个体制内退休的人每月拿6372元，一个农村老人每月拿246元。他们生活在同一个国家，适用同一套宪法，但社会保障给他们的承诺天差地别。\n\n碎片化不止在三轨之间。同一轨内部，还有统筹层级的碎片化。\n\n## 二、统筹碎片化：从县级到全国\n\n中国养老保险的统筹层级经历了从县级到省级再到全国的漫长爬升。\n\n1997年统账结合改革时，统筹层级基本在县级，全国有2000多个县级统筹单位。每个县各自管自己的养老保险基金，各自收支、各自平衡。结果是富裕县结余多、贫困县缺口大，但基金不能跨县调剂。\n\n2000年代推行市级统筹，2010年代推进省级统筹。到2020年底，全国31个省份宣布实现省级统筹，名义上全省统一基金池。但宣布实现和真正实现有差距：不少省份的省级统筹实际上是省级调剂，各市县仍各自征缴，省级只是在年底调剂余缺，基金的真正统筹层级仍在市县。\n\n> **【中国养老保险统筹层级演进：1997年县级统筹（2000+个单位）→ 2000年代】**市级统筹 → 2010年代省级统筹（2020年宣布全覆盖）→ 2018年中央调剂金制度 → 2022年全国统筹调剂启动。每一步都是半步，宣布统筹和真正统筹之间有制度距离。\n\n2018年中央调剂金制度启动，各省按缴费基数的一定比例上缴资金，由中央分配给收支缺口省份。这是全国统筹的第一步，但调剂比例从最初的3%逐步提高到5%左右，远未实现全国统一基金池。\n\n2022年，全国统筹正式启动。上缴比例提高，调剂力度加大，东北三省每年获得超2000亿元调剂补助。但全国统筹目前仍是调剂模式，各省征缴、上缴一部分、接受分配，不是全国统一征缴、统一发放的真正统筹。\n\n碎片化的后果是多方面的。一是资金配置效率低，广东的结余不能用来发黑龙江的养老金，全国的资金池被切成了31块。二是可携带性差，劳动者跨省流动时养老保险关系转移接续困难，便携性损失和断保风险大。三是待遇差距固化，各省的缴费基数、替代率计算、待遇调整幅度不同，地区间差距长期存在。\n\n## 三、费率高待遇低：费基不实与征收漏洞\n\n中国社保的名义费率在全球排得上号。养老保险名义费率24%（雇主16%加雇员8%），加上医疗保险8%左右、失业1%、工伤0.5%、生育0.5%，五险合计超过40%。企业每发100元工资，要额外掏40多元缴社保。\n\n但费率高，待遇却不高。企业退休人员替代率约45%，低于国际建议的55%最低标准。费率和待遇之间的剪刀差，根源在于费基不实。\n\n费基不实的意思是：名义上按工资总额缴费，实际上大量企业按最低基数（当地社平工资的60%）缴费，甚至不缴、少缴、断缴。灵活就业人员、农民工参保率低，缴费基数更低。结果是名义费率24%，实际缴费率可能只有15%到18%。\n\n> **【中国养老保险名义费率24%（全球排名前列），但企业退休替代率仅约45%（低于OE】**CD平均63%）。费率高待遇低的剪刀差根源：一是费基不实（企业按最低基数缴）；二是灵活就业和农民工参保率低；三是转轨成本和空账吞噬了缴费的购买力；四是统筹碎片化导致资金配置效率低。\n\n征收漏洞的另一个表现是逃保。一些企业为了让利润报表好看，不给员工足额缴纳社保，甚至不缴。灵活就业人员，外卖骑手、快递员、网约车司机，参保率更低。这些人群劳动关系模糊，雇主身份不清，社保缴费义务难以落实。2亿多灵活就业人员，参保率不到50%。\n\n灵活就业人群的参保困境是新业态带来的制度挑战。外卖骑手、快递员、网约车司机，这些人的劳动关系模糊，平台说是合作不是雇佣，雇主身份不清，社保缴费义务落在谁头上成了法律难题。2021年美团骑手超千万，全员缴纳社保的不到一成。平台经济创造了大量就业，但这些就业是裸奔的：没有工伤保险、没有养老保险、没有失业保险。一旦骑手出了事故、老了干不动了，社会兜底的是低保和医疗救助，最终还是财政埋单。\n\n农民工是另一个洼地。2024年全国农民工总量近三亿，参加城镇职工养老保险的不到三成。大多数农民工要么参加城乡居民养老保险（月均246元），要么干脆断保。跨省流动时养老保险关系转移接续的麻烦，即后面第九章要讲的便携性损失，让很多农民工选择退保拿回个人账户部分，统筹权益全丢。农民工是缴费人口的潜力股，但制度把他们挡在了门外。\n\n费基不实和征收漏洞叠加，使得名义24%的费率只收上来相当于15%到18%的钱，但养老金是按24%的费率框架设计的。缺口靠财政补贴和累计结余填。\n\n费率高是个老问题，降费也是个老议程。从2015年起，国务院先后五次降低或阶段性降低社保费率：失业保险费率从3%降到1%（阶段性），工伤保险费率多次下调，生育保险并入医保。但真正的大动作是2019年。2019年5月，国办发〔2019〕13号《降低社会保险费率综合方案》出台，核心一条：企业职工基本养老保险单位缴费比例从19%（部分省份20%）统一降至16%。这一降，养老保险总费率从28%降到24%。\n\n降费的同时还调了费基口径。各省城镇单位就业人员平均工资的计算口径统一调整，从非私营单位在岗职工平均工资改为全口径城镇单位就业人员平均工资。这个调整的含金量在于：非私营单位（主要是国企、大企业）工资高，全口径（含私营单位）工资低。换口径后，缴费基数的下限降了，企业实际缴费负担减轻。\n\n2019年降费是做减法，企业每年少缴数千亿。但基金的压力谁来补？答案还是财政。降费让基金收入少了，缺口大了，财政补贴就得往上加。2019年之前财政补贴不到万亿，之后迅速攀升，2024年到了1.93万亿。降费和增补是一枚硬币的两面，企业减负的代价是财政加压。这就是保企业和保基金之间的钢丝：费率不敢再降（基金承压），也不敢再涨（企业承压），只能靠财政补贴补差。\n\n## 四、医保的困局：三重叠加\n\n医疗保险的困局比养老更复杂，因为支出驱动因素是三重叠加的。\n\n第一重，老龄化。人均医疗费随年龄指数级增长，75岁以上人群的人均医疗费是65岁以下的4.4倍。中国60岁以上人口3.1亿且在增长，这意味着医疗总费用的增速快于人口增速。每多一个老人，医保多一份支出，而且是几倍于年轻人的支出。\n\n第二重，医疗通胀。医疗费用增长长期高于CPI。新药、新技术、新设备不断引入，价格高企。一个CT检查、一个靶向药、一个支架，这些在二十年前不存在或极贵的项目，现在成了常规治疗。技术进步带来的费用增长不可逆：不能为了省钱就不用新药新设备，但它们确实推高了支出。\n\n第三重，过度医疗。以药养医、以检查养医的旧体制虽然经过多轮改革，但诱导需求的问题仍未根除。医院多开药、多做检查，收入增加；患者信息不对称，难以判断哪些检查是必要的。DRG/DIP支付方式改革试图从机制上控制，按病种付费而非按项目付费，但执行中仍有变通空间。\n\n> **【2024年职工医保统筹基金支出增速13.5%，远超收入增速4.6%。如果这个差距】**持续，统筹基金当期结余将在五到八年内被逆转。支出增速是收入增速三倍。这不是偶发波动，而是老龄化、医疗通胀、过度医疗三重叠加的结构性压力。来源：国家医保局2024年统计公报。\n\n控费的改革确实在做。国家组织药品集采已开展11批，累计为患者减负超6000亿元。DRG/DIP支付方式改革基本实现全覆盖，按病种付费出院人次占比超90%。\n\n集采压的是价格，同种药品通过集中招标压低价格。DRG压的是单次费用，每个病种有支付限额，超出部分医院承担。这两项改革确实有效，药价降了、单次住院费用降了。\n\n但控的是价不是量。就诊人次在增长，老龄化使就医需求增加；慢性病管理需求在膨胀，高血压、糖尿病等慢病长期服药；技术扩散使更多疾病可治可查，以前不治的现在治了。量的增长最终会吞噬价的控制。\n\n集采和DRG的控费效果需要更细的账。\n\n国家组织药品集采到2025年已开展十一批。第一批4+7试点2018年启动，二十五种药品平均降价六成；此后每批五十种上下，降价幅度多在五成左右；2024年第十批创了新高，平均降幅约七成。十一批累计为患者减负超六千亿元。高值医用耗材另算：心脏支架从一万三降到七百，人工关节降价八成。这些数字看着漂亮，但有个结构性问题：集采压的是价格不是用量。同一种药，价格降了七成，但如果用量翻倍，总费用没降多少。慢性病用药就是典型，高血压、糖尿病患者长期服药，集采把药价打下去了，但慢病人群在增长，服药周期在延长，处方在扩容。价的下降被量的上升对冲了。\n\nDRG/DIP支付方式改革走的另一条路。2022至2024三年行动计划，目标是四个全面覆盖：统筹地区、医疗机构、病种、医保基金全覆盖。2024年底，按病种付费出院人次占比超九成，基金支出占比约八成。2024年7月发布2.0版分组方案，病组更细、权重更准。DRG的逻辑是按病种打包付费：每种病有个支付限额，医院治这种病，低于限额的省下的归自己，超出的自己担。这倒逼医院控成本，少开不必要的检查、少用不必要的药、缩短住院天数。\n\n但DRG也有副作用。医院为了不亏，可能出现推诿重症（重病人费用高容易超限，医院不愿意收），或者分解住院（一个病治到限额就出院，过几天再住院，算两次）。控费机制本身也会被博弈。集采和DRG都是对的，但都不够：控的是价和单次费用，控不了总量。老龄人口在增，慢病在增，就医需求在膨胀。量的增长是结构性的、不可逆的。控价不控量，就像拧小水龙头但水管在加粗，水还是会溢出来。\n\n## 五、六重困境系统梳理\n\n把以上分析汇总，中国大社会保障体系面临六重困境。\n\n**表5：六重困境系统梳理**\n\n| 困境 | 核心机制 | 严重程度 | 详见 |\n|:---:|------|:---:|:---:|\n| 人口结构 | 抚养比2.6:1→1.5:1，婴儿潮退休+生育低谷 | ★★★★★ | 第一章、第二章 |\n| 转轨成本 | 1.9-86万亿隐性债务，空账常态化 | ★★★★★ | 第四章 |\n| 省际失衡 | 广东9:1 vs 黑龙江1.3:1，地理错配 | ★★★★ | 本章第二节 |\n| 费率待遇 | 名义24%但替代率40%，费基不实 | ★★★★ | 本章第三节 |\n| 医保扩张 | 支出增速13.5% vs 收入4.6%，三重叠加 | ★★★★ | 本章第四节 |\n| 财政依赖 | 1.93万亿补贴，占养老收入近1/4 | ★★★★★ | 第一章第五节 |\n\n六重困境不是并列的，它们之间有因果链。人口结构恶化（第一重）是所有困境的总根源；它放大了转轨成本的消化压力（第二重）和省际失衡的分化（第三重）；费基不实（第四重）使名义费率的高水平没有转化为实际收入；医保三重叠加（第五重）使医疗支出增速失控；最后所有困境都汇聚到财政依赖（第六重），万亿级补贴成为最后的兜底。\n\n> **【六重困境的因果链：人口结构恶化（根源）→ 转轨成本消化压力+省际失衡分化 → 费】**基不实使收入不足 → 医保支出增速失控 → 财政补贴万亿级兜底。六重困境形成一个自我强化的恶性循环：缺口越大→补贴越多→财政越紧→改革越难推进→缺口更大。\n\n把因果链拆开看，每一环是怎么强化下一环的。\n\n人口结构恶化是总根源。60岁以上人口3.1亿且在增长，出生人口不到千万且在下降，抚养比从2.6比1滑向1.5比1。人少了，缴费者少了，退休者多了，基金收入增速放缓、支出增速加快。这是第一环放大第二环：转轨成本的消化压力加重。隐性债务本该靠几代人慢慢消化，但现在每代人的消化能力都在被人口结构侵蚀。\n\n转轨成本未显性化分摊，靠当期缴费消化，使费率偏高。这是第二环放大第四环：费率高了，企业和个人逃保的动力更强，费基更不实。费基不实使收入不足，缺口扩大，财政补贴加码，第四环放大第六环。\n\n省际失衡是第三环。人口流出省（东北）抚养比恶化、结余枯竭，人口流入省（广东）结余膨胀。碎片化使结余不能跨省调剂，富省的钱不能补穷省的缺。全国统筹调剂部分缓解，但调剂规模有限。2020年东北三省获调剂超两千亿，但全国缺口是万亿级。调剂只是补窟窿，不改变碎片化的结构。\n\n医保支出增速13.5%是第五环。老龄化加医疗通胀加过度医疗三重叠加，支出增速是收入增速的三倍。医保基金当期结余五年内可能逆转。这又加重财政压力。\n\n最后所有困境汇聚到财政依赖。2024年财政补贴2.63万亿，占社保基金收入21.9%。补贴每年增长8%以上，比财政收入增速快。财政收入增速放缓、土地财政退坡，补贴的扩张空间在收窄。一旦补贴增速跟不上支出增速，缺口就显性化，发不出养老金就是社会风险。\n\n缺口越大、补贴越多、财政越紧、其他公共支出被挤压（教育、科研、基础设施）、经济增长放缓、税基缩小、财政收入增速更慢、补贴能力更弱。这就是恶性循环的闭环。\n\n恶性循环的关键节点在财政依赖。财政补贴1.93万亿，这个数字每年还在增长。当补贴占社保收入的比例从15%升到25%再升到30%以上，财政就不再是补贴而是输血，离开财政，制度就不能运转。\n\n但这六重困境也不是无解的死局。每一重困境都对应着一条改革路径：\n\n- 人口结构 → 延迟退休、生育支持、人力资本提升\n- 转轨成本 → 显性化分摊、划转国有资本\n- 省际失衡 → 全国统筹深化\n- 费率待遇 → 费基做实、征收改革、NDC化提升激励\n- 医保扩张 → 集采、DRG加长护险分流\n- 财政依赖 → 多元筹资、提升基金运营收益\n\n这些路径是下编四章要详述的。\n\n## 六、症结：碎片化\n\n六重困境的共同症结，用两个字概括：碎片化。\n\n三轨并行是身份碎片化，按户籍、编制、就业形式切割保障权益。统筹县级到省级到全国是地理碎片化，按行政区划切割基金池。费基不实是征管碎片化，按企业分散征缴，难以统一标准。医保三重叠加是费用碎片化，养老归养老、医疗归医疗、长护缺位，三者各自膨胀但缺乏协同。财政依赖是筹资碎片化，社保基金、财政补贴、国有资本划转各管各的，缺乏统一的筹资架构。\n\n碎片化最致命的后果不是某一项效率损失，而是它让每一项改革都事倍功半。降费率，但因为费基不实、统筹碎片化，降的费率没有完全传导成企业减负：有的企业该缴不缴，有的企业多缴了却因为统筹层级低而配置效率差。做个人账户改革，但因为空账和碎片化，改革的社会成本（退休人员不满）大于制度收益（做实统筹）。推全国统筹，但因为调剂模式不改变各省各自征缴的结构，调剂力度有限。每一项改革都对，但每一项都被碎片化稀释了效果。\n\n碎片化的对立面是统筹。社会统筹的本质是大数定律：风险池越大，风险分担越有效。2.6亿人的基金池比260万人的基金池抗风险能力强十倍。全国统一基金池比31个省各自的基金池抗风险能力强得多。\n\n中国社会保障制度从1951年到今天，七十多年走了一条从单位碎片化（企业各自保障）到地方碎片化（县级、省级统筹）的漫长道路。下一步必须走的是全国统一：统一基金池、统一费率、统一给付、统一运营。这不是技术活，是制度重构。\n\n从碎片到统一，怎么走？第九章详述。但统一的路上还有一个技术工具不可或缺，即自动调整机制，第十章详述。\n\n中编的镜鉴已经讲完。日本超高龄社会三十年的经验教训（第五章），全球六大模式的谱系与改革趋势（第六章），中国体制症结的系统梳理（本章）。三重视角交汇，指向同一个方向：中国社保的出路不在多收钱，而在改制度，改筹资结构、改统筹层级、改调整机制、改照护维度、改人与制度的关系。\n\n下编四章讲这些改。"}, {"part": "下编", "partName": "出路与方案", "num": "第八章", "title": "增税之外的路径", "md": "\n![](figs/08.png)\n*插图 · 08*\n\n\n## 一、不能只靠多收钱\n\n增税议程的核心思路是“多收钱”：费率涨一点、税基扩一点、补贴多一点。这个思路直觉上合理，缺口1.39万亿，多收1.39万亿不就行了？\n\n但这个思路有三重局限。\n\n一是费率已无上调空间。养老保险名义费率24%，已经从28%降下来了（2019年企业缴费从20%降到16%），加上医疗8%、失业1%、工伤0.5%、生育0.5%，五险合计超过40%。在经济下行、企业利润率收窄的环境下，再涨费率等于挤压企业生存空间，反而导致更多企业逃保断保，费基更不实，收入不增反降。\n\n二是补贴已近财政极限。1.93万亿财政补贴占社保收入近25%，占全国一般公共预算支出9%以上，这个比例还在增长，十年后可能突破15%。财政不是无限的，教育、国防、科技、基础设施都要钱，社保独占一块太大的蛋糕，挤压其他公共支出。\n\n三是单纯增钱不解决制度结构问题。缺口不只是钱不够，更是钱进来和出去的方式有毛病。统筹碎片化使资金配置效率低，个人账户空账使储蓄功能失效，基金运营效率低使存量增值不足，二三支柱覆盖窄使筹资过度依赖第一支柱。这些结构性问题不解决，多收的钱也会被低效配置吞噬。\n\n日本的经验可以佐证。日本在1990年代泡沫破灭后，多次提高社保费率和消费税：1997年消费税从3%提到5%，2014年从5%提到8%，2019年从8%提到10%，每次加税都引发社会不满。但加税填进来的钱，并没有从根本上改变社保的结构性问题，代际断层持续恶化，年轻人负担越来越重，社保占一般岁出的比例从40%升到56%。加税是止血，不是治病。日本走到今天，终于意识到单纯加税不够，2018年提出全世代型社会保障改革，试图从高龄者偏重转向全年龄层均衡，但改革推进艰难。\n\n中国的增税议程如果走日本的老路，不断加费率、加补贴，最终也会面临加无可加的那一天。与其等到那一天，不如现在就开始制度结构改革。多元筹资并非不增钱，而是用更聪明的方式增钱。用国有资产存量补流量缺口，用投资收益替代费率增长，用二三支柱分担第一支柱压力，用费基做实释放降费空间，这些路径的每一条，都比单纯涨费率可持续。\n\n> **【增税议程的三重局限：①费率已无上调空间（五险超40%全球前列）；②补贴已近财政极】**限（1.93万亿占预算9%+）；③增钱不解决制度结构问题（碎片化+空账+运营低效+二三支柱窄）。出路在改制度而非多收钱。\n\n出路在于筹资体系的多维重构：从“单一费率+财政补贴”的旧格局，转向费、划转、运营、二三支柱、费基五路并行。\n\n## 二、划转国有资本：从1.68万亿到持续做大\n\n2017年，国务院决定划转部分国有资本充实社保基金，统一划转10%的国有股权。到2024年，划转工作基本完成，涉及中央和地方国有股权约**1.68万亿元**。\n\n这笔划转的方向正确。中国国有经济规模庞大，国有企业总资产超过300万亿元，净资产超过80万亿元。划转10%股权充实社保，是用国有资产存量补社保流量缺口，也是中国的制度优势，西方国家没有这么大的国有资产可以划转。\n\n但目前的划转有两个局限。\n\n一是规模相对于缺口仍不够。1.68万亿对1.39万亿年缺口来说，看似够补一年多。但缺口是持续的、扩大的，到2035年可能翻倍。1.68万亿是一次性的，缺口是年度的。而且划转的是股权不是现金，社保基金理事会作为股东可以分红，但分红规模取决于国企利润和分红政策。\n\n> **【划转10%国有股权约1.68万亿已基本完成。但股权不等于现金，社保基金理事会可以】**分红，2024年实际可用于社保支出的分红约几百亿元，对1.39万亿年度缺口杯水车薪。划转方向正确，但规模和效率还远远不够。来源：报告04。\n\n二是分红率低。国有企业上缴利润比例偏低，中央金融企业上缴20-25%，一般国企上缴比例更低，大量利润留在企业内部用于再投资或日常开支。如果上缴比例从20%提到40%，划转股权对应的分红收入就能翻倍。\n\n划转的下一步应该是：**持续做大划转规模、提高国企利润上缴率、将部分划转股权变现为高流动性资产。** 不止划10%，可以分批追加划转，用央企混改减持、国有股权划转社保等渠道持续注入。提高上缴率，把国企从利润自留转向利润上缴社保。部分变现，对流动性好的上市公司国有股权，可以直接在市场减持变现，资金进入社保基金投资运营。\n\n## 三、提升基金运营收益：对标GPIF\n\n全国社保基金理事会（SSF）管理的战略储备基金，2024年末资产3.32万亿元，当年投资收益率8.10%，成立24年来年均7.39%。这个收益水平在国内不算差，跑赢了CPI，也跑赢了银行存款，但对标国际同行，差距明显。\n\n日本GPIF（年金积立金管理运用独立行政法人）管理约200万亿日元（约10万亿元人民币）的年金积立金。2014年改革后，GPIF大幅调整资产配置，从保守的以国内债券为主，转向纪律化的多元化配置：\n\n> **【日本GPIF 2014年改革后的目标配置：国内债券35%、国内股票25%、海外债】**券15%、海外股票25%。改革前国内债券占比超60%，改革后降至35%，海外配置合计40%。截至2024年，GPIF累计投资收益约196万亿日元（约10万亿元），相当于积立金本金的近一倍。来源：报告02引用GPIF官网。\n\n挪威GPFG（政府养老基金全球）管理约18万亿挪威克朗（约12万亿元人民币），几乎全部配置海外市场（97%以上），股票配置约70%。\n\n加拿大CPP（加拿大养老金计划投资委员会）管理约5000亿加元（约2.6万亿元人民币），多元化全球配置，近十年年均名义收益率约10%。\n\n对比之下，中国SSF的差距在哪？\n\n一是规模小。SSF的3.32万亿，对GPIF的10万亿、GPFG的12万亿，差距三到四倍。SSF目前定位是战略储备，还没有动用，但如果缺口持续扩大，3.32万亿的缓冲能力有限。\n\n二是境外配置低。SSF境外配置从2022年的9.77%升至2024年的13.18
